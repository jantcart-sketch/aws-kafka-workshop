        &lt;div class=&quot;sub am&quot; style=&quot;margin-top:14px&quot;&gt;cleanup.policy=compact — latest value per key&lt;/div&gt;
        &lt;div class=&quot;card am r r5&quot;&gt;
          &lt;p&gt;Kafka keeps at least the &lt;b&gt;most recent record for every key&lt;/b&gt;, forever. A &lt;code&gt;null&lt;/code&gt; value is a &lt;b&gt;tombstone&lt;/b&gt; — it deletes the key. Rebuild a cache or a whole service's state by reading from 0; the backbone of event sourcing, CQRS read models and reference-data distribution.&lt;/p&gt;
        &lt;/div&gt;
        &lt;pre class=&quot;code r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;k&quot;&gt;retention.ms&lt;/span&gt;=&lt;span class=&quot;v&quot;&gt;604800000&lt;/span&gt;     &lt;span class=&quot;c&quot;&gt;# 7 days&lt;/span&gt;
&lt;span class=&quot;k&quot;&gt;cleanup.policy&lt;/span&gt;=&lt;span class=&quot;v&quot;&gt;delete&lt;/span&gt;       &lt;span class=&quot;c&quot;&gt;# or compact, or &quot;compact,delete&quot;&lt;/span&gt;
&lt;span class=&quot;k&quot;&gt;max.message.bytes&lt;/span&gt;=&lt;span class=&quot;v&quot;&gt;1048576&lt;/span&gt;  &lt;span class=&quot;c&quot;&gt;# 1 MiB default&lt;/span&gt;&lt;/pre&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout amb r r6&quot; style=&quot;margin-top:14px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;▲&lt;/span&gt;&lt;div&gt;&lt;b&gt;Large payloads:&lt;/b&gt; Kafka is not a file transfer system. Put blobs in S3 and publish the &lt;b&gt;pointer plus metadata&lt;/b&gt; as the record — the claim-check pattern. Multi-MB records wreck batching, replication and memory sizing.&lt;/div&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 03h · SCHEMAS --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s3h&quot; data-ch=&quot;3&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Contracts &lt;span class=&quot;num&quot;&gt;/ 03.8&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;The schema is the API.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;In messaging, a payload change is a conversation with the one consumer you know about. With a retained log read by many groups — including replays of &lt;em&gt;old&lt;/em&gt; records by &lt;em&gt;new&lt;/em&gt; code — the payload format becomes a long-lived public contract. This is the discipline that decides whether your platform ages well.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-3&quot;&gt;
      &lt;div class=&quot;card cy r r4&quot;&gt;&lt;h4&gt;Pick a format&lt;/h4&gt;&lt;ul&gt;
        &lt;li&gt;&lt;b&gt;Avro&lt;/b&gt; — compact, schema-first, strong evolution rules. The default choice with a registry.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Protobuf&lt;/b&gt; — compact, great tooling, familiar to service teams.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;JSON Schema&lt;/b&gt; — human-readable, larger on the wire, easiest adoption.&lt;/li&gt;
      &lt;/ul&gt;&lt;/div&gt;
      &lt;div class=&quot;card am r r4&quot;&gt;&lt;h4&gt;Register it&lt;/h4&gt;&lt;ul&gt;
        &lt;li&gt;&lt;b&gt;AWS Glue Schema Registry&lt;/b&gt; — serverless, IAM-governed, native MSK/Flink/Lambda integration.&lt;/li&gt;
        &lt;li&gt;Producers register and embed a schema ID; consumers resolve it — the full schema isn't on every record.&lt;/li&gt;
        &lt;li&gt;Set a &lt;b&gt;compatibility mode&lt;/b&gt; and let CI enforce it.&lt;/li&gt;
      &lt;/ul&gt;&lt;/div&gt;
      &lt;div class=&quot;card vi r r5&quot;&gt;&lt;h4&gt;Evolve it safely&lt;/h4&gt;&lt;ul&gt;
        &lt;li&gt;&lt;b&gt;BACKWARD&lt;/b&gt; — new schema reads old data. Add optional fields with defaults; never remove a required one.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;FORWARD&lt;/b&gt; — old consumers read new data.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;FULL&lt;/b&gt; — both. The right default for a shared platform topic.&lt;/li&gt;
      &lt;/ul&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;body-wrap grid-2&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;code-cap&quot;&gt;Backward-compatible change — add a field with a default&lt;/div&gt;
        &lt;pre class=&quot;code r r5&quot;&gt;{ &lt;span class=&quot;k&quot;&gt;&quot;type&quot;&lt;/span&gt;: &lt;span class=&quot;s&quot;&gt;&quot;record&quot;&lt;/span&gt;, &lt;span class=&quot;k&quot;&gt;&quot;name&quot;&lt;/span&gt;: &lt;span class=&quot;s&quot;&gt;&quot;Order&quot;&lt;/span&gt;,
  &lt;span class=&quot;k&quot;&gt;&quot;fields&quot;&lt;/span&gt;: [
    { &lt;span class=&quot;k&quot;&gt;&quot;name&quot;&lt;/span&gt;: &lt;span class=&quot;s&quot;&gt;&quot;orderId&quot;&lt;/span&gt;,  &lt;span class=&quot;k&quot;&gt;&quot;type&quot;&lt;/span&gt;: &lt;span class=&quot;s&quot;&gt;&quot;string&quot;&lt;/span&gt; },
    { &lt;span class=&quot;k&quot;&gt;&quot;name&quot;&lt;/span&gt;: &lt;span class=&quot;s&quot;&gt;&quot;amount&quot;&lt;/span&gt;,   &lt;span class=&quot;k&quot;&gt;&quot;type&quot;&lt;/span&gt;: &lt;span class=&quot;s&quot;&gt;&quot;double&quot;&lt;/span&gt; },
    { &lt;span class=&quot;k&quot;&gt;&quot;name&quot;&lt;/span&gt;: &lt;span class=&quot;s&quot;&gt;&quot;channel&quot;&lt;/span&gt;,  &lt;span class=&quot;k&quot;&gt;&quot;type&quot;&lt;/span&gt;: &lt;span class=&quot;s&quot;&gt;&quot;string&quot;&lt;/span&gt;,
      &lt;span class=&quot;k&quot;&gt;&quot;default&quot;&lt;/span&gt;: &lt;span class=&quot;v&quot;&gt;&quot;unknown&quot;&lt;/span&gt; }   &lt;span class=&quot;c&quot;&gt;// ← safe addition&lt;/span&gt;
  ] }&lt;/pre&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;callout warn r r6&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✕&lt;/span&gt;&lt;div&gt;&lt;b&gt;Breaking changes&lt;/b&gt; — renaming a field, narrowing a type, removing a required field, or changing semantics while keeping the name. The last one is the dangerous one: the registry can't catch it, and every replay of old data will be wrong.&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;callout good r r6&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✓&lt;/span&gt;&lt;div&gt;&lt;b&gt;Do this from the first topic.&lt;/b&gt; Retrofitting schema governance onto twenty live topics with unknown consumers is the most expensive avoidable lesson in this space.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 03i · KAFKA ON AWS --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s3i&quot; data-ch=&quot;3&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;On AWS &lt;span class=&quot;num&quot;&gt;/ 03.9&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Kafka on AWS —&lt;br&gt;what you actually run.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;Amazon MSK runs &lt;b&gt;open-source Apache Kafka&lt;/b&gt;: same protocol, same clients, same topic configs, no code lock-in. What AWS takes over is brokers, patching, replication across AZs, metadata, monitoring and recovery. Choose the flavour by how much control you need.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-3&quot;&gt;
      &lt;div class=&quot;card cy r r4&quot;&gt;&lt;h4&gt;MSK Provisioned&lt;/h4&gt;&lt;p class=&quot;k-cyan&quot; style=&quot;font-size:11px;letter-spacing:.1em&quot;&gt;YOU PICK THE BROKERS&lt;/p&gt;&lt;p&gt;Choose instance type and count; control broker and topic configuration. &lt;b&gt;Express brokers&lt;/b&gt; give you much higher throughput per broker and faster recovery. &lt;b&gt;Tiered storage&lt;/b&gt; for long retention. The default for serious production workloads.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card am r r4&quot;&gt;&lt;h4&gt;MSK Serverless&lt;/h4&gt;&lt;p class=&quot;k-amber&quot; style=&quot;font-size:11px;letter-spacing:.1em&quot;&gt;NO CAPACITY DECISIONS&lt;/p&gt;&lt;p&gt;No brokers to size, throughput scales automatically, pay for what you use. IAM authentication only. Excellent for workshops, dev/test, spiky or unknown workloads — check the current per-cluster quotas before you commit production to it.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card vi r r5&quot;&gt;&lt;h4&gt;Self-managed on EC2/EKS&lt;/h4&gt;&lt;p class=&quot;k-violet&quot; style=&quot;font-size:11px;letter-spacing:.1em&quot;&gt;TOTAL CONTROL, TOTAL OWNERSHIP&lt;/p&gt;&lt;p&gt;You run brokers, upgrades, rebalancing and recovery. Choose it when you need a specific distribution or feature AWS doesn't expose yet — and you have the team to operate it.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;body-wrap grid-2&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub am&quot;&gt;The ecosystem you get around it&lt;/div&gt;
        &lt;div class=&quot;card am r r5&quot;&gt;&lt;ul&gt;
          &lt;li&gt;&lt;b&gt;MSK Connect&lt;/b&gt; — managed Kafka Connect for source/sink connectors (CDC in, S3/OpenSearch out) without running Connect workers.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;MSK Replicator&lt;/b&gt; — cross-region/cross-cluster replication for DR and migration.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Managed Service for Apache Flink&lt;/b&gt; — stateful stream processing, SQL or Java, over your topics.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Lambda event source mapping&lt;/b&gt; — serverless consumers with batching and a failure destination.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Firehose &amp;amp; Glue&lt;/b&gt; — land topics in S3/Redshift/OpenSearch; schema registry for contracts.&lt;/li&gt;
        &lt;/ul&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub&quot;&gt;Security, which is not optional&lt;/div&gt;
        &lt;div class=&quot;card cy r r6&quot;&gt;&lt;ul&gt;
          &lt;li&gt;&lt;b&gt;IAM authentication &amp;amp; authorization&lt;/b&gt; — the native AWS path; policies instead of ACLs.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;SASL/SCRAM&lt;/b&gt; via Secrets Manager, or &lt;b&gt;mTLS&lt;/b&gt; via ACM Private CA for existing clients.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;TLS in transit&lt;/b&gt;, KMS encryption at rest, private VPC subnets — on by default or one setting away.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;CloudWatch + Prometheus&lt;/b&gt; metrics; consumer lag is the metric to alarm on.&lt;/li&gt;
        &lt;/ul&gt;&lt;/div&gt;
        &lt;div class=&quot;callout note r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;◆&lt;/span&gt;&lt;div&gt;Today's labs run on &lt;b&gt;MSK Serverless with IAM auth&lt;/b&gt; — fewest moving parts. Every command works unchanged against provisioned MSK, Confluent or self-managed Kafka; only the client config block differs.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;
  &lt;!-- ============ CHAPTER 04 ============ --&gt;
  &lt;section class=&quot;slide chapter&quot; id=&quot;ch4&quot; data-ch=&quot;4&quot;&gt;
    &lt;div class=&quot;ch-ghost&quot;&gt;04&lt;/div&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Chapter 04 · Hands-on&lt;/div&gt;
    &lt;h2 class=&quot;ch-title r r2&quot;&gt;Lab 1 — your first&lt;br&gt;event &lt;span class=&quot;k-cyan&quot;&gt;stream&lt;/span&gt;.&lt;/h2&gt;
    &lt;p class=&quot;ch-q r r3&quot;&gt;The goal: by the end of this lab you will have &lt;b&gt;produced keyed records, consumed them, and read your own offsets&lt;/b&gt; — and you'll have seen with your own eyes that consuming didn't delete anything.&lt;/p&gt;
    &lt;div class=&quot;ch-list&quot;&gt;
      &lt;div class=&quot;ch-item r r4&quot;&gt;&lt;b&gt;1 · Connect&lt;/b&gt;Bootstrap brokers, IAM client config, verify.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r4&quot;&gt;&lt;b&gt;2 · Create a topic&lt;/b&gt;Three partitions, named &lt;code&gt;orders&lt;/code&gt;.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r5&quot;&gt;&lt;b&gt;3 · Produce&lt;/b&gt;Keyed records from the console producer.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r5&quot;&gt;&lt;b&gt;4 · Consume&lt;/b&gt;Watch key, partition and offset.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r6&quot;&gt;&lt;b&gt;5 · Inspect&lt;/b&gt;Describe the group; read the lag.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ch-budget r r6&quot;&gt;Budget &lt;b&gt;30 min&lt;/b&gt; · pairs, swap at step 4&lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 04a · SETUP --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s4a&quot; data-ch=&quot;4&quot;&gt;
    &lt;div class=&quot;labtag r r1&quot;&gt;&lt;span class=&quot;d&quot;&gt;&lt;/span&gt;Lab 1 · Step 0 — connect&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Get a terminal talking&lt;br&gt;to the cluster.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;Five minutes. If you're blocked after five, raise a hand and pair with a neighbour — do not spend the lab debugging a client.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-2&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub&quot;&gt;Environment&lt;/div&gt;
        &lt;div class=&quot;card cy r r4&quot;&gt;&lt;ul&gt;
          &lt;li&gt;Kafka CLI tools unpacked (&lt;code&gt;bin/kafka-topics.sh&lt;/code&gt; and friends) on an EC2/Cloud9 host in the cluster's VPC.&lt;/li&gt;
          &lt;li&gt;The &lt;b&gt;MSK IAM auth&lt;/b&gt; JAR on the classpath (&lt;code&gt;aws-msk-iam-auth-*-all.jar&lt;/code&gt; in &lt;code&gt;libs/&lt;/code&gt;).&lt;/li&gt;
          &lt;li&gt;An instance role or credentials with MSK data-plane permissions.&lt;/li&gt;
          &lt;li&gt;Java 17+ available on the path.&lt;/li&gt;
        &lt;/ul&gt;&lt;/div&gt;
        &lt;div class=&quot;code-cap&quot; style=&quot;margin-top:14px&quot;&gt;Get the bootstrap string&lt;/div&gt;
        &lt;pre class=&quot;code r r5&quot;&gt;&lt;span class=&quot;f&quot;&gt;aws&lt;/span&gt; kafka get-bootstrap-brokers \
  --cluster-arn &lt;span class=&quot;v&quot;&gt;$CLUSTER_ARN&lt;/span&gt; \
  --query &lt;span class=&quot;s&quot;&gt;BootstrapBrokerStringSaslIam&lt;/span&gt; --output text

&lt;span class=&quot;k&quot;&gt;export&lt;/span&gt; BS=&lt;span class=&quot;s&quot;&gt;&quot;b-1...:9098,b-2...:9098&quot;&lt;/span&gt;&lt;/pre&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;code-cap&quot;&gt;client.properties — IAM auth&lt;/div&gt;
        &lt;pre class=&quot;code r r5&quot;&gt;&lt;span class=&quot;k&quot;&gt;security.protocol&lt;/span&gt;=&lt;span class=&quot;v&quot;&gt;SASL_SSL&lt;/span&gt;
&lt;span class=&quot;k&quot;&gt;sasl.mechanism&lt;/span&gt;=&lt;span class=&quot;v&quot;&gt;AWS_MSK_IAM&lt;/span&gt;
&lt;span class=&quot;k&quot;&gt;sasl.jaas.config&lt;/span&gt;=&lt;span class=&quot;v&quot;&gt;software.amazon.msk.auth.iam.IAMLoginModule required;&lt;/span&gt;
&lt;span class=&quot;k&quot;&gt;sasl.client.callback.handler.class&lt;/span&gt;=&lt;span class=&quot;v&quot;&gt;software.amazon.msk.auth.iam.IAMClientCallbackHandler&lt;/span&gt;&lt;/pre&gt;
        &lt;div class=&quot;code-cap&quot; style=&quot;margin-top:14px&quot;&gt;Verify — this should return without error&lt;/div&gt;
        &lt;pre class=&quot;code r r6&quot;&gt;bin/kafka-topics.sh --bootstrap-server &lt;span class=&quot;v&quot;&gt;$BS&lt;/span&gt; \
  --command-config client.properties --list&lt;/pre&gt;
        &lt;div class=&quot;callout note r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;◆&lt;/span&gt;&lt;div&gt;&lt;b&gt;Not on MSK?&lt;/b&gt; Everything after this slide is identical — drop &lt;code&gt;--command-config&lt;/code&gt; for a local/plaintext cluster, or point it at your own SASL/mTLS properties file.&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;callout warn r r6&quot; style=&quot;margin-top:10px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✕&lt;/span&gt;&lt;div&gt;&lt;b&gt;Timeout on connect&lt;/b&gt; is almost always network, not auth: wrong VPC/subnet, security group not allowing &lt;b&gt;9098&lt;/b&gt; from your host, or the wrong bootstrap port.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 04b · THE LAB STEPS --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s4b&quot; data-ch=&quot;4&quot;&gt;
    &lt;div class=&quot;labtag r r1&quot;&gt;&lt;span class=&quot;d&quot;&gt;&lt;/span&gt;Lab 1 · Steps 1–5 — the work&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Produce, consume,&lt;br&gt;then look at the &lt;span class=&quot;k-amber&quot;&gt;offsets&lt;/span&gt;.&lt;/h2&gt;
    &lt;div class=&quot;body-wrap grid-52&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub&quot;&gt;Run these in order — two terminals&lt;/div&gt;
        &lt;ol class=&quot;labsteps r r3&quot;&gt;
          &lt;li&gt;&lt;b&gt;Create the topic.&lt;/b&gt; Three partitions so you can see keys spread.
            &lt;pre class=&quot;code&quot; style=&quot;margin-top:7px&quot;&gt;bin/kafka-topics.sh --bootstrap-server &lt;span class=&quot;v&quot;&gt;$BS&lt;/span&gt; \
  --command-config client.properties \
  --create --topic &lt;span class=&quot;s&quot;&gt;orders&lt;/span&gt; --partitions &lt;span class=&quot;v&quot;&gt;3&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;# provisioned MSK / self-managed: add --replication-factor 3&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;# MSK Serverless manages replication for you — omit it&lt;/span&gt;&lt;/pre&gt;&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Describe it.&lt;/b&gt; Note the leader and the replica/ISR list per partition.
            &lt;pre class=&quot;code&quot; style=&quot;margin-top:7px&quot;&gt;bin/kafka-topics.sh --bootstrap-server &lt;span class=&quot;v&quot;&gt;$BS&lt;/span&gt; \
  --command-config client.properties --describe --topic &lt;span class=&quot;s&quot;&gt;orders&lt;/span&gt;&lt;/pre&gt;&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Produce keyed records&lt;/b&gt; in terminal 1. Type a few lines, reusing some keys.
            &lt;pre class=&quot;code&quot; style=&quot;margin-top:7px&quot;&gt;bin/kafka-console-producer.sh --bootstrap-server &lt;span class=&quot;v&quot;&gt;$BS&lt;/span&gt; \
  --producer.config client.properties --topic &lt;span class=&quot;s&quot;&gt;orders&lt;/span&gt; \
  --property &lt;span class=&quot;k&quot;&gt;parse.key&lt;/span&gt;=&lt;span class=&quot;v&quot;&gt;true&lt;/span&gt; --property &lt;span class=&quot;k&quot;&gt;key.separator&lt;/span&gt;=&lt;span class=&quot;v&quot;&gt;:&lt;/span&gt;

&lt;span class=&quot;s&quot;&gt;cust-1:{&quot;orderId&quot;:&quot;A1&quot;,&quot;amount&quot;:42.00}&lt;/span&gt;
&lt;span class=&quot;s&quot;&gt;cust-2:{&quot;orderId&quot;:&quot;A2&quot;,&quot;amount&quot;:17.50}&lt;/span&gt;
&lt;span class=&quot;s&quot;&gt;cust-1:{&quot;orderId&quot;:&quot;A3&quot;,&quot;amount&quot;:99.95}&lt;/span&gt;&lt;/pre&gt;&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Consume from the beginning&lt;/b&gt; in terminal 2, printing metadata.
            &lt;pre class=&quot;code&quot; style=&quot;margin-top:7px&quot;&gt;bin/kafka-console-consumer.sh --bootstrap-server &lt;span class=&quot;v&quot;&gt;$BS&lt;/span&gt; \
  --consumer.config client.properties --topic &lt;span class=&quot;s&quot;&gt;orders&lt;/span&gt; \
  --group &lt;span class=&quot;s&quot;&gt;lab-consumer&lt;/span&gt; --from-beginning \
  --property &lt;span class=&quot;k&quot;&gt;print.key&lt;/span&gt;=&lt;span class=&quot;v&quot;&gt;true&lt;/span&gt; --property &lt;span class=&quot;k&quot;&gt;print.partition&lt;/span&gt;=&lt;span class=&quot;v&quot;&gt;true&lt;/span&gt; \
  --property &lt;span class=&quot;k&quot;&gt;print.offset&lt;/span&gt;=&lt;span class=&quot;v&quot;&gt;true&lt;/span&gt;&lt;/pre&gt;&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Stop the consumer (Ctrl-C) and inspect the group.&lt;/b&gt; This is the payoff.
            &lt;pre class=&quot;code&quot; style=&quot;margin-top:7px&quot;&gt;bin/kafka-consumer-groups.sh --bootstrap-server &lt;span class=&quot;v&quot;&gt;$BS&lt;/span&gt; \
  --command-config client.properties \
  --describe --group &lt;span class=&quot;s&quot;&gt;lab-consumer&lt;/span&gt;&lt;/pre&gt;&lt;/li&gt;
        &lt;/ol&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;stage short pad r r4&quot; id=&quot;stage-feed&quot;&gt;
          &lt;span class=&quot;stage-label&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;what your consumer output looks like&lt;/span&gt;
          &lt;div id=&quot;labfeed&quot; style=&quot;position:absolute;inset:46px 16px 16px;font-size:11.5px;line-height:1.85;color:var(--muted);overflow:hidden&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;sub am&quot; style=&quot;margin-top:16px&quot;&gt;Checkpoints — tick these off&lt;/div&gt;
        &lt;ul class=&quot;check r r5&quot;&gt;
          &lt;li&gt;&lt;b&gt;Same key, same partition.&lt;/b&gt; Both &lt;code&gt;cust-1&lt;/code&gt; records landed in one partition, in order.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Offsets are per partition.&lt;/b&gt; They start at 0 in each, and they're dense and monotonic.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;CURRENT-OFFSET, LOG-END-OFFSET, LAG&lt;/b&gt; appear in the group description. Lag should be 0.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Restart the consumer without &lt;code&gt;--from-beginning&lt;/code&gt;&lt;/b&gt; → nothing arrives. It resumed from its committed offset.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Restart it with a brand-new &lt;code&gt;--group&lt;/code&gt;&lt;/b&gt; → everything arrives again. &lt;b&gt;Nothing was consumed away.&lt;/b&gt;&lt;/li&gt;
        &lt;/ul&gt;
        &lt;div class=&quot;callout good r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✓&lt;/span&gt;&lt;div&gt;That last pair of checkpoints &lt;em&gt;is&lt;/em&gt; the whole workshop in two commands. Try them before moving on.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 04c · DEBRIEF --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s4c&quot; data-ch=&quot;4&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Lab 1 Debrief &lt;span class=&quot;num&quot;&gt;/ 04.3&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;What just happened.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;Five minutes together before Lab 2. Each of these observations is a line from Chapter 02 that you've now verified yourself.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-3&quot;&gt;
      &lt;div class=&quot;card cy r r4&quot;&gt;&lt;h4&gt;You wrote to a log&lt;/h4&gt;&lt;p&gt;The producer appended to the end of one partition per record, chosen by the key's hash. No consumer had to exist — the data was durable regardless.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card am r r4&quot;&gt;&lt;h4&gt;You held a cursor&lt;/h4&gt;&lt;p&gt;&lt;code&gt;--from-beginning&lt;/code&gt; only mattered the first time: after that your group had a committed offset, and Kafka resumed from it. The broker tracked one number, not three messages.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card vi r r5&quot;&gt;&lt;h4&gt;A new group saw history&lt;/h4&gt;&lt;p&gt;Changing &lt;code&gt;--group&lt;/code&gt; gave you the entire topic again, with no change to the producer and no effect on the first group. That's fan-out with zero coordination.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card cy r r5&quot;&gt;&lt;h4&gt;Lag became visible&lt;/h4&gt;&lt;p&gt;&lt;code&gt;kafka-consumer-groups --describe&lt;/code&gt; showed exactly how far behind each partition's consumer was. In production this is your primary health metric.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card am r r6&quot;&gt;&lt;h4&gt;Ordering was per key&lt;/h4&gt;&lt;p&gt;&lt;code&gt;cust-1&lt;/code&gt;'s two orders stayed in order relative to each other, but not relative to &lt;code&gt;cust-2&lt;/code&gt;'s. If that's wrong for your domain, your key is wrong.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card rd r r6&quot;&gt;&lt;h4&gt;Questions to hold&lt;/h4&gt;&lt;p&gt;&quot;How do I retry one bad record?&quot; and &quot;What if the payload format changes?&quot; — both land in Lab 2 and Chapter 06. Write them down now.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout amb r r6&quot; style=&quot;margin-top:16px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;▲&lt;/span&gt;&lt;div&gt;&lt;b&gt;Break — 10 minutes.&lt;/b&gt; Leave your terminals open; Lab 2 continues on the same &lt;code&gt;orders&lt;/code&gt; topic.&lt;/div&gt;&lt;/div&gt;
  &lt;/section&gt;
  &lt;!-- ============ CHAPTER 05 ============ --&gt;
  &lt;section class=&quot;slide chapter&quot; id=&quot;ch5&quot; data-ch=&quot;5&quot;&gt;
    &lt;div class=&quot;ch-ghost&quot;&gt;05&lt;/div&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Chapter 05 · Hands-on&lt;/div&gt;
    &lt;h2 class=&quot;ch-title r r2&quot;&gt;Lab 2 — replay,&lt;br&gt;groups &amp;amp; &lt;span class=&quot;k-amber&quot;&gt;evolution&lt;/span&gt;.&lt;/h2&gt;
    &lt;p class=&quot;ch-q r r3&quot;&gt;The goal: exercise the three capabilities that classic messaging does not have — &lt;b&gt;replay from an arbitrary point, independent parallel consumers, and a payload contract that can change safely&lt;/b&gt;.&lt;/p&gt;
    &lt;div class=&quot;ch-list&quot;&gt;
      &lt;div class=&quot;ch-item r r4&quot;&gt;&lt;b&gt;1 · Two groups, one topic&lt;/b&gt;Independent positions, no coordination.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r4&quot;&gt;&lt;b&gt;2 · Replay&lt;/b&gt;Reset offsets to earliest, and to a timestamp.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r5&quot;&gt;&lt;b&gt;3 · Scale &amp;amp; rebalance&lt;/b&gt;Add consumers; find the partition ceiling.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r5&quot;&gt;&lt;b&gt;4 · Compaction&lt;/b&gt;Build a topic that behaves like a table.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r6&quot;&gt;&lt;b&gt;5 · Evolution&lt;/b&gt;Add a field without breaking a consumer.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ch-budget r r6&quot;&gt;Budget &lt;b&gt;35 min&lt;/b&gt; · swap driver at step 3&lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 05a · REPLAY (interactive) --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s5a&quot; data-ch=&quot;5&quot;&gt;
    &lt;div class=&quot;labtag r r1&quot;&gt;&lt;span class=&quot;d&quot;&gt;&lt;/span&gt;Lab 2 · Steps 1–2 — groups &amp;amp; replay&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Replay is just&lt;br&gt;moving a &lt;span class=&quot;k-cyan&quot;&gt;number&lt;/span&gt;.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;Two independent groups on one topic, then rewind one of them. Note that the producer is untouched and group A never notices.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-52&quot;&gt;
      &lt;div class=&quot;stage mid r r4&quot; id=&quot;stage-replay&quot;&gt;
        &lt;span class=&quot;stage-label&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;group A live at head · rewind group B&lt;/span&gt;
        &lt;svg viewBox=&quot;0 0 640 360&quot; id=&quot;replaysvg&quot;&gt;&lt;/svg&gt;
        &lt;button class=&quot;stage-btn am&quot; id=&quot;replayBtn&quot;&gt;Reset B to earliest ⟲&lt;/button&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;code-cap&quot;&gt;1 · A second, independent group&lt;/div&gt;
        &lt;pre class=&quot;code r r5&quot;&gt;bin/kafka-console-consumer.sh --bootstrap-server &lt;span class=&quot;v&quot;&gt;$BS&lt;/span&gt; \
  --consumer.config client.properties --topic &lt;span class=&quot;s&quot;&gt;orders&lt;/span&gt; \
  --group &lt;span class=&quot;s&quot;&gt;analytics&lt;/span&gt; --from-beginning&lt;/pre&gt;
        &lt;div class=&quot;code-cap&quot; style=&quot;margin-top:14px&quot;&gt;2 · Rewind it — group must be stopped first&lt;/div&gt;
        &lt;pre class=&quot;code r r6&quot;&gt;bin/kafka-consumer-groups.sh --bootstrap-server &lt;span class=&quot;v&quot;&gt;$BS&lt;/span&gt; \
  --command-config client.properties --group &lt;span class=&quot;s&quot;&gt;analytics&lt;/span&gt; \
  --topic &lt;span class=&quot;s&quot;&gt;orders&lt;/span&gt; --reset-offsets --to-earliest --execute

&lt;span class=&quot;c&quot;&gt;# or to a point in time:&lt;/span&gt;
  --reset-offsets --to-datetime &lt;span class=&quot;v&quot;&gt;2026-10-09T09:00:00.000&lt;/span&gt; --execute
&lt;span class=&quot;c&quot;&gt;# or relative:&lt;/span&gt;
  --reset-offsets --shift-by &lt;span class=&quot;v&quot;&gt;-50&lt;/span&gt; --execute
&lt;span class=&quot;c&quot;&gt;# drop --execute for --dry-run to preview&lt;/span&gt;&lt;/pre&gt;
        &lt;div class=&quot;callout good r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✓&lt;/span&gt;&lt;div&gt;&lt;b&gt;Checkpoint:&lt;/b&gt; &lt;code&gt;analytics&lt;/code&gt; re-reads every record while &lt;code&gt;lab-consumer&lt;/code&gt; stays at lag 0. Two teams, one dataset, zero coordination — and no DLQ, archive or re-publish was involved.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 05b · SCALE &amp; REBALANCE --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s5b&quot; data-ch=&quot;5&quot;&gt;
    &lt;div class=&quot;labtag r r1&quot;&gt;&lt;span class=&quot;d&quot;&gt;&lt;/span&gt;Lab 2 · Step 3 — scale out, hit the ceiling&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Find the partition ceiling&lt;br&gt;on purpose.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;Start three consumers in &lt;em&gt;one&lt;/em&gt; group, then a fourth. The fourth will get nothing, because the topic has three partitions. Better to learn this here than in an incident.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-2&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;code-cap&quot;&gt;Run in three (then four) terminals — same group&lt;/div&gt;
        &lt;pre class=&quot;code r r4&quot;&gt;bin/kafka-console-consumer.sh --bootstrap-server &lt;span class=&quot;v&quot;&gt;$BS&lt;/span&gt; \
  --consumer.config client.properties --topic &lt;span class=&quot;s&quot;&gt;orders&lt;/span&gt; \
  --group &lt;span class=&quot;s&quot;&gt;scaleout&lt;/span&gt; --property &lt;span class=&quot;k&quot;&gt;print.partition&lt;/span&gt;=&lt;span class=&quot;v&quot;&gt;true&lt;/span&gt;&lt;/pre&gt;
        &lt;div class=&quot;code-cap&quot; style=&quot;margin-top:14px&quot;&gt;Watch the assignment, then add partitions&lt;/div&gt;
        &lt;pre class=&quot;code r r5&quot;&gt;bin/kafka-consumer-groups.sh --bootstrap-server &lt;span class=&quot;v&quot;&gt;$BS&lt;/span&gt; \
  --command-config client.properties --describe --group &lt;span class=&quot;s&quot;&gt;scaleout&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;# CONSUMER-ID column shows who owns which partition&lt;/span&gt;

bin/kafka-topics.sh --bootstrap-server &lt;span class=&quot;v&quot;&gt;$BS&lt;/span&gt; \
  --command-config client.properties \
  --alter --topic &lt;span class=&quot;s&quot;&gt;orders&lt;/span&gt; --partitions &lt;span class=&quot;v&quot;&gt;6&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;# partitions can only ever go UP, never down&lt;/span&gt;&lt;/pre&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub am&quot;&gt;Checkpoints&lt;/div&gt;
        &lt;ul class=&quot;check r r5&quot;&gt;
          &lt;li&gt;With 3 consumers in &lt;code&gt;scaleout&lt;/code&gt;, each owns &lt;b&gt;exactly one&lt;/b&gt; partition.&lt;/li&gt;
          &lt;li&gt;The &lt;b&gt;4th consumer idles&lt;/b&gt; — it appears in the group with no assignment.&lt;/li&gt;
          &lt;li&gt;Starting or killing a consumer triggers a &lt;b&gt;rebalance&lt;/b&gt;: a short pause, then a new assignment.&lt;/li&gt;
          &lt;li&gt;After &lt;code&gt;--partitions 6&lt;/code&gt;, the idle consumer picks up work on the next rebalance.&lt;/li&gt;
          &lt;li&gt;Produce more &lt;code&gt;cust-1&lt;/code&gt; records: they may now land in a &lt;b&gt;different partition&lt;/b&gt; than before.&lt;/li&gt;
        &lt;/ul&gt;
        &lt;div class=&quot;callout warn r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✕&lt;/span&gt;&lt;div&gt;&lt;b&gt;That last checkpoint is the lesson.&lt;/b&gt; &lt;code&gt;hash(key) mod 6 ≠ hash(key) mod 3&lt;/code&gt;, so repartitioning splits a key's history across two partitions and breaks per-key ordering for anything spanning the change. Plan partition counts for peak; don't treat them as an elastic knob.&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;callout note r r6&quot; style=&quot;margin-top:10px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;◆&lt;/span&gt;&lt;div&gt;Rule of thumb: partitions ≥ your expected peak consumer count, with headroom. Thousands of partitions per cluster is normal; tens of thousands has costs.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 05c · COMPACTION --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s5c&quot; data-ch=&quot;5&quot;&gt;
    &lt;div class=&quot;labtag r r1&quot;&gt;&lt;span class=&quot;d&quot;&gt;&lt;/span&gt;Lab 2 · Step 4 — a topic that is a table&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Compaction, hands on.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;Create a compacted topic, write two values for the same key, and read it as current state. This is the mechanism behind &quot;rebuild my cache from the topic&quot;.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-2&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;code-cap&quot;&gt;Create a compacted topic&lt;/div&gt;
        &lt;pre class=&quot;code r r4&quot;&gt;bin/kafka-topics.sh --bootstrap-server &lt;span class=&quot;v&quot;&gt;$BS&lt;/span&gt; \
  --command-config client.properties --create \
  --topic &lt;span class=&quot;s&quot;&gt;customers&lt;/span&gt; --partitions &lt;span class=&quot;v&quot;&gt;3&lt;/span&gt; \
  --config &lt;span class=&quot;k&quot;&gt;cleanup.policy&lt;/span&gt;=&lt;span class=&quot;v&quot;&gt;compact&lt;/span&gt; \
  --config &lt;span class=&quot;k&quot;&gt;min.cleanable.dirty.ratio&lt;/span&gt;=&lt;span class=&quot;v&quot;&gt;0.01&lt;/span&gt; \
  --config &lt;span class=&quot;k&quot;&gt;segment.ms&lt;/span&gt;=&lt;span class=&quot;v&quot;&gt;10000&lt;/span&gt;   &lt;span class=&quot;c&quot;&gt;# compact quickly, for the demo&lt;/span&gt;&lt;/pre&gt;
        &lt;div class=&quot;code-cap&quot; style=&quot;margin-top:14px&quot;&gt;Write, overwrite, tombstone&lt;/div&gt;
        &lt;pre class=&quot;code r r5&quot;&gt;bin/kafka-console-producer.sh --bootstrap-server &lt;span class=&quot;v&quot;&gt;$BS&lt;/span&gt; \
  --producer.config client.properties --topic &lt;span class=&quot;s&quot;&gt;customers&lt;/span&gt; \
  --property &lt;span class=&quot;k&quot;&gt;parse.key&lt;/span&gt;=&lt;span class=&quot;v&quot;&gt;true&lt;/span&gt; --property &lt;span class=&quot;k&quot;&gt;key.separator&lt;/span&gt;=&lt;span class=&quot;v&quot;&gt;:&lt;/span&gt;

&lt;span class=&quot;s&quot;&gt;cust-1:{&quot;tier&quot;:&quot;silver&quot;}&lt;/span&gt;
&lt;span class=&quot;s&quot;&gt;cust-1:{&quot;tier&quot;:&quot;gold&quot;}&lt;/span&gt;      &lt;span class=&quot;c&quot;&gt;# supersedes the previous value&lt;/span&gt;
&lt;span class=&quot;s&quot;&gt;cust-2:{&quot;tier&quot;:&quot;bronze&quot;}&lt;/span&gt;
&lt;span class=&quot;s&quot;&gt;cust-2:&lt;/span&gt;                     &lt;span class=&quot;c&quot;&gt;# empty value = tombstone = delete&lt;/span&gt;&lt;/pre&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;code-cap&quot;&gt;Read it as a table&lt;/div&gt;
        &lt;pre class=&quot;code r r5&quot;&gt;bin/kafka-console-consumer.sh --bootstrap-server &lt;span class=&quot;v&quot;&gt;$BS&lt;/span&gt; \
  --consumer.config client.properties --topic &lt;span class=&quot;s&quot;&gt;customers&lt;/span&gt; \
  --from-beginning --property &lt;span class=&quot;k&quot;&gt;print.key&lt;/span&gt;=&lt;span class=&quot;v&quot;&gt;true&lt;/span&gt; \
  --group &lt;span class=&quot;s&quot;&gt;state-rebuild&lt;/span&gt;&lt;/pre&gt;
        &lt;div class=&quot;sub am&quot; style=&quot;margin-top:14px&quot;&gt;Checkpoints&lt;/div&gt;
        &lt;ul class=&quot;check r r6&quot;&gt;
          &lt;li&gt;Immediately after writing, you see &lt;b&gt;both&lt;/b&gt; &lt;code&gt;cust-1&lt;/code&gt; values — compaction is asynchronous, not transactional.&lt;/li&gt;
          &lt;li&gt;Wait for a compaction cycle, then re-read with a &lt;b&gt;new group&lt;/b&gt;: only &lt;code&gt;tier&quot;:&quot;gold&quot;&lt;/code&gt; survives.&lt;/li&gt;
          &lt;li&gt;&lt;code&gt;cust-2&lt;/code&gt; disappears entirely after its tombstone is compacted.&lt;/li&gt;
          &lt;li&gt;Reading from offset 0 reconstructs &lt;b&gt;current state for every key&lt;/b&gt; — no database query involved.&lt;/li&gt;
        &lt;/ul&gt;
        &lt;div class=&quot;callout good r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✓&lt;/span&gt;&lt;div&gt;&lt;b&gt;Where you'll use this:&lt;/b&gt; reference data distribution, feature flags, customer/product master data, and any service that wants a local read-only replica it can rebuild on startup.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 05d · SCHEMA EVOLUTION --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s5d&quot; data-ch=&quot;5&quot;&gt;
    &lt;div class=&quot;labtag r r1&quot;&gt;&lt;span class=&quot;d&quot;&gt;&lt;/span&gt;Lab 2 · Step 5 — change the contract safely&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Evolve the payload&lt;br&gt;without breaking a reader.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;The last exercise, and the one with the longest shadow. Register a schema, produce against it, add an optional field, and prove the old consumer still works — including on old records.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-2&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;code-cap&quot;&gt;Producer/consumer config — AWS Glue Schema Registry&lt;/div&gt;
        &lt;pre class=&quot;code r r4&quot;&gt;&lt;span class=&quot;c&quot;&gt;# producer&lt;/span&gt;
&lt;span class=&quot;k&quot;&gt;value.serializer&lt;/span&gt;=&lt;span class=&quot;v&quot;&gt;com.amazonaws.services.schemaregistry\
  .serializers.GlueSchemaRegistryKafkaSerializer&lt;/span&gt;
&lt;span class=&quot;k&quot;&gt;dataFormat&lt;/span&gt;=&lt;span class=&quot;v&quot;&gt;AVRO&lt;/span&gt;
&lt;span class=&quot;k&quot;&gt;registry.name&lt;/span&gt;=&lt;span class=&quot;v&quot;&gt;workshop-registry&lt;/span&gt;
&lt;span class=&quot;k&quot;&gt;schemaName&lt;/span&gt;=&lt;span class=&quot;v&quot;&gt;Order&lt;/span&gt;
&lt;span class=&quot;k&quot;&gt;schemaAutoRegistrationEnabled&lt;/span&gt;=&lt;span class=&quot;v&quot;&gt;true&lt;/span&gt;
&lt;span class=&quot;k&quot;&gt;compatibility&lt;/span&gt;=&lt;span class=&quot;v&quot;&gt;BACKWARD&lt;/span&gt;

&lt;span class=&quot;c&quot;&gt;# consumer&lt;/span&gt;
&lt;span class=&quot;k&quot;&gt;value.deserializer&lt;/span&gt;=&lt;span class=&quot;v&quot;&gt;com.amazonaws.services.schemaregistry\
  .deserializers.GlueSchemaRegistryKafkaDeserializer&lt;/span&gt;&lt;/pre&gt;
        &lt;div class=&quot;callout note r r5&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;◆&lt;/span&gt;&lt;div&gt;Short on time? Do this one as a &lt;b&gt;guided demo&lt;/b&gt; rather than per-pair — the concept matters more than the keystrokes, and the Avro tooling setup can eat ten minutes.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub&quot;&gt;The exercise&lt;/div&gt;
        &lt;ol class=&quot;labsteps r r5&quot;&gt;
          &lt;li&gt;&lt;b&gt;Produce v1 records&lt;/b&gt; (&lt;code&gt;orderId&lt;/code&gt;, &lt;code&gt;amount&lt;/code&gt;) to a new topic &lt;code&gt;orders-avro&lt;/code&gt;. Confirm the schema appears in the registry.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Start a v1 consumer&lt;/b&gt; and leave it running.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Add a field with a default&lt;/b&gt; — &lt;code&gt;channel: string = &quot;unknown&quot;&lt;/code&gt; — and produce v2 records. Registration succeeds: it's BACKWARD-compatible.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Watch the v1 consumer&lt;/b&gt; keep working on v2 records; it simply ignores the new field.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Now try a breaking change&lt;/b&gt; — remove &lt;code&gt;amount&lt;/code&gt;, or rename it. The registry &lt;b&gt;rejects&lt;/b&gt; the registration. That rejection is the feature.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Start a v2 consumer with &lt;code&gt;--from-beginning&lt;/code&gt;&lt;/b&gt;: old v1 records read back with &lt;code&gt;channel=&quot;unknown&quot;&lt;/code&gt; from the default.&lt;/li&gt;
        &lt;/ol&gt;
        &lt;div class=&quot;callout good r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✓&lt;/span&gt;&lt;div&gt;&lt;b&gt;Checkpoint:&lt;/b&gt; step 5 failed, and step 6 worked on historical data. That combination is what makes a retained log safe to build a platform on.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 05e · DEBRIEF --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s5e&quot; data-ch=&quot;5&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Lab 2 Debrief &lt;span class=&quot;num&quot;&gt;/ 05.5&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Four capabilities you&lt;br&gt;didn't have before.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;Everything you just did maps onto a problem someone named in Chapter 01. Hold these up against your own estate as we go into the discovery workshop.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-4&quot;&gt;
      &lt;div class=&quot;card cy r r4&quot;&gt;&lt;h4&gt;Replay&lt;/h4&gt;&lt;p&gt;&quot;Can you resend yesterday?&quot; became a one-line offset reset — self-service, no upstream involvement, no archive to restore.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card am r r4&quot;&gt;&lt;h4&gt;Independent fan-out&lt;/h4&gt;&lt;p&gt;A second team consumed the same data at their own pace without touching the producer or affecting the first consumer's latency.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card vi r r4&quot;&gt;&lt;h4&gt;Elastic consumption&lt;/h4&gt;&lt;p&gt;Scaling out was adding processes — bounded by partitions. You also saw the sharp edge: repartitioning moves keys.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card cy r r5&quot;&gt;&lt;h4&gt;State &amp;amp; contracts&lt;/h4&gt;&lt;p&gt;Compaction turned a topic into a rebuildable table; the registry turned the payload into a versioned, enforced contract.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;body-wrap grid-2&quot;&gt;
      &lt;div class=&quot;callout amb r r6&quot;&gt;&lt;span class=&quot;ic&quot;&gt;▲&lt;/span&gt;&lt;div&gt;&lt;b&gt;And the things that got harder:&lt;/b&gt; no per-message retry or DLQ out of the box, a slow record blocks its partition, you own retention and partition sizing, and schema discipline is now a standing responsibility rather than a one-off conversation.&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;callout good r r6&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✓&lt;/span&gt;&lt;div&gt;&lt;b&gt;That trade is the whole decision.&lt;/b&gt; The next chapter is a framework for making it one use case at a time — not once for the whole estate.&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;
  &lt;!-- ============ CHAPTER 06 ============ --&gt;
  &lt;section class=&quot;slide chapter&quot; id=&quot;ch6&quot; data-ch=&quot;6&quot;&gt;
    &lt;div class=&quot;ch-ghost&quot;&gt;06&lt;/div&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Chapter 06 · Interactive&lt;/div&gt;
    &lt;h2 class=&quot;ch-title r r2&quot;&gt;Use case&lt;br&gt;&lt;span class=&quot;k-cyan&quot;&gt;discovery&lt;/span&gt;.&lt;/h2&gt;
    &lt;p class=&quot;ch-q r r3&quot;&gt;The question this chapter answers: &lt;b&gt;which of your use cases actually want a log&lt;/b&gt; — and of those, which one should be the pilot? You leave with 1–3 named candidates per table.&lt;/p&gt;
    &lt;div class=&quot;ch-list&quot;&gt;
      &lt;div class=&quot;ch-item r r4&quot;&gt;&lt;b&gt;1 · The decision framework&lt;/b&gt;Six questions, a score, a recommendation.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r4&quot;&gt;&lt;b&gt;2 · Score your candidates&lt;/b&gt;Fifteen minutes at your table, in writing.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r5&quot;&gt;&lt;b&gt;3 · Pick the pilot&lt;/b&gt;Value × feasibility, not just value.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r5&quot;&gt;&lt;b&gt;4 · Anti-patterns&lt;/b&gt;The four pilots that reliably fail.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ch-budget r r6&quot;&gt;Budget &lt;b&gt;25 min&lt;/b&gt; · tables of 3–5&lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 06a · THE FRAMEWORK --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s6a&quot; data-ch=&quot;6&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;The Framework &lt;span class=&quot;num&quot;&gt;/ 06.1&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Six questions. Score it.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;Ask these about &lt;b&gt;one use case at a time&lt;/b&gt;. Add the points. The score isn't science — it's a way to make the conversation concrete and to stop &quot;we should use Kafka&quot; being a conclusion in search of a reason.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-2&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub&quot;&gt;Points toward a &lt;span class=&quot;k-cyan&quot;&gt;stream&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;score r r4&quot;&gt;
          &lt;div class=&quot;score-row&quot;&gt;&lt;div&gt;&lt;b&gt;1 · Multiple consumers?&lt;/b&gt; More than one system wants this data — or plausibly will within a year.&lt;/div&gt;&lt;div class=&quot;score-pts&quot;&gt;+2&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;score-row&quot;&gt;&lt;div&gt;&lt;b&gt;2 · Is replay valuable?&lt;/b&gt; Reprocessing, backfill, audit, debugging, or onboarding a new consumer onto history.&lt;/div&gt;&lt;div class=&quot;score-pts&quot;&gt;+2&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;score-row&quot;&gt;&lt;div&gt;&lt;b&gt;3 · Is it a fact, not a command?&lt;/b&gt; &quot;OrderPlaced&quot; rather than &quot;SendEmail&quot; — a statement about the world that others may interpret differently.&lt;/div&gt;&lt;div class=&quot;score-pts&quot;&gt;+2&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;score-row&quot;&gt;&lt;div&gt;&lt;b&gt;4 · Does order per key matter?&lt;/b&gt; Events for one entity must be processed in sequence.&lt;/div&gt;&lt;div class=&quot;score-pts&quot;&gt;+1&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;score-row&quot;&gt;&lt;div&gt;&lt;b&gt;5 · High or growing volume?&lt;/b&gt; Thousands/sec, or a trajectory heading there.&lt;/div&gt;&lt;div class=&quot;score-pts&quot;&gt;+1&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;score-row&quot;&gt;&lt;div&gt;&lt;b&gt;6 · Processing on the stream?&lt;/b&gt; Windowed aggregates, joins between streams, enrichment, continuous queries.&lt;/div&gt;&lt;div class=&quot;score-pts&quot;&gt;+1&lt;/div&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub rd&quot;&gt;Points toward a &lt;span class=&quot;k-red&quot;&gt;queue&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;score r r5&quot;&gt;
          &lt;div class=&quot;score-row&quot;&gt;&lt;div&gt;&lt;b&gt;A · Per-message retry &amp;amp; DLQ&lt;/b&gt; are core to the design — individual failures must be parked and inspected.&lt;/div&gt;&lt;div class=&quot;score-pts rd&quot;&gt;−2&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;score-row&quot;&gt;&lt;div&gt;&lt;b&gt;B · Long or variable work per message&lt;/b&gt; — minutes per item, needing visibility timeouts and lease extension.&lt;/div&gt;&lt;div class=&quot;score-pts rd&quot;&gt;−2&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;score-row&quot;&gt;&lt;div&gt;&lt;b&gt;C · Per-message controls&lt;/b&gt; — priority, delay/schedule, TTL, selective consumption.&lt;/div&gt;&lt;div class=&quot;score-pts rd&quot;&gt;−1&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;score-row&quot;&gt;&lt;div&gt;&lt;b&gt;D · One consumer, forever&lt;/b&gt; — a genuine point-to-point handoff with no second audience.&lt;/div&gt;&lt;div class=&quot;score-pts rd&quot;&gt;−1&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;score-row&quot;&gt;&lt;div&gt;&lt;b&gt;E · Modest volume, request/reply shape&lt;/b&gt; — low throughput, correlation IDs, synchronous expectations.&lt;/div&gt;&lt;div class=&quot;score-pts rd&quot;&gt;−1&lt;/div&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;sub am&quot; style=&quot;margin-top:16px&quot;&gt;Reading the score&lt;/div&gt;
        &lt;div class=&quot;card am r r6&quot;&gt;&lt;ul&gt;
          &lt;li&gt;&lt;b&gt;5 or more&lt;/b&gt; → strong streaming candidate. Shortlist it as a pilot.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;2 to 4&lt;/b&gt; → plausible; usually becomes compelling once you name the second and third consumer.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;1 or below&lt;/b&gt; → keep the queue. Say so out loud and move on — this is a successful outcome of the exercise.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Both sides scoring high&lt;/b&gt; → it's two use cases wearing one name. Split it: stream the facts, queue the work.&lt;/li&gt;
        &lt;/ul&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 06b · THE EXERCISE --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s6b&quot; data-ch=&quot;6&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Your Turn &lt;span class=&quot;num&quot;&gt;/ 06.2&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Fifteen minutes.&lt;br&gt;Fill in the canvas.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;At your table: list every candidate from Chapters 01 and 02, score each one, then take the &lt;b&gt;top two or three&lt;/b&gt; through the canvas below. Write it down — a scored row you can defend beats an enthusiastic conversation you can't reconstruct on Monday.&lt;/p&gt;
    &lt;div class=&quot;body-wrap&quot;&gt;
      &lt;div class=&quot;tbl-wrap r r4&quot;&gt;
        &lt;table class=&quot;tbl compact&quot;&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Field&lt;/th&gt;&lt;th&gt;What to write&lt;/th&gt;&lt;th&gt;Example&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;&lt;b&gt;Use case&lt;/b&gt;&lt;/td&gt;&lt;td&gt;One sentence, business language&lt;/td&gt;&lt;td&gt;Publish every order state change as an event&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;b&gt;Event / record&lt;/b&gt;&lt;/td&gt;&lt;td&gt;What one record represents, and its key&lt;/td&gt;&lt;td&gt;&lt;code&gt;OrderStateChanged&lt;/code&gt;, keyed by &lt;code&gt;order_id&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;b&gt;Producer&lt;/b&gt;&lt;/td&gt;&lt;td&gt;The system of record that emits it&lt;/td&gt;&lt;td&gt;Order service (or CDC from its database)&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;b&gt;Consumers (today → tomorrow)&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Named systems and teams — the heart of the case&lt;/td&gt;&lt;td&gt;Fulfilment, fraud, CX dashboard → analytics, ML&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;b&gt;Volume &amp;amp; latency need&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Records/sec at peak; end-to-end target&lt;/td&gt;&lt;td&gt;~2k/s peak; under 2 s to fulfilment&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;b&gt;Replay value&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Why history matters, and how far back&lt;/td&gt;&lt;td&gt;Reprocess 30 days after a pricing-rule bug&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;b&gt;Ordering need&lt;/b&gt;&lt;/td&gt;&lt;td&gt;What must stay in sequence&lt;/td&gt;&lt;td&gt;Per order; across orders irrelevant&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;b&gt;Retention &amp;amp; policy&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Time window, or compacted state&lt;/td&gt;&lt;td&gt;30 days delete; separate compacted status topic&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;b&gt;Score&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Framework total, and the dominant reason&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;k-cyan&quot;&gt;+7&lt;/span&gt; — three consumers, replay, facts&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;b&gt;Blockers&lt;/b&gt;&lt;/td&gt;&lt;td&gt;What stops a pilot starting in two weeks&lt;/td&gt;&lt;td&gt;No schema ownership; VPC/network approval&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout note r r6&quot; style=&quot;margin-top:14px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;◆&lt;/span&gt;&lt;div&gt;&lt;b&gt;Facilitation:&lt;/b&gt; one table member keeps the pen and the clock — 12 minutes of writing, 3 to pick the pilot. We'll take two minutes per table to share, so choose the one you'd actually start.&lt;/div&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 06c · PICKING &amp; ANTI-PATTERNS --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s6c&quot; data-ch=&quot;6&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Choosing Well &lt;span class=&quot;num&quot;&gt;/ 06.3&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Pick for learning,&lt;br&gt;not for &lt;span class=&quot;k-amber&quot;&gt;prestige&lt;/span&gt;.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;The best first use case is rarely the most valuable one. It's the one that proves the capability end-to-end, in production, within a quarter — and leaves you with a team that knows how to run the next one.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-3&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub&quot;&gt;A good first pilot looks like this&lt;/div&gt;
        &lt;div class=&quot;card cy r r4&quot;&gt;&lt;ul&gt;
          &lt;li&gt;&lt;b&gt;Two or three real consumers&lt;/b&gt; at launch — fan-out is the value you're demonstrating.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;A producer you control&lt;/b&gt;, with an owner who will take the schema seriously.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Meaningful but not terrifying volume&lt;/b&gt; — enough to be real, small enough to survive mistakes.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Not on the critical path for money&lt;/b&gt; on day one — run it alongside the existing flow first.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;A measurable before/after&lt;/b&gt;: latency, manual effort removed, data available to a team that didn't have it.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;An exit in mind&lt;/b&gt; — what &quot;it worked&quot; means, and what happens next if it does.&lt;/li&gt;
        &lt;/ul&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub rd&quot;&gt;Four pilots that reliably fail&lt;/div&gt;
        &lt;div class=&quot;card rd r r5&quot;&gt;&lt;ul&gt;
          &lt;li&gt;&lt;b&gt;&quot;Replace all the MQ.&quot;&lt;/b&gt; A platform migration disguised as a pilot. No learning, maximum risk, political by week three.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;A one-to-one handoff&lt;/b&gt; that genuinely has one consumer. You'll do more work for no new capability and conclude Kafka is overhead — correctly.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Long-running job dispatch.&lt;/b&gt; Per-message retry, visibility timeouts, priority. You'll rebuild SQS badly on top of a log.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;A topic with no owner.&lt;/b&gt; &quot;Publish everything and let teams figure it out&quot; produces an unversioned payload nobody dares change and nobody trusts.&lt;/li&gt;
        &lt;/ul&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub am&quot;&gt;Not a fit at all — don't force it&lt;/div&gt;
        &lt;div class=&quot;card am r r5&quot;&gt;&lt;ul&gt;
          &lt;li&gt;&lt;b&gt;Request/reply.&lt;/b&gt; You need a response to &lt;em&gt;this&lt;/em&gt; call in 5 ms. Kafka can fake it with a correlation ID and a reply topic, but you've re-invented RPC with worse tooling. Use gRPC/HTTP.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Millions of topics.&lt;/b&gt; Per-tenant or per-user topics don't scale — each partition is files, memory and replication overhead. Model tenancy as &lt;b&gt;keys inside&lt;/b&gt; a topic, not as topics.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Ad-hoc querying.&lt;/b&gt; There is no &lt;code&gt;WHERE&lt;/code&gt;. If the access pattern is &quot;find the record for user 42&quot;, you need a store — Kafka feeds it, it doesn't replace it.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Tiny scale, tiny team.&lt;/b&gt; Three services and 50 events/sec? A managed queue costs you a day, not a quarter. &lt;b&gt;Kafka's floor is operational, not throughput.&lt;/b&gt;&lt;/li&gt;
        &lt;/ul&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout amb r r6&quot; style=&quot;margin-top:14px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;▲&lt;/span&gt;&lt;div&gt;&lt;b&gt;Hybrid is the normal end state.&lt;/b&gt; Streams for facts, queues for work, and a connector between them where a stream needs to trigger a job. Nobody in this room should leave planning to delete their queues.&lt;/div&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- ============ CHAPTER 07 ============ --&gt;
  &lt;section class=&quot;slide chapter&quot; id=&quot;ch7&quot; data-ch=&quot;7&quot;&gt;
    &lt;div class=&quot;ch-ghost&quot;&gt;07&lt;/div&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Chapter 07&lt;/div&gt;
    &lt;h2 class=&quot;ch-title r r2&quot;&gt;Wrap-up &amp;amp;&lt;br&gt;&lt;span class=&quot;k-cyan&quot;&gt;next steps&lt;/span&gt;.&lt;/h2&gt;
    &lt;p class=&quot;ch-q r r3&quot;&gt;The question this chapter answers: &lt;b&gt;what do you do on Monday&lt;/b&gt; — and what does the path from today's candidate to a running pilot actually look like?&lt;/p&gt;
    &lt;div class=&quot;ch-list&quot;&gt;
      &lt;div class=&quot;ch-item r r4&quot;&gt;&lt;b&gt;1 · What to remember&lt;/b&gt;Six sentences, if you forget everything else.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r4&quot;&gt;&lt;b&gt;2 · The pilot path&lt;/b&gt;A 30 / 60 / 90 shape.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r5&quot;&gt;&lt;b&gt;3 · Resources &amp;amp; commitments&lt;/b&gt;Where to go, and who does what next.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ch-budget r r6&quot;&gt;Budget &lt;b&gt;10 min&lt;/b&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 07a · RECAP --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s7a&quot; data-ch=&quot;7&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Recap &lt;span class=&quot;num&quot;&gt;/ 07.1&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;If you forget&lt;br&gt;everything else.&lt;/h2&gt;
    &lt;div class=&quot;body-wrap grid-3&quot;&gt;
      &lt;div class=&quot;card cy r r3&quot;&gt;&lt;h4&gt;&lt;span class=&quot;n&quot;&gt;01&lt;/span&gt;The log is the difference&lt;/h4&gt;&lt;p&gt;Consumption doesn't delete. The broker stores an ordered, retained record of what happened, and every reader keeps its own position in it.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card am r r3&quot;&gt;&lt;h4&gt;&lt;span class=&quot;n&quot;&gt;02&lt;/span&gt;The partition is the unit&lt;/h4&gt;&lt;p&gt;Ordering, parallelism and replication all happen per partition. Your key choice decides ordering; your partition count caps your consumers.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card vi r r4&quot;&gt;&lt;h4&gt;&lt;span class=&quot;n&quot;&gt;03&lt;/span&gt;Groups are subscriptions&lt;/h4&gt;&lt;p&gt;One group = one logical consumer, scaled across processes. Different groups are fully independent — that's how fan-out costs nothing to add.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card cy r r4&quot;&gt;&lt;h4&gt;&lt;span class=&quot;n&quot;&gt;04&lt;/span&gt;At-least-once, idempotent&lt;/h4&gt;&lt;p&gt;Process then commit, and make your writes idempotent. Reach for transactions only for Kafka-to-Kafka processing.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card am r r5&quot;&gt;&lt;h4&gt;&lt;span class=&quot;n&quot;&gt;05&lt;/span&gt;The schema is the API&lt;/h4&gt;&lt;p&gt;With many readers and replayable history, the payload is a long-lived contract. Registry plus a compatibility mode, from the first topic.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card rd r r5&quot;&gt;&lt;h4&gt;&lt;span class=&quot;n&quot;&gt;06&lt;/span&gt;Queues are still right sometimes&lt;/h4&gt;&lt;p&gt;Per-message retry, priority, delay, long jobs → use a queue. The goal is the right tool per use case, not a single broker to rule them all.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;metrics r r6&quot; style=&quot;margin-top:22px&quot;&gt;
      &lt;div class=&quot;metric&quot;&gt;&lt;div class=&quot;big&quot;&gt;Facts&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;go on a stream — anyone may interpret them, now or later&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;metric&quot;&gt;&lt;div class=&quot;big am&quot;&gt;Commands&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;go on a queue — one owner, one action, per-message care&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;metric&quot;&gt;&lt;div class=&quot;big vi&quot;&gt;Both&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;belong in a mature estate, connected deliberately&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 07b · PILOT PATH --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s7b&quot; data-ch=&quot;7&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;The Path &lt;span class=&quot;num&quot;&gt;/ 07.2&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;From candidate&lt;br&gt;to running pilot.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;A shape that works, assuming one squad and a scored use case from Chapter 06. Resist starting at step 4.&lt;/p&gt;
    &lt;div class=&quot;body-wrap&quot;&gt;
      &lt;div class=&quot;steps r r4&quot;&gt;

/* ---- auto-fit ---- */
slides.forEach(s=&gt;{
  const f=document.createElement('div');
  f.className='fit';
  while(s.firstChild) f.appendChild(s.firstChild);
  s.appendChild(f);
});
const MIN_SCALE=0.5;
function fitSlide(s){
  const f=s.querySelector(':scope &gt; .fit');
  if(!f)return;
  f.style.transform='none';f.style.width='100%';
  const cs=getComputedStyle(s);
  const avail=s.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  if(f.scrollHeight&lt;=avail+1){
    s.style.justifyContent='center';
    return;
  }
  s.style.justifyContent='flex-start';
  let k=1;
  for(let i=0;i&lt;10;i++){
    f.style.width=(100/k)+'%';
    const scaled=f.scrollHeight*k;
    if(scaled&lt;=avail) break;
    const next=k*(avail/scaled)*0.99;
    if(next&lt;=MIN_SCALE){k=MIN_SCALE;f.style.width=(100/k)+'%';break;}
    k=next;
  }
  f.style.width=(100/k)+'%';
  f.style.transform='scale('+k+')';
}
function fitAll(){slides.forEach(fitSlide);}
let fitPending=null;
window.addEventListener('resize',()=&gt;{clearTimeout(fitPending);fitPending=setTimeout(fitAll,150);});

function go(n){
  if(n===undefined||n===null||isNaN(n))return;
  n=Math.max(0,Math.min(slides.length-1,n));

  renderNotes(cur,n,ch);
  location.hash=cur.id;
}

/* shared: fly a particle along a path */
function flyAlong(svg,d,color,dur,bucket){
  const pk=el('circle',{r:4,fill:color,filter:'drop-shadow(0 0 6px '+color+')'},svg);
  const path=el('path',{d:d,fill:'none'},svg);
  const len=path.getTotalLength();
  let st=null;
  function step(ts){
    if(!st)st=ts;
    const k=Math.min(1,(ts-st)/dur);
    const pt=path.getPointAtLength(k*len);
    pk.setAttribute('cx',pt.x);pk.setAttribute('cy',pt.y);
    if(k&lt;1){const h=requestAnimationFrame(step);if(bucket)bucket.push(h);}
    else{pk.remove();path.remove();}
  }
  const h=requestAnimationFrame(step);if(bucket)bucket.push(h);
}

(function(){

    const n=STEPS[si];

      .textContent='group &quot;orders-processor&quot; · '+n+' consumer'+(n&gt;1?'s':'')+' · 6 partitions';
    const assign=[];
    for(let p=0;p&lt;P;p++)assign.push(p%n);
    for(let p=0;p&lt;P;p++){
      const y=50+p*48;
      el('rect',{x:30,y:y,width:150,height:36,rx:8,fill:'rgba(55,230,201,.07)',stroke:'var(--cyan-dim)'},svg);
      el('text',{x:105,y:y+23,'text-anchor':'middle',class:'lbl-sm',fill:'var(--cyan)'},svg)
        .textContent='partition '+p;
    }
    const cy0=50, step=Math.min(48, 290/n);
    for(let c=0;c&lt;n;c++){
      const y=cy0+c*step;
      const owns=assign.filter(a=&gt;a===c).length;
      const idle=owns===0;
      el('rect',{x:420,y:y,width:190,height:Math.min(36,step-6),rx:8,
        fill:idle?'rgba(255,93,108,.07)':'rgba(139,123,255,.08)',

        fill:idle?'var(--red)':'var(--violet)'},svg)
        .textContent=idle?('consumer '+(c+1)+' · IDLE'):('consumer '+(c+1)+' · '+owns+'p');
    }
    for(let p=0;p&lt;P;p++){
      const y1=50+p*48+18;
      const c=assign[p];
      const y2=cy0+c*step+Math.min(18,step/2);

/* ---- 05.1 · replay ---- */
(function(){
  const svg=document.getElementById('replaysvg');
  const btn=document.getElementById('replayBtn');
  let timer=null, head=10, a=9, b=9, replaying=false;
  const N=14, x0=36, cw=42, y=120;
  function draw(){
    svg.innerHTML='';
    el('text',{x:16,y:42,class:'lbl-sm',fill:'var(--cyan)'},svg)
      .textContent='topic &quot;orders&quot; · partition 0 · two independent consumer groups';
    for(let i=0;i&lt;N;i++){
      const written=i&lt;head;
      el('rect',{x:x0+i*cw,y:y,width:36,height:48,rx:6,
        fill:written?'rgba(55,230,201,.13)':'rgba(255,255,255,.015)',
        stroke:written?'var(--cyan-dim)':'var(--line)'},svg);
      el('text',{x:x0+i*cw+18,y:y+64,'text-anchor':'middle',class:'lbl-sm',
        fill:written?'var(--muted)':'var(--line)'},svg).textContent=i;
    }
    el('text',{x:x0,y:y-16,class:'lbl-sm',fill:'var(--muted)'},svg).textContent='offset →';
    el('text',{x:x0+head*cw+6,y:y-16,class:'lbl-sm',fill:'var(--violet)'},svg).textContent='append';
    function cursor(off,color,label,yy){
      const cx=x0+Math.max(0,Math.min(N-1,off))*cw+18;
      el('line',{x1:cx,y1:y+50,x2:cx,y2:yy-14,stroke:color,'stroke-width':1,opacity:.4,'stroke-dasharray':'3 4'},svg);
      el('path',{d:'M'+cx+','+(yy-14)+' l-7,11 l14,0 z',fill:color},svg);
      const far=cx&gt;300;
      el('text',Object.assign({x:far?cx-13:cx+13,y:yy+2,class:'lbl-sm',fill:color},
        far?{'text-anchor':'end'}:{}),svg).textContent=label+' @ offset '+off;
    }
    cursor(a,'var(--cyan)','group A · lab-consumer (live)',216);
    cursor(b,replaying?'var(--amber)':'var(--cyan-dim)',
      replaying?'group B · analytics (REPLAYING)':'group B · analytics',266);
    el('text',{x:320,y:324,'text-anchor':'middle',class:'lbl-sm',
      fill:replaying?'var(--amber)':'var(--muted)'},svg)
      .textContent = replaying
        ? 'group B re-reads history — group A is unaffected, the producer knows nothing about it'
        : 'both groups at the head · one copy of the data, two positions';
    btn.textContent = replaying ? 'replaying…  ⟲' : 'Reset B to earliest ⟲';
  }
  function tick(){
    if(head&lt;N){head++;}
    a=head-1;
    if(replaying){ b+=1; if(b&gt;=head){b=head-1;replaying=false;} }
    else { b=head-1; }
    draw();
  }
  function build(){clearInterval(timer);head=10;a=9;b=9;replaying=false;draw();timer=setInterval(tick,900);}
  btn.onclick=()=&gt;{b=0;replaying=true;draw();};
  scenes['s5a']=build;
  onStop('s5a',()=&gt;clearInterval(timer));
})();
