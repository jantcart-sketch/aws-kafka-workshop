      .textContent = mode ? 'consumer 2 is pinned at 100% while five idle — adding pods changes nothing'

  btn.onclick=()=&gt;{mode=1-mode;build();};

/* ---- 05.2 · RecordAccumulator ---- */
(function(){
  const svg=document.getElementById('accsvg');
  const btn=document.getElementById('accBtn');
  let timer=null,linger=0,batches=[0,0,0],sent=0,reqs=0,t=0;
  const CAP=8, colors=['var(--cyan)','var(--amber)','var(--violet)'];
  function build(){
    clearInterval(timer);batches=[0,0,0];sent=0;reqs=0;t=0;draw();
    timer=setInterval(tick,180);
    btn.textContent='linger.ms = '+linger+' · toggle';
  }
  function tick(){
    t++;
    // app thread appends ~2 records per tick
    for(let i=0;i&lt;2;i++) batches[Math.floor(Math.random()*3)]++;
    const deadline = linger===0 ? 2 : 8;   // ticks before sender flushes
    let flushed=false;
    batches.forEach((b,i)=&gt;{ if(b&gt;=CAP){flush(i);flushed=true;} });
    if(t%deadline===0){ batches.forEach((b,i)=&gt;{ if(b&gt;0) flush(i); }); flushed=true; }
    if(flushed) reqs++;
    draw();
  }
  function flush(i){sent+=batches[i];batches[i]=0;}
  function draw(){
    svg.innerHTML='';
    el('text',{x:330,y:24,'text-anchor':'middle',class:'lbl-sm',fill:'var(--amber)'},svg)
      .textContent='RecordAccumulator · buffer.memory 32 MB';
    // app thread
    el('rect',{x:24,y:130,width:96,height:110,rx:11,class:'node-box',stroke:'var(--cyan)'},svg);
    el('text',{x:72,y:172,'text-anchor':'middle',class:'lbl',fill:'var(--cyan)'},svg).textContent='your';
    el('text',{x:72,y:190,'text-anchor':'middle',class:'lbl',fill:'var(--cyan)'},svg).textContent='thread';
    el('text',{x:72,y:214,'text-anchor':'middle','font-size':'9',class:'lbl-sm'},svg).textContent='send() returns';
    // per-partition batches
    batches.forEach((b,i)=&gt;{
      const y=70+i*100;
      el('text',{x:170,y:y+8,class:'lbl-sm',fill:colors[i]},svg).textContent='partition '+i;
      el('rect',{x:170,y:y+16,width:CAP*22+8,height:34,rx:7,fill:'rgba(255,255,255,.02)',stroke:'var(--line)'},svg);
      for(let c=0;c&lt;b&amp;&amp;c&lt;CAP;c++)
        el('rect',{x:174+c*22,y:y+20,width:18,height:26,rx:3,fill:colors[i],opacity:.6},svg);
      el('text',{x:170+CAP*22+22,y:y+38,class:'lbl-sm',fill:b&gt;=CAP?'var(--amber)':'var(--muted)'},svg)
        .textContent=b&gt;=CAP?'batch.size → send!':(b+'/'+CAP);
      el('path',{d:`M${170+CAP*22+120},${y+33} L520,${y+33}`,stroke:'var(--line)','stroke-width':1,'stroke-dasharray':'3 3'},svg);
    });
    // sender thread
    el('rect',{x:520,y:100,width:110,height:170,rx:11,class:'node-box',stroke:'var(--amber)',fill:'rgba(255,179,71,.05)'},svg);
    el('text',{x:575,y:150,'text-anchor':'middle',class:'lbl',fill:'var(--amber)'},svg).textContent='sender';
    el('text',{x:575,y:168,'text-anchor':'middle',class:'lbl',fill:'var(--amber)'},svg).textContent='thread';
    el('text',{x:575,y:194,'text-anchor':'middle','font-size':'9',class:'lbl-sm'},svg).textContent='groups batches';
    el('text',{x:575,y:208,'text-anchor':'middle','font-size':'9',class:'lbl-sm'},svg).textContent='per broker';
    el('text',{x:575,y:230,'text-anchor':'middle','font-size':'9',class:'lbl-sm',fill:'var(--violet)'},svg).textContent='max.in.flight 5';
    // stats

    el('text',{x:330,y:360,'text-anchor':'middle','font-size':'9',class:'lbl-sm'},svg)
      .textContent='expected → append · already seen → ack without writing · too far ahead → OutOfOrderSequence';
  }

          // 3. retry
          setTimeout(()=&gt;{
            send('④ producer retries the SAME batch — still seq=5','var(--red)',null,()=&gt;{
              phase='⑤ seq 5 ≤ last seq 5 → DUPLICATE. discarded, success returned.';draw();
              el('rect',{x:420,y:290,width:200,height:36,rx:8,fill:'rgba(55,230,201,.10)',stroke:'var(--cyan)'},svg);

        },620);

(function(){

    clearInterval(timer);svg.innerHTML='';btn.disabled=false;btn.style.opacity=1;
    const bx=[110,320,530], by=200;

    bx.forEach((x,i)=&gt;{

      state.brokers.push({x,y:by,g,box,disk,role,badge});
    });
    render(0,[1,2]);
    timer=setInterval(()=&gt;{
      const L=state.brokers.findIndex((b,i)=&gt;state.roleOf[i]==='leader');
      if(L&lt;0)return;
      state.roleOf.forEach((r,i)=&gt;{
        if(r==='follower' &amp;&amp; i!==state.dead){
          const a=state.brokers[L],b=state.brokers[i];
          const pk=el('circle',{cx:a.x,cy:a.y,r:6,fill:'var(--amber)',filter:'drop-shadow(0 0 6px var(--amber))'},svg);

          setTimeout(()=&gt;pk.remove(),820);
        }
      });
    },1400);
  }
  function render(leader,followers){
    state.roleOf=[];
    state.brokers.forEach((b,i)=&gt;{
      let role;
      if(i===state.dead){role='DOWN';}
      else if(i===leader){role='LEADER';}
      else{role='FOLLOWER';}
      state.roleOf[i]= role==='LEADER'?'leader':(role==='DOWN'?'dead':'follower');
      const isL=role==='LEADER',isD=role==='DOWN';
      b.box.setAttribute('stroke',isD?'var(--red)':(isL?'var(--amber)':'var(--cyan-dim)'));
      b.box.setAttribute('fill',isD?'rgba(255,93,108,.06)':(isL?'rgba(255,179,71,.08)':'rgba(55,230,201,.05)'));

      b.disk.setAttribute('stroke',isD?'var(--red)':(isL?'var(--amber)':'var(--cyan-dim)'));
      b.role.setAttribute('fill',isD?'var(--red)':(isL?'var(--amber)':'var(--cyan)'));
      b.role.textContent=role;
      b.badge.setAttribute('fill', isD?'var(--red)':'var(--muted)');
      b.badge.textContent=isD?'✕ offline':(isL?'accepts writes':'in ISR · replicating');
      b.g.style.opacity=isD?.55:1;
      b.g.style.transition='.5s';
    });
    let isr=svg.querySelector('#isrlbl');
    if(!isr){isr=el('text',{id:'isrlbl',x:320,y:60,'text-anchor':'middle',class:'lbl-sm',fill:'var(--cyan)'},svg);}
    const alive=state.brokers.map((_,i)=&gt;i).filter(i=&gt;i!==state.dead);
    isr.textContent='ISR = { '+alive.map(i=&gt;'b'+(i+1)).join(', ')+' }';
  }
  btn.onclick=()=&gt;{
    if(state.dead&gt;-1)return;
    state.dead=0;
    render(0,[]);
    setTimeout(()=&gt;{ render(1,[2]);
      const t=el('text',{x:320,y:430,'text-anchor':'middle',class:'lbl',fill:'var(--cyan)'},svg);
      t.textContent='⚡ failover — broker 2 promoted from the ISR';
      t.animate([{opacity:0},{opacity:1}],{duration:500,fill:'forwards'});

      t2.textContent='no data loss: the new leader had everything up to the high watermark';
    },700);
    btn.style.opacity=.4;btn.disabled=true;
  };

  onStop('s7a',()=&gt;clearInterval(timer));
})();

  ch1:{title:&quot;Chapter 01 — The Big Idea&quot;,sub:&quot;~20 min · concept, not config&quot;,points:[
    &quot;This chapter is deliberately concept-heavy. Resist the urge to talk about brokers; the payoff of the whole talk depends on the audience believing the &lt;b&gt;log&lt;/b&gt; is the interesting idea.&quot;,
    &quot;Pacing: 3 min on the log itself, 5 min on N×M (this is where the room nods), 5 min on the queue/log/DB table, 4 min on replay, 3 min on when not to use it.&quot;,
    &quot;If the room is impatient for architecture, promise chapter 02 is next and keep going — skipping the why makes the rest feel arbitrary.&quot;]},

  s1a:{title:&quot;An immutable log of events&quot;,sub:&quot;3–4 min&quot;,points:[
    &quot;Point at the live tail: &lt;b&gt;offset increases, nothing is ever removed&lt;/b&gt;. Each line is an event that happened — past tense, a fact, not a command.&quot;,
    &quot;Draw out the three-actor decoupling: producers never wait on consumers; consumers never slow producers; brokers just keep bytes. That asymmetry is the whole value proposition.&quot;,
    &quot;Naming matters: events are named in the past tense (&lt;code&gt;order.placed&lt;/code&gt;, not &lt;code&gt;placeOrder&lt;/code&gt;). A log of facts can be replayed safely; a log of commands cannot.&quot;,
    &quot;Contrast with the mental model most people arrive with: &lt;b&gt;reading does not consume&lt;/b&gt;. Say it twice. It is the single most common misconception in the room.&quot;,
    &quot;Hook forward: 'everything else in this talk is a consequence of choosing an append-only log.'&quot;]},

  s1b:{title:&quot;The N×M problem&quot;,sub:&quot;4–5 min · the strongest slide for buy-in&quot;,points:[
    &quot;Let the spaghetti diagram sit in silence for a few seconds before you say anything. People recognise their own architecture in it.&quot;,
    &quot;Then hit the button. 36 → 12. Make the arithmetic explicit: &lt;b&gt;O(N×M) becomes O(N+M)&lt;/b&gt;.&quot;,
    &quot;The deeper point is not connection count, it is &lt;b&gt;decoupling in time&lt;/b&gt;: the consumer does not need to exist when the data is produced. Give a concrete example — the fraud team that shipped six months after checkout and still got all the history.&quot;,
    &quot;History: this is LinkedIn's 2010 problem. Kafka was built as a central nervous system, not as a faster queue. That origin explains why it stores data instead of deleting it.&quot;,
    &quot;Anti-pattern to name here so it lands early: a 'Kafka' that is really 36 point-to-point topics with one producer and one consumer each is still spaghetti — you just moved the wiring.&quot;],
   ask:&quot;How many bespoke data pipelines does your team own? Does anyone know the actual number?&quot;},

  s1c:{title:&quot;Queue vs log vs database&quot;,sub:&quot;4–5 min · correct the instincts&quot;,points:[
    &quot;Work the table row by row; the rows that generate discussion are &lt;b&gt;after reading&lt;/b&gt; and &lt;b&gt;per-message ops&lt;/b&gt;.&quot;,
    &quot;Queue instinct to unlearn: 'queue depth should be zero'. In Kafka, &lt;b&gt;data sitting in the topic is normal&lt;/b&gt; — retention is a policy, not a backlog alarm.&quot;,
    &quot;Database instinct to unlearn: 'I will query the topic'. There is no &lt;code&gt;WHERE&lt;/code&gt;, no secondary index, no random access by content. Only offset and timestamp.&quot;,
    &quot;The one that saves projects: &lt;b&gt;you cannot delete or retry a single message&lt;/b&gt;. If a design needs that, it needs a queue (or a retry topic + DLQ pattern). Say this now and refer back when someone proposes per-message TTL later.&quot;,
    &quot;Good line to land the mental model: Kafka is a &lt;b&gt;storage system that speaks pub/sub&lt;/b&gt;. Retention is a config value, not a side-effect of delivery.&quot;,
    &quot;If time allows, mention that SQS/Rabbit and Kafka frequently coexist happily — task queues for work distribution, Kafka for event distribution. It is not a competition.&quot;]},

  s1d:{title:&quot;Durable + replayable&quot;,sub:&quot;4 min · the underused superpower&quot;,points:[
    &quot;Most teams treat Kafka as a pipe for the first year and never replay anything. This slide is the invitation to use the capability they already paid for.&quot;,
    &quot;Pick two of the six cards and tell a real story. The 'fix the bug, rewind the group' one always lands, and 'rebuild the search index by replay' is the one that changes architecture decisions.&quot;,
    &quot;Then explain &lt;b&gt;why it is affordable&lt;/b&gt;: sequential IO, page cache, zero-copy, batch-once compression. Retaining a week is the intended operating mode, not a hack.&quot;,
    &quot;Emphasise the inversion: the log is the &lt;b&gt;source of truth&lt;/b&gt;; derived stores (search index, cache, warehouse) are disposable projections. That is a genuinely different way to build systems.&quot;,
    &quot;Flag the operational caveat honestly: a big replay reads &lt;b&gt;cold&lt;/b&gt; data from disk and can push p99 latency up for everyone else on that broker. Chapter 04.5 covers why. Replay in off-peak, or on a dedicated cluster if it is routine.&quot;,
    &quot;Mention &lt;code&gt;offsetsForTimes()&lt;/code&gt; — replay by wall-clock time is a one-liner and almost nobody knows it exists.&quot;]},

  s1e:{title:&quot;When Kafka is the wrong answer&quot;,sub:&quot;3 min · buy credibility&quot;,points:[
    &quot;This slide buys you trust for the next eight chapters. A talk that only sells gets discounted.&quot;,
    &quot;The two that matter most in practice: &lt;b&gt;request/reply&lt;/b&gt; (use gRPC/HTTP — do not rebuild RPC over topics) and &lt;b&gt;per-message scheduling&lt;/b&gt; (delay, single retry, targeted delete).&quot;,
    &quot;The multi-tenancy trap is worth dwelling on: per-tenant or per-user &lt;b&gt;topics&lt;/b&gt; do not scale. Model tenancy as &lt;b&gt;keys inside&lt;/b&gt; a topic. People try this constantly.&quot;,
    &quot;Payload size: default max ~1 MB. Large blobs go to object storage; put the pointer on the topic (claim-check pattern).&quot;,
    &quot;Also name the operational floor: three services and 50 events/second do not need Kafka. Its cost is operational, not throughput-related.&quot;,
    &quot;Close the chapter with the framing line: Kafka trades away per-message flexibility and random access to buy ordering, durable replay and linear scale. &lt;b&gt;Everything in the next eight chapters follows from that trade.&lt;/b&gt;&quot;]},

  ch2:{title:&quot;Chapter 02 — Architecture&quot;,sub:&quot;~20 min · the machinery&quot;,points:[
    &quot;Pacing: 3 min topology, 4 min KRaft, 4 min broker request path, 3 min disk layout, 3 min bootstrap, 3 min sizing.&quot;,
    &quot;This chapter is where operators wake up. If the room is mostly application developers, spend less time on 02.6 (sizing) and more on 02.5 (bootstrap), which is the one that bites developers directly.&quot;,
    &quot;Recurring theme to name out loud: &lt;b&gt;the server is deliberately dumb, the clients are smart&lt;/b&gt;. Routing, partitioning and assignment all happen client-side. That is why Kafka scales and why client config matters so much.&quot;]},

  s2a:{title:&quot;The architecture&quot;,sub:&quot;3 min&quot;,points:[
    &quot;Keep this deliberately simple — it is the map for the next five slides. Producers write, brokers store, consumers pull, controllers coordinate.&quot;,
    &quot;Two things to make precise: a &lt;b&gt;broker is a process&lt;/b&gt; (usually one per host), and &lt;b&gt;leadership is per partition&lt;/b&gt; — every broker leads some partitions and follows others.&quot;,
    &quot;Note that clients connect &lt;b&gt;directly&lt;/b&gt; to brokers. No proxy, no load balancer in the data path. Foreshadow 02.5.&quot;,
    &quot;Mention the controller quorum without going deep — next slide is entirely about it.&quot;,
    &quot;If asked about minimum viable cluster: 3 brokers, RF=3, min.insync=2, ideally across 3 failure domains.&quot;]},

  s2b:{title:&quot;KRaft&quot;,sub:&quot;4 min · why ZooKeeper is gone&quot;,points:[
    &quot;Frame the question metadata answers: 'who leads partition 7, and what is in its ISR?' Every client and broker needs that, constantly.&quot;,
    &quot;Old world: ZooKeeper held it. Separate system, separate ops and security model, and metadata propagation degraded as partition counts grew — controller failover could take minutes on big clusters because the new controller had to reload everything.&quot;,
    &quot;New world: metadata is &lt;b&gt;a Kafka log&lt;/b&gt; (&lt;code&gt;__cluster_metadata&lt;/code&gt;), replicated by Raft, and brokers &lt;b&gt;fetch and replay&lt;/b&gt; it. Kafka managing its own state with its own primitives — that is the elegance worth pointing out.&quot;,
    &quot;Hit the kill button. The point is that the standby is &lt;b&gt;already caught up&lt;/b&gt;, so failover is sub-second rather than a state reload.&quot;,
    &quot;Practical notes: 3 or 5 controllers (tolerate 1 or 2 losses); dedicated controllers in production, combined mode fine for dev; ZooKeeper removal completed in Kafka 4.0, and ZK→KRaft migration is a defined, one-way, staged procedure.&quot;,
    &quot;Anticipate the question 'does this change my client code?' — &lt;b&gt;no&lt;/b&gt;. Clients never talked to ZooKeeper in modern versions anyway.&quot;]},

  s2c:{title:&quot;Inside a broker&quot;,sub:&quot;4 min · the diagnostic slide&quot;,points:[
    &quot;This is the highest-value slide in the chapter for anyone on call. Nearly every 'Kafka is slow' investigation resolves to one of these four stages.&quot;,
    &quot;Walk the animation once, then narrate: acceptor → network threads → shared request queue → IO handler threads → append to page cache.&quot;,
    &quot;&lt;b&gt;Purgatory is the idea worth teaching.&lt;/b&gt; Requests that must wait — &lt;code&gt;acks=all&lt;/code&gt; waiting on replicas, fetches waiting for &lt;code&gt;fetch.min.bytes&lt;/code&gt; — park in a timer structure and &lt;b&gt;release their thread&lt;/b&gt;. That is how one broker holds tens of thousands of waiting requests.&quot;,
    &quot;Then the diagnostic mapping: high &lt;code&gt;RequestQueueTimeMs&lt;/code&gt; → not enough IO threads. Low network-thread idle % → not enough network threads. High &lt;code&gt;LocalTimeMs&lt;/code&gt; → disk. High &lt;code&gt;RemoteTimeMs&lt;/code&gt; → &lt;b&gt;followers&lt;/b&gt; are slow, not you. That last distinction saves hours.&quot;,
    &quot;Note that a produce request usually contains batches for &lt;b&gt;several partitions&lt;/b&gt;, which is why one slow partition leader can raise latency for unrelated topics in the same request.&quot;]},

  s2d:{title:&quot;Segments and indexes&quot;,sub:&quot;3 min&quot;,points:[
    &quot;A partition is a &lt;b&gt;directory&lt;/b&gt;; the log is a series of segment files named by their base offset. Only the last one (the active segment) is written.&quot;,
    &quot;Walk the three-hop lookup: filename picks the segment, binary search of the sparse &lt;code&gt;.index&lt;/code&gt; gets you near, then a short sequential scan. Millions of records, three cheap steps, mostly in memory.&quot;,
    &quot;Sparse index = one entry per &lt;code&gt;index.interval.bytes&lt;/code&gt; (4 KiB), so the index stays small enough to memory-map. Explain the trade: smaller index, slightly longer scan.&quot;,
    &quot;The operational punchline: &lt;b&gt;retention deletes whole segments, never individual records&lt;/b&gt;. That is why a topic with 1-hour retention can hold 3 hours of data — the active segment has not rolled. Comes up in every data-deletion/GDPR conversation.&quot;,
    &quot;Mention &lt;code&gt;.timeindex&lt;/code&gt; (time-based lookup, powers &lt;code&gt;offsetsForTimes&lt;/code&gt;), &lt;code&gt;.snapshot&lt;/code&gt; (producer state for idempotence), and &lt;code&gt;leader-epoch-checkpoint&lt;/code&gt; — all three come back in later chapters.&quot;,
    &quot;JBOD note: multiple &lt;code&gt;log.dirs&lt;/code&gt; means multiple disks, and partitions are distributed across them; a single partition is never striped.&quot;]},

  s2e:{title:&quot;Bootstrap and metadata&quot;,sub:&quot;3 min · the developer's slide&quot;,points:[
    &quot;Key insight: &lt;code&gt;bootstrap.servers&lt;/code&gt; is a &lt;b&gt;seed list&lt;/b&gt;, not a load balancer and not a permanent connection. Any reachable broker will do; the client then learns the real topology.&quot;,
    &quot;Clients are &lt;b&gt;thick&lt;/b&gt;: they get every broker's advertised address plus the leader/ISR for each partition, and then connect directly to leaders. No redirection, no proxy.&quot;,
    &quot;&lt;code&gt;NOT_LEADER_OR_FOLLOWER&lt;/code&gt; is &lt;b&gt;normal&lt;/b&gt; during failover — the client refreshes metadata and retries transparently. Seeing it in logs is not itself an incident.&quot;,
    &quot;Now the bug: &lt;code&gt;advertised.listeners&lt;/code&gt;. Bootstrap succeeds (you reached a broker), then metadata hands back an unreachable internal hostname and everything hangs. 'It connected and then timed out' is the signature — Docker, k8s and NAT all produce it.&quot;,
    &quot;Make the crucial point: &lt;b&gt;a TCP load balancer cannot fix this.&lt;/b&gt; Metadata still returns per-broker addresses. Each broker needs an address the client can actually resolve — hence per-broker listeners with separate internal/external maps.&quot;,
    &quot;Practical debugging tip: &lt;code&gt;kafka-broker-api-versions.sh --bootstrap-server ...&lt;/code&gt; prints what the cluster advertises. If those addresses look wrong from where you are standing, that is your bug.&quot;]},

  s2f:{title:&quot;Sizing a cluster&quot;,sub:&quot;3 min&quot;,points:[
    &quot;Four bounds: network, disk throughput, disk capacity, partition count. &lt;b&gt;CPU is usually not the bottleneck&lt;/b&gt; — unless you turned on TLS or forced broker-side recompression.&quot;,
    &quot;The capacity formula: ingress × RF × retention ÷ compression, plus ~40% headroom. Do this arithmetic live if you have a number from the room.&quot;,
    &quot;The write-amplification point people forget: at RF=3, 100 MB/s in means roughly 200 MB/s of replication traffic &lt;b&gt;out&lt;/b&gt; of the leader. Then every additional consumer group re-reads the whole stream.&quot;,
    &quot;Heap: keep it modest (~6 GB) and leave the rest of RAM to the page cache. Big heaps cause GC pauses, which cause ISR shrink, which looks like a replication problem. Callback to this in 07.3.&quot;,
    &quot;&lt;b&gt;Cross-AZ transfer cost&lt;/b&gt; is the line nobody forecasts and it can rival compute. Levers: compression, rack-aware follower fetching, honest retention.&quot;,
    &quot;Tiered storage changes the shape: capacity stops driving broker count, and rebalances get much faster because less data is local.&quot;,
    &quot;Close with: benchmark with &lt;b&gt;your&lt;/b&gt; record size using the bundled perf tools. Record size alone moves throughput by an order of magnitude, so generic numbers are close to useless.&quot;]},

  ch3:{title:&quot;Chapter 03 — Topics &amp; Partitions&quot;,sub:&quot;~20 min · the irreversible decision&quot;,points:[
    &quot;Pacing: 3 min the model, 5 min how many, 4 min keys and skew, 4 min retention vs compaction, 3 min living with it.&quot;,
    &quot;The thesis for the chapter: partitioning is the one design decision that is genuinely hard to undo, so it deserves real thought at design time.&quot;,
    &quot;Have a concrete topic from the audience in mind if you can — sizing it live is much more persuasive than the abstract formula.&quot;]},

  s3a:{title:&quot;Topics and partitions&quot;,sub:&quot;3 min&quot;,points:[
    &quot;Definitions first: a topic is a &lt;b&gt;name&lt;/b&gt;; a partition is the physical, ordered, numbered log. All three properties of Kafka — parallelism, ordering, storage distribution — come from the partition.&quot;,
    &quot;State the ordering rule crisply and then repeat it: &lt;b&gt;a topic has no order; only a partition does.&lt;/b&gt; Every 'Kafka reordered my events' report is really 'my events went to different partitions'.&quot;,
    &quot;Offsets are &lt;b&gt;per partition&lt;/b&gt;. There is no global sequence number and no global ordering. If someone needs a total order across a topic, they need one partition — and they should understand they just capped throughput.&quot;,
    &quot;Point out on the diagram that partitions fill independently and at different rates.&quot;,
    &quot;Foreshadow: the key decides which partition, which means the key decides both your ordering guarantee and your load distribution. Two slides from now that becomes a problem.&quot;]},

  s3b:{title:&quot;How many partitions?&quot;,sub:&quot;5 min&quot;,points:[
    &quot;Give the formula — &lt;code&gt;max(t/p, t/c)&lt;/code&gt; — then immediately say the interesting part: the &lt;b&gt;consumer&lt;/b&gt; term almost always dominates, because your processing (a DB write, an API call) is far slower than Kafka's IO.&quot;,
    &quot;Work the example out loud, and add the sanity checks: at least as many partitions as consumers you will ever want; enough key cardinality to fill them; and the replica count you are adding to the cluster (partitions × RF).&quot;,
    &quot;Now the asymmetry, which is the real content: too few is &lt;b&gt;hard&lt;/b&gt; to fix (adding partitions breaks key affinity, and you can never reduce them), while too many is a gradual, tolerable cost.&quot;,
    &quot;But be specific about that cost so nobody 'just uses 1000': file handles and memory per replica on brokers, a &lt;b&gt;per-partition batch buffer in every producer&lt;/b&gt;, worse batching (higher latency), and slower rebalances/elections.&quot;,
    &quot;Practical default worth stating: a small multiple of broker count (6/12/24) for ordinary topics; size explicitly only where you have measured. &lt;b&gt;Uniform is easier to operate than clever.&lt;/b&gt;&quot;,
    &quot;If asked about the historical limits: ZooKeeper-era guidance capped clusters in the low hundreds of thousands of partitions. KRaft raises that ceiling a lot, but per-broker limits still come from memory, file handles and replication overhead. Do not treat 'millions supported' as 'millions advisable'.&quot;],
   ask:&quot;Pick a topic you own — what would you size it at, and what is the consumer-side throughput per instance?&quot;},

  s3c:{title:&quot;Keys, hashing and hot partitions&quot;,sub:&quot;4 min&quot;,points:[
    &quot;The key does two jobs at once: it buys &lt;b&gt;per-entity ordering&lt;/b&gt; and it determines &lt;b&gt;load distribution&lt;/b&gt;. When those conflict, you get a hot partition.&quot;,
    &quot;Mechanics: keyed records go to &lt;code&gt;murmur2(key) % numPartitions&lt;/code&gt; — deterministic and identical across all official clients, which is why a Java producer and a Python consumer agree.&quot;,
    &quot;For null keys, modern clients use a &lt;b&gt;sticky&lt;/b&gt; partitioner: fill one partition's batch, send, switch. Explain why that beats round-robin — fuller batches, so &lt;b&gt;better&lt;/b&gt; latency and throughput, not worse.&quot;,
    &quot;Hit the whale-key button. Point at the utilisation bars: one consumer saturated, five idle. Then say the sentence that matters: &lt;b&gt;adding consumers cannot fix this&lt;/b&gt;, because a partition maps to exactly one consumer.&quot;,
    &quot;Give the real-world shapes: multi-tenant where one tenant is 60% of traffic; keying by country; keying by a low-cardinality enum (status, event type) so most traffic lands in three buckets.&quot;,
    &quot;Then the four fixes, and be honest about the trade in each: composite key (weakens ordering to bucket level), separate topic for whales (best isolation), two-stage re-keying, custom partitioner (undocumented tribal knowledge risk).&quot;,
    &quot;Diagnose before redesigning: per-partition lag or offsets. If one partition holds most records, you have skew, not a capacity problem.&quot;]},

  s3d:{title:&quot;Retention vs compaction&quot;,sub:&quot;4 min&quot;,points:[
    &quot;Two cleanup policies with completely different semantics. &lt;code&gt;delete&lt;/code&gt; keeps a &lt;b&gt;window of history&lt;/b&gt;; &lt;code&gt;compact&lt;/code&gt; keeps the &lt;b&gt;latest value per key&lt;/b&gt;, indefinitely.&quot;,
    &quot;Run the cleaner animation and point out both results: superseded records vanish, and &lt;b&gt;offsets now have gaps&lt;/b&gt;. Consumers must never assume contiguous offsets.&quot;,
    &quot;The conceptual payoff: a compacted topic is a &lt;b&gt;durable, replayable table&lt;/b&gt;. Replay it and you get current state, not history. That is exactly how Kafka Streams state stores, Connect offsets and &lt;code&gt;__consumer_offsets&lt;/code&gt; work — Kafka uses this on itself.&quot;,
    &quot;Tombstones: a record with a &lt;code&gt;null&lt;/code&gt; value means 'this key is deleted'. Your consumers must handle null values explicitly, or they will NPE on deletes — extremely common bug.&quot;,
    &quot;The subtle data bug worth calling out: tombstones only survive &lt;code&gt;delete.retention.ms&lt;/code&gt; (24h default). A consumer offline for two days &lt;b&gt;misses the delete&lt;/b&gt; and keeps a phantom row forever. Real incident material.&quot;,
    &quot;Also: compaction is asynchronous and never touches the active segment, so duplicate keys stay visible for a while. Consumers must be idempotent regardless of policy.&quot;,
    &quot;Mention &lt;code&gt;compact,delete&lt;/code&gt; together — latest value per key, but nothing older than N days. Useful and underused.&quot;]},

  s3e:{title:&quot;Changing your mind later&quot;,sub:&quot;3 min&quot;,points:[
    &quot;Adding partitions is allowed and rehashes nothing. The consequence: &lt;code&gt;hash(k)%12 ≠ hash(k)%24&lt;/code&gt;, so a key's future records may land in a different partition than its history. &lt;b&gt;Per-key ordering is broken across the change.&lt;/b&gt;&quot;,
    &quot;Reducing partition count is &lt;b&gt;not possible at all&lt;/b&gt;. The only path is a new topic and a migration.&quot;,
    &quot;So the guidance: if per-key ordering is load-bearing (state machines, CDC, aggregates), create &lt;code&gt;topic.v2&lt;/code&gt; with the new count and cut over deliberately. Do not alter in place.&quot;,
    &quot;Compacted topics are the sharpest case — after a resize two partitions can hold different 'latest' values for one key, and compaction cannot reconcile across partitions.&quot;,
    &quot;Reassignment: moving replicas is a &lt;b&gt;bulk data copy&lt;/b&gt;. Always throttle. Unthrottled reassignments have caused more outages than hardware failures.&quot;,
    &quot;Two surprises worth naming: a &lt;b&gt;new broker sits idle&lt;/b&gt; until you reassign partitions onto it, and leadership skews after failures until preferred-leader election runs. Recommend Cruise Control before the cluster gets big.&quot;]},

  ch4:{title:&quot;Chapter 04 — The Commit Log&quot;,sub:&quot;~20 min · the physics&quot;,points:[
    &quot;Pacing: 3 min offsets, 4 min record format, 5 min watermarks, 4 min __consumer_offsets, 4 min why it is fast.&quot;,
    &quot;This is the most 'internals' chapter. The reward for the audience is that three later mysteries stop being mysterious: why replication lag looks like consumer latency, why a hung transaction stalls readers, and why fsync is not the durability mechanism.&quot;,
    &quot;If you are running short on time overall, 04.2 (record format) is the most compressible slide here — but keep the three red fields (PID/epoch/sequence), because chapter 05 depends on them.&quot;]},

  s4a:{title:&quot;Offsets and the commit log&quot;,sub:&quot;3 min&quot;,points:[
    &quot;The offset is a &lt;b&gt;position in one partition&lt;/b&gt; — monotonic, never reused, never reassigned. Not a global id and not a timestamp.&quot;,
    &quot;Writes only append at the tail. Nothing is ever edited in place, which is what makes the whole design cheap.&quot;,
    &quot;A read is a &lt;b&gt;pointer move&lt;/b&gt;. The consumer's position is client-side bookkeeping, which is why replay costs nothing structurally.&quot;,
    &quot;Contrast explicitly with a queue: there is no 'remove after read' step at all, so there is no per-message state on the broker. That absence is why one broker handles enormous fan-out.&quot;,
    &quot;Foreshadow the next slides: there are several offsets in play (LEO, HW, LSO, committed), and mixing them up is where confusion lives.&quot;]},

  s4b:{title:&quot;What a message really is&quot;,sub:&quot;4 min&quot;,points:[
    &quot;The unit on the wire and on disk is the &lt;b&gt;record batch&lt;/b&gt;, not the record. One header amortized over many records — that is a large part of the performance story.&quot;,
    &quot;Walk the header quickly, but stop on the three red fields: &lt;b&gt;producerId, producerEpoch, baseSequence&lt;/b&gt;. These are the entire mechanism for idempotence and transactions, and they live &lt;b&gt;in the log format itself&lt;/b&gt; — no side store required. Chapter 05 pays this off.&quot;,
    &quot;Records store timestamp and offset as &lt;b&gt;deltas&lt;/b&gt; in varints, so per-record overhead is a handful of bytes.&quot;,
    &quot;Compression is &lt;b&gt;per batch&lt;/b&gt;, not per record. Similar records compress together — 5–10× on JSON is routine, and bigger batches compress better. This is why linger.ms affects your storage bill, not just latency.&quot;,
    &quot;Headers exist: trace ids, schema version, event type, tenant. Use them rather than inventing an envelope inside the value.&quot;,
    &quot;Then the important operational consequence: normally the broker &lt;b&gt;never decompresses&lt;/b&gt; — it stores what it received and streams the same bytes out. But &lt;code&gt;LogAppendTime&lt;/code&gt; timestamps or old client formats force decompress→rewrite→recompress on every batch. One config turning a byte pipe into a CPU-bound transcoder is a great war story.&quot;]},

  s4c:{title:&quot;Four offsets that matter&quot;,sub:&quot;5 min · the conceptual core&quot;,points:[
    &quot;This slide resolves more confusion than any other in the deck. Step through the animation and name each marker as it moves.&quot;,
    &quot;&lt;b&gt;LEO&lt;/b&gt; — next offset to be written on this replica. Leader LEO minus follower LEO is replica lag.&quot;,
    &quot;&lt;b&gt;High watermark&lt;/b&gt; — the highest offset replicated to &lt;b&gt;all&lt;/b&gt; in-sync replicas. Consumers cannot read past it. Explain why: if consumers could read un-replicated records, a leader failure would make already-delivered data disappear. The HW is what makes reads survive failover.&quot;,
    &quot;State the consequence loudly, because it is non-obvious: &lt;b&gt;replication lag shows up as consumer latency.&lt;/b&gt; A slow follower delays visibility of data that is already on the leader's disk.&quot;,
    &quot;&lt;b&gt;LSO&lt;/b&gt; — with &lt;code&gt;read_committed&lt;/code&gt;, consumption stops at the first offset of the oldest open transaction. So one hung transaction stalls readers even though newer committed data exists. Callback in 05.5.&quot;,
    &quot;&lt;b&gt;Log start offset&lt;/b&gt; moves right as retention or compaction removes data. Reading below it gives &lt;code&gt;OffsetOutOfRange&lt;/code&gt;, and what happens next depends on &lt;code&gt;auto.offset.reset&lt;/code&gt; — &lt;code&gt;earliest&lt;/code&gt; reprocesses everything, &lt;code&gt;latest&lt;/code&gt; silently skips. Both have ruined weekends.&quot;,
    &quot;&lt;b&gt;Committed offset&lt;/b&gt; is a group's bookkeeping and lives elsewhere entirely — next slide.&quot;]},

  s4d:{title:&quot;__consumer_offsets&quot;,sub:&quot;4 min&quot;,points:[
    &quot;There is no offset database. A commit is a &lt;b&gt;produce&lt;/b&gt; to an internal compacted topic. Kafka dogfooding its own primitives.&quot;,
    &quot;Key is &lt;code&gt;(group, topic, partition)&lt;/code&gt;, value is the offset plus metadata — so compaction naturally keeps exactly the latest position per assignment. The 'offset store' is emergent behaviour of log compaction.&quot;,
    &quot;The coordinator is determined by &lt;code&gt;abs(hash(groupId)) % 50&lt;/code&gt; → that partition's leader. That is why &lt;code&gt;FindCoordinator&lt;/code&gt; exists and why a broker loss briefly pauses a group while it re-discovers.&quot;,
    &quot;The behaviour that bites: &lt;code&gt;offsets.retention.minutes&lt;/code&gt; (7 days) expires offsets for &lt;b&gt;inactive&lt;/b&gt; groups. A weekly or monthly job that pauses too long comes back and resets per &lt;code&gt;auto.offset.reset&lt;/code&gt; — instant duplicate storm or silent skip.&quot;,
    &quot;Cost of committing: every commit is a produce plus replication. Per-message commits are measurably slow; commit per poll or per batch.&quot;,
    &quot;Check RF on this topic in every environment. Quick-start clusters often leave it at 1, so one broker loss rewinds &lt;b&gt;every&lt;/b&gt; consumer group.&quot;,
    &quot;Debugging trick: you can consume &lt;code&gt;__consumer_offsets&lt;/code&gt; with the offsets formatter and watch commits live. Very few people know this.&quot;]},

  s4e:{title:&quot;Why it is fast&quot;,sub:&quot;4 min&quot;,points:[
    &quot;Four decisions, no magic: sequential IO, page cache instead of heap, zero-copy reads, batching everywhere. Kafka is fast because it does almost nothing per message.&quot;,
    &quot;Page cache is the interesting one: Kafka has no in-process record cache. Recent data is served from RAM the &lt;b&gt;kernel&lt;/b&gt; already holds — no GC pressure, and the cache survives a broker process restart.&quot;,
    &quot;Zero-copy: &lt;code&gt;sendfile()&lt;/code&gt; moves bytes from page cache straight to the socket. The broker never materializes your records as objects on the read path.&quot;,
    &quot;Now the honest caveats: &lt;b&gt;TLS defeats zero-copy&lt;/b&gt; (real CPU cost — budget for it), broker-side recompression defeats it too, and &lt;b&gt;lagging consumers read cold from disk&lt;/b&gt;, which is how one backfill degrades p99 for every tenant on that broker.&quot;,
    &quot;Then the punchline that surprises database people: &lt;b&gt;Kafka does not fsync every write.&lt;/b&gt; Durability comes from replication — &lt;code&gt;acks=all&lt;/code&gt; plus &lt;code&gt;min.insync.replicas=2&lt;/code&gt; means the data is in the page cache of multiple machines in different failure domains. That is a better trade than fsync-per-write on one node, and it is why Kafka is fast.&quot;,
    &quot;Pause here for questions. This is the slide that provokes the best ones.&quot;,
    &quot;Practical takeaway: &lt;code&gt;linger.ms=5&lt;/code&gt; plus lz4 is often a 2–10× throughput change for a handful of milliseconds. Most under-performing producers are simply unbatched.&quot;],
   ask:&quot;Who assumed Kafka fsyncs every write? What does that change about how you would configure it?&quot;},

  ch5:{title:&quot;Chapter 05 — Producers&quot;,sub:&quot;~20 min · the write path&quot;,points:[
    &quot;Pacing: 3 min partitioner, 4 min accumulator, 4 min acks matrix, 3 min idempotence, 3 min transactions, 3 min tuning.&quot;,
    &quot;The chapter's spine: &lt;code&gt;send()&lt;/code&gt; returns before anything is durable. Everything else — batching, acks, retries, idempotence, transactions — exists to manage that gap.&quot;,
    &quot;The acks × min.insync trap (05.3) is the single most valuable slide for most audiences. If you are running late, protect it and compress 05.5 instead.&quot;]},

  s5a:{title:&quot;Producers&quot;,sub:&quot;3 min&quot;,points:[
    &quot;Start with the thing everyone gets wrong: &lt;code&gt;send()&lt;/code&gt; is &lt;b&gt;asynchronous&lt;/b&gt; and returns as soon as the record is in a local buffer. No broker has seen it.&quot;,
    &quot;Therefore: &lt;b&gt;ignoring the callback or the Future means losing data silently.&lt;/b&gt; Fire-and-forget code that never checks for errors is the most common data-loss bug in Kafka applications, and it looks perfectly fine in review.&quot;,
    &quot;Watch the animation: same key always lands in the same partition (murmur2 % N), giving per-entity ordering.&quot;,
    &quot;Mention the three things a producer does before the network: serialize, partition, accumulate. Serialization happens on &lt;b&gt;your&lt;/b&gt; thread, so a slow serializer is your latency.&quot;,
    &quot;Foreshadow: next slide opens the client up and shows where the record actually sits between &lt;code&gt;send()&lt;/code&gt; and the ack.&quot;]},

  s5b:{title:&quot;Inside the producer&quot;,sub:&quot;4 min&quot;,points:[
    &quot;A producer is &lt;b&gt;two threads and a buffer&lt;/b&gt;. Your thread fills batches; a background sender thread does all network work. Nearly every producer tuning question is a question about this picture.&quot;,
    &quot;Walk the five steps. Emphasise step 4: the sender groups ready batches &lt;b&gt;per broker&lt;/b&gt;, so one request carries batches for several partitions — which is why one slow partition leader can slow unrelated topics.&quot;,
    &quot;Toggle linger 0 → 20 and watch records-per-request. Same input rate, only the batching policy changed. This is the most convincing throughput demo in the deck.&quot;,
    &quot;Correct the common misreading: &lt;code&gt;linger.ms=0&lt;/code&gt; does not mean 'no batching' — it means 'do not wait deliberately'. Under load, records still batch while a request is in flight.&quot;,
    &quot;Then the failure mode people do not expect: when the buffer fills because brokers are slow, &lt;code&gt;send()&lt;/code&gt; &lt;b&gt;blocks&lt;/b&gt; for up to &lt;code&gt;max.block.ms&lt;/code&gt; (60s) and then throws. Your 'fully async' producer will stall request threads under duress. Monitor &lt;code&gt;buffer-available-bytes&lt;/code&gt;.&quot;,
    &quot;Warn about blocking inside callbacks — they run on the sender thread, so blocking there stops the entire producer.&quot;,
    &quot;One producer instance is thread-safe and should be &lt;b&gt;shared&lt;/b&gt;. Creating a producer per request is a real and surprisingly common performance bug (each one has its own buffer and connections).&quot;]},

  s5c:{title:&quot;acks × min.insync.replicas&quot;,sub:&quot;4 min · protect this slide&quot;,points:[
    &quot;Two settings in two different places — one on the client, one on the topic — jointly define your data-loss window. Different teams usually own them, which is exactly why the trap exists.&quot;,
    &quot;Walk the three acks values, then dwell on the trap: &lt;b&gt;acks=all with min.insync.replicas=1 is effectively acks=1&lt;/b&gt; when the ISR has shrunk to just the leader. You get an ack, the leader dies, the data is gone. And min.insync=1 is the default.&quot;,
    &quot;Correct pairing for RF=3: &lt;code&gt;acks=all&lt;/code&gt; + &lt;code&gt;min.insync.replicas=2&lt;/code&gt;. Now the broker &lt;b&gt;rejects&lt;/b&gt; the write with &lt;code&gt;NotEnoughReplicasException&lt;/code&gt; when it cannot protect it.&quot;,
    &quot;Reframe that rejection as a feature: the cluster would rather fail loudly than accept data it cannot keep. Given the alternative is unnoticed loss, that is the right behaviour.&quot;,
    &quot;Work the RF/min.insync table. The row worth naming is RF=3, min.insync=3 — zero tolerance, so any single broker restart blocks writes. People set this thinking it is 'safest'.&quot;,
    &quot;Cost of acks=all is &lt;b&gt;one extra round trip to the slowest ISR member&lt;/b&gt; — typically a few milliseconds in-AZ. Cheap insurance, and it is why the 08.4 profiles barely change this setting.&quot;],
   ask:&quot;Does anyone know what min.insync.replicas is set to on their production topics? It is usually a room full of silence.&quot;},

  s5d:{title:&quot;The idempotent producer&quot;,sub:&quot;3 min&quot;,points:[
    &quot;Set up the precise failure: the write &lt;b&gt;succeeded&lt;/b&gt; and the &lt;b&gt;ack&lt;/b&gt; was lost. The producer must retry, and without idempotence that retry creates a duplicate. Nobody did anything wrong.&quot;,
    &quot;Run the animation. Mechanism: PID + epoch + a monotonic &lt;b&gt;sequence per partition&lt;/b&gt;; the leader remembers the last accepted sequence per (PID, partition) and rejects what it has already seen while still returning success.&quot;,
    &quot;Third case matters too: a sequence &lt;b&gt;too far ahead&lt;/b&gt; throws &lt;code&gt;OutOfOrderSequenceException&lt;/code&gt;, because a batch was permanently lost and silently accepting would break ordering. Failing loudly is correct.&quot;,
    &quot;The subtle win people miss: before idempotence, retries with multiple in-flight requests could &lt;b&gt;reorder&lt;/b&gt; records. Sequence numbers let the broker enforce order, so you keep pipelining (max.in.flight up to 5) &lt;b&gt;and&lt;/b&gt; ordering. You no longer trade throughput for order.&quot;,
    &quot;It is on by default since 3.0 and implies &lt;code&gt;acks=all&lt;/code&gt;. If someone has explicitly disabled it, ask why — it is nearly free.&quot;,
    &quot;Scope it honestly: this dedups the &lt;b&gt;producer's own retries&lt;/b&gt; within a partition. It does not dedup your application sending the same business event twice. That is your idempotency key, not Kafka's.&quot;]},

  s5e:{title:&quot;Transactions&quot;,sub:&quot;3–4 min&quot;,points:[
    &quot;Idempotence fixes duplicates in one partition. Transactions make a &lt;b&gt;set&lt;/b&gt; of writes across partitions and topics — plus the consumer's offset commit — atomically visible or not at all.&quot;,
    &quot;Walk the code. The critical line is &lt;code&gt;sendOffsetsToTransaction&lt;/code&gt;: the offsets travel &lt;b&gt;inside&lt;/b&gt; the transaction, which is what closes the consume-transform-produce loop.&quot;,
    &quot;Mechanism worth naming: a transaction coordinator logs state to &lt;code&gt;__transaction_state&lt;/code&gt;; &lt;code&gt;transactional.id&lt;/code&gt; maps to a PID and &lt;b&gt;epoch&lt;/b&gt;; a restarted instance bumps the epoch and &lt;b&gt;fences the zombie&lt;/b&gt;, so a hung old process cannot commit later.&quot;,
    &quot;Commit writes &lt;b&gt;control records&lt;/b&gt; (markers) into every partition touched. They consume offsets but are invisible to applications — which is why your consumer sometimes sees offset gaps in transactional topics.&quot;,
    &quot;&lt;code&gt;isolation.level=read_committed&lt;/code&gt; is &lt;b&gt;mandatory&lt;/b&gt; on the consumer side. Without it, you read aborted data and the whole exercise was pointless. This is the most common transactional misconfiguration.&quot;,
    &quot;Costs, stated plainly: extra round trips and markers, so tiny transactions are expensive — batch a poll's worth of work. And a &lt;b&gt;hung transaction blocks read_committed consumers&lt;/b&gt; until &lt;code&gt;transaction.timeout.ms&lt;/code&gt; (60s) aborts it.&quot;,
    &quot;Recommendation: if the work is Kafka→Kafka, use &lt;b&gt;Kafka Streams&lt;/b&gt; with &lt;code&gt;exactly_once_v2&lt;/code&gt; or Flink, rather than hand-rolling this loop.&quot;]},

  s5f:{title:&quot;Producer tuning&quot;,sub:&quot;3 min&quot;,points:[
    &quot;The timeout hierarchy is nested and people tune the wrong level. The one that matters is &lt;b&gt;&lt;code&gt;delivery.timeout.ms&lt;/code&gt;&lt;/b&gt; — total budget from &lt;code&gt;send()&lt;/code&gt; to success or failure, retries included. Set it to your real business deadline and let the client manage retries inside it.&quot;,
    &quot;&lt;code&gt;request.timeout.ms&lt;/code&gt; is per attempt; &lt;code&gt;max.block.ms&lt;/code&gt; only covers buffer-full and metadata waits. Raising &lt;code&gt;retries&lt;/code&gt; is mostly obsolete.&quot;,
    &quot;Compression: &lt;b&gt;lz4 is the best default&lt;/b&gt; — fast enough to be nearly free. &lt;code&gt;zstd&lt;/code&gt; when network or storage cost dominates (cross-AZ). Avoid gzip. Choose &lt;code&gt;none&lt;/code&gt; only for already-compressed payloads.&quot;,
    &quot;Walk the error list; the important one is &lt;code&gt;TimeoutException&lt;/code&gt;, which is &lt;b&gt;inherently ambiguous&lt;/b&gt; — the write may or may not have landed. With idempotence on, just retry. Without it, you are choosing between duplicate and loss with no third option.&quot;,
    &quot;&lt;code&gt;RecordTooLargeException&lt;/code&gt; requires three settings to agree: client &lt;code&gt;max.request.size&lt;/code&gt;, broker &lt;code&gt;message.max.bytes&lt;/code&gt;, topic &lt;code&gt;max.message.bytes&lt;/code&gt;. Fixing one and not the others is a classic.&quot;,
    &quot;Close the chapter with a checklist: share one producer, set linger 5–10, use lz4, keep idempotence on, pair acks=all with min.insync=2, and &lt;b&gt;always handle the callback&lt;/b&gt;.&quot;]},

  ch6:{title:&quot;Chapter 06 — Consumers &amp; Groups&quot;,sub:&quot;~20 min · where production pain lives&quot;,points:[
    &quot;Pacing: 3 min groups, 4 min poll loop, 3 min protocol, 4 min rebalancing, 3 min assignors, 3 min offsets and lag.&quot;,
    &quot;Say up front: &lt;b&gt;most Kafka incidents are consumer incidents.&lt;/b&gt; The brokers are usually fine. This chapter is where the on-call value is.&quot;,
    &quot;The two ideas to make sure land: assignment is computed &lt;b&gt;client-side&lt;/b&gt;, and rebalancing is the dominant operational pain — with four generations of fixes available.&quot;]},

  s6a:{title:&quot;Consumers and consumer groups&quot;,sub:&quot;3 min&quot;,points:[
    &quot;The core rule: within a group, each partition is assigned to &lt;b&gt;exactly one&lt;/b&gt; consumer. That is what makes consumption both parallel and ordered.&quot;,
    &quot;Therefore the scaling ceiling is the partition count, &lt;b&gt;per group&lt;/b&gt;. 12 partitions means at most 12 useful consumers; the 13th pod is pure cost. Connect this back to chapter 03.&quot;,
    &quot;Different groups are fully independent: same bytes, separate offsets, separate failure domains. Adding a new consumer of an existing stream is a config change.&quot;,
    &quot;Consumers &lt;b&gt;pull&lt;/b&gt;. That is deliberate — it means a slow consumer cannot be overwhelmed by the broker, and it batches naturally. A pushed system needs flow control; a pulled system gets it for free.&quot;,
    &quot;Foreshadow: 'add a consumer and Kafka rebalances' sounds harmless. It is the most expensive sentence in this chapter.&quot;]},

  s6b:{title:&quot;The poll loop&quot;,sub:&quot;4 min&quot;,points:[
    &quot;&lt;code&gt;poll()&lt;/code&gt; is not just 'get records'. It joins the group, drives the assignment protocol, sends fetches, and advances position. Most consumer bugs are poll-loop bugs.&quot;,
    &quot;The two timeouts, which are constantly confused: &lt;b&gt;&lt;code&gt;session.timeout.ms&lt;/code&gt;&lt;/b&gt; (45s) detects a &lt;b&gt;dead process&lt;/b&gt; via background-thread heartbeats; &lt;b&gt;&lt;code&gt;max.poll.interval.ms&lt;/code&gt;&lt;/b&gt; (5 min) detects a &lt;b&gt;livelock&lt;/b&gt; — process alive but not making progress.&quot;,
    &quot;Since 0.10.1 heartbeats live on a background thread, which is exactly why those two failure modes split apart. Before that, slow processing looked like death.&quot;,
    &quot;Walk the classic outage: a batch exceeds max.poll.interval → partitions revoked → your commit fails with &lt;code&gt;CommitFailedException&lt;/code&gt; → the work is redone elsewhere → if processing is always slow you get a &lt;b&gt;permanent rebalance loop where nothing ever completes&lt;/b&gt;. Ask if anyone has seen this; usually several hands.&quot;,
    &quot;The fix is &lt;b&gt;lower &lt;code&gt;max.poll.records&lt;/code&gt;&lt;/b&gt;, not a higher timeout. Bounding the work per poll keeps fast failure detection; raising the timeout blinds you to genuinely dead consumers.&quot;,
    &quot;Prefetch: the consumer pipelines fetches, so records for the next poll are often already in memory. That is why memory scales with assigned partitions × &lt;code&gt;max.partition.fetch.bytes&lt;/code&gt; — a consumer assigned 500 partitions can be surprisingly hungry.&quot;,
    &quot;Always &lt;code&gt;close()&lt;/code&gt;. It sends LeaveGroup and triggers an immediate rebalance instead of a 45-second timeout wait. In Kubernetes, that means handling SIGTERM properly.&quot;]},

  s6c:{title:&quot;The group protocol&quot;,sub:&quot;3 min&quot;,points:[
    &quot;The surprise worth leading with: &lt;b&gt;there is no scheduler.&lt;/b&gt; The group elects a leader — which is a &lt;b&gt;client&lt;/b&gt; — and that client computes the assignment. The broker only relays it.&quot;,
    &quot;Run the animation. FindCoordinator (hash the group id) → JoinGroup from every member → coordinator names the first joiner as leader and bumps the &lt;b&gt;generation id&lt;/b&gt; → the leader computes assignment → SyncGroup fans out each member's slice → heartbeats.&quot;,
    &quot;Why this design: it keeps assignment logic &lt;b&gt;pluggable and out of the broker&lt;/b&gt;. It is how Kafka Streams ships its own co-partitioning assignor without any broker changes.&quot;,
    &quot;The generation id is the fencing mechanism: commits stamped with an old generation are rejected. That is precisely what &lt;code&gt;CommitFailedException&lt;/code&gt; after a rebalance means — 'you do not own this partition any more'.&quot;,
    &quot;List the rebalance triggers, including the one people forget: &lt;b&gt;the partition count of a subscribed topic changing&lt;/b&gt;, and a subscription regex starting to match a new topic. Someone creating a topic can rebalance your group.&quot;,
    &quot;Note that KIP-848 moves assignment to the broker — so this client-side design is being replaced. Worth flagging that the mental model changes in Kafka 4.x.&quot;]},

  s6d:{title:&quot;Rebalancing&quot;,sub:&quot;4 min · the highest-value ops slide&quot;,points:[
    &quot;Four generations of fixes to one problem: the original protocol stopped the world.&quot;,
    &quot;Eager: &lt;b&gt;every&lt;/b&gt; member revokes &lt;b&gt;all&lt;/b&gt; partitions, then reassigns from scratch. Nobody consumes during the rebalance. One pod restart in a 50-pod group pauses all 50.&quot;,
    &quot;Cooperative incremental (KIP-429): members keep what they will retain; only moved partitions are revoked, in a second short rebalance. One config line, immediate improvement.&quot;,
    &quot;Static membership (KIP-345): a stable &lt;code&gt;group.instance.id&lt;/code&gt; means a restart within the session timeout &lt;b&gt;reclaims the same partitions with no rebalance at all&lt;/b&gt;. Ideal for StatefulSets and rolling deploys.&quot;,
    &quot;KIP-848: assignment moves broker-side and incremental; the stop-the-world barrier disappears. The direction of travel in 4.x.&quot;,
    &quot;Explain why it hurts more than it looks: &lt;b&gt;stateful consumers pay twice&lt;/b&gt; (discard local state, rebuild it), rebalances are the biggest source of &lt;b&gt;duplicate processing&lt;/b&gt;, they &lt;b&gt;cascade&lt;/b&gt; (post-rebalance load spikes trip other members' poll interval), and a naive rolling restart of N pods triggers up to 2N rebalances.&quot;,
    &quot;Mitigations in priority order: cooperative sticky → group.instance.id → commit in &lt;code&gt;onPartitionsRevoked&lt;/code&gt; → always close() → smaller max.poll.records → &lt;b&gt;alert on rebalance rate&lt;/b&gt;. A healthy group rebalances on deploys and otherwise never.&quot;],
   ask:&quot;Has anyone had a consumer group that would not stabilise? What did the logs say?&quot;},

  s6e:{title:&quot;Assignors&quot;,sub:&quot;3 min&quot;,points:[
    &quot;The assignor runs inside the group leader's client, so it is pluggable and inspectable.&quot;,
    &quot;Range is &lt;b&gt;systematically unfair&lt;/b&gt;: with two 3-partition topics and two consumers, one gets 4 and the other 2, because the remainder lands on the same consumer for every topic. Worth walking through — it surprises people that the old default was this skewed.&quot;,
    &quot;Round robin is fair but &lt;b&gt;reshuffles everything&lt;/b&gt; on any membership change, invalidating all local state.&quot;,
    &quot;Sticky is fair &lt;b&gt;and&lt;/b&gt; minimally disruptive. Cooperative sticky adds the incremental protocol. That is the default recommendation today.&quot;,
    &quot;Migration detail that saves an outage: to change strategies, deploy with &lt;b&gt;both&lt;/b&gt; listed (new first), then remove the old one in a second deploy. A group whose members cannot agree on a strategy will not form.&quot;,
    &quot;Custom assignors are legitimate: rack-aware placement to keep reads in-AZ, weighted assignment for uneven partitions, co-partitioning two topics. But do not override the Kafka Streams assignor — it handles co-partitioning and standby replicas.&quot;,
    &quot;Finally, &lt;code&gt;assign()&lt;/code&gt; vs &lt;code&gt;subscribe()&lt;/code&gt;: assign gives you manual control with &lt;b&gt;no group coordination and no failover&lt;/b&gt;. Fine for replay tools and ordinal-sharded workers; a footgun if you expected someone to pick up your partitions when you die.&quot;]},

  s6f:{title:&quot;Offsets and lag&quot;,sub:&quot;3 min&quot;,points:[
    &quot;Where you commit determines your delivery semantics. Walk the table; the row that matters is &lt;b&gt;&lt;code&gt;enable.auto.commit=true&lt;/code&gt;&lt;/b&gt;.&quot;,
    &quot;Explain the auto-commit hazard precisely: commits happen during &lt;code&gt;poll()&lt;/code&gt; on a timer, so records that were &lt;b&gt;fetched but not yet processed&lt;/b&gt; can be committed. Crash there and you have &lt;b&gt;silent data loss&lt;/b&gt; from something that looks like a safe default.&quot;,
    &quot;Safe default: &lt;code&gt;commitSync()&lt;/code&gt; after processing. Faster pattern: &lt;code&gt;commitAsync()&lt;/code&gt; in the loop with a &lt;code&gt;commitSync()&lt;/code&gt; in &lt;code&gt;finally&lt;/code&gt;.&quot;,
    &quot;Off-by-one warning: the committed offset is &lt;b&gt;next to read&lt;/b&gt;, i.e. lastProcessed + 1. Getting this wrong reprocesses or skips exactly one record per partition per restart — maddening to debug.&quot;,
    &quot;Lag: &lt;code&gt;LEO − committedOffset&lt;/code&gt;. Read the sample output and point at partition 1 — &lt;b&gt;aggregate lag would have hidden it&lt;/b&gt;. Always alert per partition.&quot;,
    &quot;Alert on &lt;b&gt;trend&lt;/b&gt;, not absolute value. Falling lag of 200k is fine; rising lag of 500 for ten minutes is an incident. Prefer &lt;b&gt;time-lag&lt;/b&gt; where you can compute it, because 'we are 40 seconds behind' is a sentence a product owner understands.&quot;,
    &quot;Lag stuck at a &lt;b&gt;constant&lt;/b&gt; number usually means a poison record: retry forever, never advance. Bounded retries plus a dead-letter topic. Have that pattern ready before you need it.&quot;]},

  ch7:{title:&quot;Chapter 07 — Replication &amp; ISR&quot;,sub:&quot;~20 min · the failure chapter&quot;,points:[
    &quot;Pacing: 3 min leaders/ISR, 4 min follower fetch, 4 min ISR mechanics, 4 min failure walkthroughs, 3 min multi-AZ, 3 min ops catalogue.&quot;,
    &quot;This is where you cash in any war stories the room offered at the start.&quot;,
    &quot;The goal: by the end they can narrate a failover second by second, and they know the four alerts that actually matter.&quot;]},

  s7a:{title:&quot;Replication and the ISR&quot;,sub:&quot;3 min&quot;,points:[
    &quot;Per partition: one leader, N followers on other brokers. All reads and writes go through the leader (with the follower-fetch exception in 07.5).&quot;,
    &quot;Say it precisely: replication is &lt;b&gt;per partition, not per broker&lt;/b&gt;. Every broker leads some partitions and follows others — that is how load stays even.&quot;,
    &quot;The &lt;b&gt;ISR&lt;/b&gt; is the set of replicas currently keeping up. It is &lt;b&gt;dynamic&lt;/b&gt;, and every durability guarantee is phrased in terms of it. Callback to 05.3.&quot;,
    &quot;Hit the kill button. Narrate: controller notices, promotes an ISR member, metadata propagates, clients get NOT_LEADER and retry. &lt;b&gt;No data loss&lt;/b&gt;, because the new leader had everything up to the high watermark.&quot;,
    &quot;RF=3 tolerates 2 broker losses for &lt;b&gt;availability of reads&lt;/b&gt;, and 1 loss while staying writable at min.insync=2. Be precise about that difference — people conflate them.&quot;]},

  s7b:{title:&quot;Followers are just consumers&quot;,sub:&quot;4 min&quot;,points:[
    &quot;The elegant bit: there is &lt;b&gt;no separate replication protocol&lt;/b&gt;. Followers issue Fetch requests exactly like consumers — same code path, same batching, same zero-copy.&quot;,
    &quot;The fetch offset &lt;b&gt;is&lt;/b&gt; the acknowledgement. There is no separate ack message; asking for offset N implicitly confirms everything before it.&quot;,
    &quot;Run the animation and watch the HW advance &lt;b&gt;after&lt;/b&gt; the followers catch up. Restate: &lt;code&gt;HW = min(LEO across the ISR)&lt;/code&gt;, and only then are records visible.&quot;,
    &quot;Note the one-round-trip delay: followers learn the new HW in the &lt;b&gt;next&lt;/b&gt; fetch response, so their view always lags slightly. This matters for follower-fetch reads in 07.5.&quot;,
    &quot;&lt;b&gt;Leader epoch&lt;/b&gt; (KIP-101) deserves a mention: before it, replicas could truncate to the wrong offset after a failover and silently diverge. Each leadership term has a monotonic epoch; recovering replicas ask 'where did epoch N end?' and truncate precisely. That is why the epoch is in every batch header and on disk.&quot;,
    &quot;Tuning: &lt;code&gt;num.replica.fetchers&lt;/code&gt; defaults to 1 and is a common bottleneck on brokers with many partitions. Raise it if &lt;code&gt;RemoteTimeMs&lt;/code&gt; or under-replicated counts climb under load.&quot;]},

  s7c:{title:&quot;ISR mechanics&quot;,sub:&quot;4 min&quot;,points:[
    &quot;In-sync means 'fetched up to the leader's LEO within &lt;code&gt;replica.lag.time.max.ms&lt;/code&gt;' (30s). Point out that it is &lt;b&gt;time&lt;/b&gt;-based, not message-count based — a count threshold falsely ejects replicas during traffic spikes.&quot;,
    &quot;Shrink and expand are normal events; &lt;b&gt;flapping&lt;/b&gt; is not. A replica repeatedly ejecting and rejoining is worse than one that is cleanly out.&quot;,
    &quot;Why replicas fall out, in order of frequency: &lt;b&gt;GC pause&lt;/b&gt; (a 40s stop-the-world beats the 30s threshold — this is why big heaps are discouraged, callback to 02.6), a single degraded disk, network saturation during a backfill, too few fetcher threads, or a genuine spike.&quot;,
    &quot;Then the metrics table, and be emphatic about the hierarchy: &lt;code&gt;UnderReplicatedPartitions&lt;/code&gt; is a &lt;b&gt;warning&lt;/b&gt;; &lt;code&gt;UnderMinIsrPartitionCount&lt;/code&gt; means &lt;b&gt;writes are being rejected right now&lt;/b&gt;; &lt;code&gt;OfflinePartitionsCount&lt;/code&gt; means &lt;b&gt;data is unavailable right now&lt;/b&gt;.&quot;,
    &quot;&lt;code&gt;ActiveControllerCount&lt;/code&gt; summed across the cluster must be &lt;b&gt;exactly 1&lt;/b&gt;. Zero means no controller; two means split brain.&quot;,
    &quot;If they keep only four alerts, keep these: UnderMinIsr &amp;gt; 0, OfflinePartitions &amp;gt; 0, ActiveControllerCount ≠ 1, consumer lag rising. Everything else is a dashboard. Repeat this in 09.3.&quot;]},

  s7d:{title:&quot;Three failures, step by step&quot;,sub:&quot;4 min · rehearse out loud&quot;,points:[
    &quot;Scenario A (clean leader loss) is the one to narrate with timings: crash → controller notices in about a second → ISR member promoted → metadata propagates → clients retry. Clients see a brief burst of retriable errors and recover. &lt;b&gt;No data loss.&lt;/b&gt;&quot;,
    &quot;Scenario B (all ISR gone) is the CAP trade as a config flag. &lt;code&gt;unclean.leader.election.enable=false&lt;/code&gt; → partition goes &lt;b&gt;offline&lt;/b&gt;, nothing readable or writable. &lt;code&gt;=true&lt;/code&gt; → a stale replica leads, and everything it never received is &lt;b&gt;permanently gone, including acknowledged records&lt;/b&gt;.&quot;,
    &quot;Add the detail that makes B genuinely alarming: consumers that already read those offsets now see &lt;b&gt;different data at the same offsets&lt;/b&gt;. The log has forked. Keep the flag false unless you can articulate why losing data is preferable to being unavailable.&quot;,
    &quot;Scenario C (the slow broker) is the one people are least prepared for. It does not die; it degrades. As a follower it flaps ISR; as a leader it spikes acks=all latency for every partition it leads, and because requests batch multiple partitions, latency spreads cluster-wide.&quot;,
    &quot;Land the lesson: &lt;b&gt;a degraded broker is worse than a dead one&lt;/b&gt;, because failure detection only handles the dead case. Watch per-broker &lt;code&gt;IsrShrinksPerSec&lt;/code&gt; and per-broker p99 produce latency.&quot;,
    &quot;Then the ask: &lt;b&gt;rehearse this in staging under load and measure it.&lt;/b&gt; Quoting a number you measured beats quoting the docs.&quot;]},

  s7e:{title:&quot;Across zones and regions&quot;,sub:&quot;3 min&quot;,points:[
    &quot;In-cluster replication gives broker fault tolerance. Surviving a &lt;b&gt;zone&lt;/b&gt; requires &lt;code&gt;broker.rack&lt;/code&gt; so replicas are spread across AZs; then RF=3 over 3 AZs survives a zone loss with min.insync=2 intact.&quot;,
    &quot;The bill: every write crosses AZ boundaries (RF−1) times, and inter-AZ transfer is usually metered. For a busy cluster this can exceed the compute cost. Say it plainly — it is the number nobody forecasts.&quot;,
    &quot;&lt;b&gt;Follower fetching&lt;/b&gt; (KIP-392) is the main lever: &lt;code&gt;client.rack&lt;/code&gt; on consumers plus a rack-aware replica selector means reads stay in-AZ. Caveat: followers serve only up to their (slightly stale) HW, so a little extra latency.&quot;,
    &quot;Stretch cluster vs MirrorMaker 2 is the real decision. Stretch = synchronous, RPO zero, no failover step, but every acks=all write pays inter-site latency. MM2 = asynchronous, non-zero RPO, and failover is an &lt;b&gt;operational procedure&lt;/b&gt; because offsets do not line up exactly.&quot;,
    &quot;Insist on this: &lt;b&gt;define RPO and RTO before choosing.&lt;/b&gt; There is no option that gives zero loss and low cost and low latency.&quot;,
    &quot;Active/active is achievable with prefixed topics to avoid mirror loops, but you now own conflict resolution at the application layer. Do not let anyone treat it as a checkbox.&quot;,
    &quot;Tiered storage helps here too: old data sits in already-multi-AZ object storage, local disks shrink, and rebalances get much faster.&quot;]},

  s7f:{title:&quot;What actually breaks&quot;,sub:&quot;3 min&quot;,points:[
    &quot;Walk the table quickly — it is a reference slide, so tell them to photograph it rather than reading every row aloud.&quot;,
    &quot;Highlight the top three by frequency: consumer lag climbing (usually a slow dependency or a rebalance loop, &lt;b&gt;not&lt;/b&gt; Kafka), producer timeouts (check ISR before touching client config), and disk full (someone set infinite retention).&quot;,
    &quot;Repeat the retention gotcha: shortening retention takes effect on &lt;b&gt;segment roll&lt;/b&gt;, so it is not instant relief for a full disk. Callback to 02.4.&quot;,
    &quot;'Connected then hung' → advertised.listeners, every time. Callback to 02.5.&quot;,
    &quot;'Duplicate processing after a rebalance' is &lt;b&gt;working as designed&lt;/b&gt; under at-least-once. The fix is idempotent handlers, not a Kafka setting. Sets up chapter 08.&quot;,
    &quot;The pattern to name: &lt;b&gt;most Kafka incidents are consumer or capacity incidents.&lt;/b&gt; Instrument clients as carefully as the cluster — most teams do the opposite.&quot;]},

  ch8:{title:&quot;Chapter 08 — Guarantees&quot;,sub:&quot;~20 min · mostly discussion&quot;,points:[
    &quot;Pacing: 4 min three semantics, 5 min ordering, 5 min end-to-end EOS, 4 min config profiles, then leave room for argument.&quot;,
    &quot;This chapter tends to generate the most debate, especially exactly-once. Let it — but keep steering back to 'what is the observable effect?'&quot;,
    &quot;The thesis: Kafka has a correctness &lt;b&gt;dial&lt;/b&gt;, not a correctness level, and the right setting differs per topic.&quot;]},

  s8a:{title:&quot;The three semantics&quot;,sub:&quot;4 min&quot;,points:[
    &quot;Define each by &lt;b&gt;where you commit relative to processing&lt;/b&gt;, which makes the trade obvious: before → at most once (loss), after → at least once (duplicates), transactionally → exactly once.&quot;,
    &quot;At-most-once is rarely a deliberate choice; it is usually the accidental result of auto-commit or acks=0. Name that.&quot;,
    &quot;At-least-once is the honest default. State the recommendation clearly: &lt;b&gt;90% of production systems should choose at-least-once with idempotent handlers.&lt;/b&gt; Simpler, faster, survives every failure mode.&quot;,
    &quot;Exactly-once is real but scoped, and it costs throughput. Two slides from now you will show exactly where it stops holding.&quot;,
    &quot;Useful audience question: 'what does your system do today?' Many people discover they are at-most-once because of auto-commit and have never noticed.&quot;,
    &quot;Note both sides must cooperate: producer idempotence/transactions &lt;b&gt;and&lt;/b&gt; consumer &lt;code&gt;read_committed&lt;/code&gt; or an idempotent sink. One side alone gives you nothing.&quot;]},

  s8b:{title:&quot;What guarantees order&quot;,sub:&quot;5 min&quot;,points:[
    &quot;Read the guarantee slowly: records with the &lt;b&gt;same key&lt;/b&gt;, from &lt;b&gt;one producer&lt;/b&gt;, to &lt;b&gt;one partition&lt;/b&gt;, are consumed in production order. Every clause is load-bearing.&quot;,
    &quot;Break it five ways. Different partitions (no cross-partition order exists, not even approximately). Retries without idempotence and max.in.flight&amp;gt;1 (silent reordering). Partition count change (a key's records split across partitions). Handing records to a thread pool (you discarded order inside your own app). And multiple producers writing the same key.&quot;,
    &quot;Spend the most time on the last one, because it is the deepest: Kafka orders by &lt;b&gt;arrival at the leader&lt;/b&gt;, not by when the action happened. Two services writing the same entity race, and the winner is whoever's packet arrives first. Kafka cannot save you — you need a &lt;b&gt;single writer per key&lt;/b&gt; or versioning in the payload.&quot;,
    &quot;The thread-pool one is worth a pause too: developers add concurrency inside the consumer for throughput and destroy the ordering they chose partitions for. If you must parallelise, use a &lt;b&gt;key-affine&lt;/b&gt; executor that pins a key to a worker.&quot;,
    &quot;Positive guidance: key by the entity whose order matters (&lt;code&gt;accountId&lt;/code&gt;, not &lt;code&gt;eventId&lt;/code&gt;) — the most consequential modelling decision on the producer side. Keep idempotence on. Carry a version or timestamp for defence in depth.&quot;,
    &quot;Reframe for the close: ordering is not something Kafka gives you — it is something you &lt;b&gt;buy with a key&lt;/b&gt;, and pay for with a parallelism limit on that key. That is the partition model in one sentence.&quot;]},

  s8c:{title:&quot;Where exactly-once stops&quot;,sub:&quot;5 min&quot;,points:[
    &quot;Three columns: holds, needs your help, cannot hold. Be honest about the third — it is where credibility is won.&quot;,
    &quot;Kafka→Kafka genuinely works. Streams with &lt;code&gt;exactly_once_v2&lt;/code&gt; or Flink's Kafka sink give it to you as a config value. If a pipeline is Kafka in and Kafka out, take it.&quot;,
    &quot;Kafka→database cannot be one transaction. Two patterns that actually work: &lt;b&gt;store the offset in the same DB transaction&lt;/b&gt; as the data and &lt;code&gt;seek()&lt;/code&gt; on assignment; or make the write &lt;b&gt;idempotent&lt;/b&gt; (upsert by business key, or a dedup table keyed by topic/partition/offset).&quot;,
    &quot;Kafka→external side effect (charge a card, send an email) &lt;b&gt;cannot&lt;/b&gt; be atomic. The only real answer is an idempotency key the &lt;b&gt;receiving&lt;/b&gt; system honours — every serious payments API supports one.&quot;,
    &quot;The framing that resolves most arguments in the room: exactly-once does not mean each record is delivered once — retries still happen. It means the &lt;b&gt;observable effect&lt;/b&gt; occurs once. So idempotence at the boundary is part of the design, not an admission of failure.&quot;,
    &quot;Design rule to leave them with: &lt;b&gt;make handlers idempotent first&lt;/b&gt;, then decide whether transactions are still worth the cost. Doing it the other way round yields slow pipelines that still need idempotent handlers.&quot;],
   ask:&quot;For your system: what is the natural idempotency key? If nobody can name one, that is the real finding.&quot;},

  s8d:{title:&quot;Four config profiles&quot;,sub:&quot;4 min · the slide they photograph&quot;,points:[
    &quot;Tell them to photograph this one. It is the single most reusable artifact in the deck.&quot;,
    &quot;Insist that these are &lt;b&gt;per topic&lt;/b&gt;, not per company. Most systems should run several profiles side by side, and &lt;code&gt;min.insync.replicas&lt;/code&gt;, retention and cleanup policy are all topic-level configs.&quot;,
    &quot;Point out how little changes between columns: &lt;b&gt;durability is nearly free&lt;/b&gt;. The differences are almost entirely batching and latency. That is the single best argument for defaulting to the safe column.&quot;,
    &quot;Max throughput column: the levers are &lt;code&gt;linger.ms&lt;/code&gt; 50–100, big &lt;code&gt;batch.size&lt;/code&gt;, zstd, and a high &lt;code&gt;fetch.min.bytes&lt;/code&gt;. Note this trades &lt;b&gt;latency&lt;/b&gt;, not durability.&quot;,
    &quot;Lowest latency column is the only one that relaxes durability, and only if the data genuinely tolerates it (live dashboards, signals). Be explicit that this is a real trade, not a free win.&quot;,
    &quot;Reiterate the trap: never &lt;code&gt;acks=all&lt;/code&gt; with &lt;code&gt;min.insync.replicas=1&lt;/code&gt;. Callback to 05.3.&quot;,
    &quot;Set cluster-level defaults for RF, min.insync and retention so &lt;b&gt;the lazy path is the safe path&lt;/b&gt; — the highest-leverage governance decision in the whole talk.&quot;]},

  ch9:{title:&quot;Chapter 09 — The Whole Picture&quot;,sub:&quot;~20 min including Q&amp;A&quot;,points:[
    &quot;Pacing: 3 min fan-out, 5 min ecosystem, 5 min day-two operations, 3 min recap, then Q&amp;A.&quot;,
    &quot;Purpose of this chapter is to convert understanding into next actions. Keep it practical.&quot;,
    &quot;If you are over time, cut 09.2 to the two cards that matter for this audience and protect 09.3 (the dashboard) and the recap.&quot;]},

  s9a:{title:&quot;One log, many worlds&quot;,sub:&quot;3 min&quot;,points:[
    &quot;Point at the animation: five consumer groups, five sets of offsets, &lt;b&gt;one copy of the data&lt;/b&gt;. Adding a sixth is a config change, not a project.&quot;,
    &quot;This is the payoff of chapter 01. Because the log is durable and replayable, one stream can serve real-time, batch, search, ML and audit simultaneously — with independent failure domains.&quot;,
    &quot;Note the cost side honestly: every group re-reads the whole stream, so fan-out consumes broker network. Callback to 02.6.&quot;,
    &quot;Good place to invite the room to name a stream in their own system that three teams would want.&quot;]},

  s9b:{title:&quot;The ecosystem&quot;,sub:&quot;5 min&quot;,points:[
    &quot;Most of what people attribute to 'Kafka' is delivered by this layer. Knowing which tool owns which job saves a lot of custom code.&quot;,
    &quot;&lt;b&gt;Connect&lt;/b&gt;: if you are writing a service whose only job is copying data between Kafka and a store, a connector probably exists. Debezium for CDC is the standout — it turns a database into a stream without touching application code.&quot;,
    &quot;&lt;b&gt;Streams vs Flink&lt;/b&gt;: Streams is a library (no cluster) for embedded processing with local RocksDB state and changelog topics. Flink is a cluster for heavy, stateful, long-lived jobs with proper event-time semantics and SQL. Rough rule: Streams for embedded and simple, Flink for big and operationally owned.&quot;,
    &quot;&lt;b&gt;Schema Registry&lt;/b&gt; — adopt early. Kafka values are opaque bytes and nothing stops a producer changing shape and breaking every consumer. A registry enforces compatibility at serialization time. Retrofitting schemas onto a live topic is genuinely painful.&quot;,
    &quot;&lt;b&gt;Tiered storage&lt;/b&gt;: months of retention without giant brokers, plus much faster rebalances. Historical reads get object-store latency.&quot;,
    &quot;Where it is heading: KRaft everywhere, KIP-848 broker-side rebalancing, share groups (KIP-932) bringing per-message acknowledgement — note that this finally addresses the 'Kafka is not a queue' limitation from chapter 01 — and diskless/object-store-first designs aimed at cross-AZ cost.&quot;,
    &quot;Close with the point that actually determines success at scale: &lt;b&gt;governance&lt;/b&gt;. Naming, ownership, schema compatibility, retention defaults, ACLs. Decide these at 20 topics, not 2,000. The technology scales more gracefully than the conventions.&quot;]},

  s9c:{title:&quot;Day two&quot;,sub:&quot;5 min · the takeaway artifact&quot;,points:[
    &quot;Four dashboard panels: cluster health, broker load, producers, consumers. Tell them the client panels are the ones most teams are missing.&quot;,
    &quot;Repeat the four alerts one final time — this is the third repetition, which is why it will stick: &lt;code&gt;UnderMinIsrPartitionCount &amp;gt; 0&lt;/code&gt;, &lt;code&gt;OfflinePartitionsCount &amp;gt; 0&lt;/code&gt;, &lt;code&gt;ActiveControllerCount != 1&lt;/code&gt;, consumer lag rising per group.&quot;,
    &quot;Then the habits, in order of how much pain they prevent: &lt;b&gt;disable topic auto-creation in production&lt;/b&gt; (a producer typo should not create a 1-partition RF-1 topic that becomes load-bearing), set safe cluster defaults, roll one broker at a time waiting for UnderReplicated to hit zero, and &lt;b&gt;throttle every reassignment&lt;/b&gt;.&quot;,
    &quot;Own client versions: old clients force broker-side format conversion (CPU) and very old ones lack idempotence by default. This is a real, invisible tax.&quot;,
    &quot;Quotas on multi-tenant clusters — &lt;code&gt;producer_byte_rate&lt;/code&gt;, &lt;code&gt;consumer_byte_rate&lt;/code&gt;, request percentage — so one team's backfill is not everyone's incident.&quot;,
    &quot;Concrete homework: &lt;b&gt;practise a broker kill and a consumer group offset reset in staging with the runbook open&lt;/b&gt;, before you need either. Ask people to commit to a date.&quot;]},

  s9d:{title:&quot;Recap and close&quot;,sub:&quot;3 min + Q&amp;A&quot;,points:[
    &quot;Read the ten sentences at a deliberate pace. Each one is a compression of a chapter, so this doubles as an index for their notes.&quot;,
    &quot;The three worth emphasising with your voice: #2 (the partition is the unit of everything), #5 (durability is replication, not fsync — acks=all &lt;b&gt;plus&lt;/b&gt; min.insync=2), and #9 (at-least-once with idempotent handlers is the right default).&quot;,
    &quot;Land the closing line, then pause: &lt;b&gt;producers append, brokers replicate, consumers replay.&lt;/b&gt; That is Kafka.&quot;,
    &quot;Give one specific next action rather than a vague invitation: go and check &lt;code&gt;min.insync.replicas&lt;/code&gt; and the replication factor of &lt;code&gt;__consumer_offsets&lt;/code&gt; on your production cluster this week. Both are commonly wrong, and both are quick to verify.&quot;,
    &quot;Reading list is on the slide. Kreps's 'The Log' essay is the best single thing for the conceptual model; DDIA chapter 11 for the theory; the Definitive Guide for operations.&quot;,
    &quot;Open the floor. If questions dry up, seed one: 'what would you do differently in a design you already shipped?'&quot;]}
};

    fd.className = wkshop?'inactive':'active';

    bd.classList.toggle('on',!wkshop);

    const f = wkshop?fw:fd;
    try{ f.contentWindow.focus(); f.contentWindow.dispatchEvent(new Event('resize')); }catch(e){}
