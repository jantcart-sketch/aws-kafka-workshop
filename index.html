    &quot;Three flavours, one sentence each. Serverless for dev/test/spiky and for today's labs; provisioned (with Express brokers) for serious production; self-managed only if they need something AWS doesn't expose.&quot;,
    &quot;If asked about Serverless quotas, say 'check the current documented limits before committing production' rather than quoting a number — they change.&quot;,
    &quot;The ecosystem panel is the time-saver for their pilot: &lt;b&gt;MSK Connect&lt;/b&gt; for CDC-based producers, &lt;b&gt;Lambda ESM&lt;/b&gt; for a first consumer with no consumer loop, &lt;b&gt;Managed Flink&lt;/b&gt; when they need windows or joins. Call these back in Chapter 07.&quot;,
    &quot;Security: IAM auth is the native path. Don't deep-dive; just establish that TLS, KMS and private subnets are defaults or one setting away.&quot;,
    &quot;Close by setting up the labs: MSK Serverless + IAM, and every command works unchanged elsewhere — only the client config differs. &lt;b&gt;Then break for 10 minutes.&lt;/b&gt;&quot;]},

  ch4:{title:&quot;Chapter 04 — Lab 1&quot;,sub:&quot;30 min hands-on&quot;,points:[
    &quot;Your job during labs is to float, not to present. Set the goal, start the clock, and circulate.&quot;,
    &quot;Announce the two checkpoints that matter before they start: &lt;b&gt;restart with the same group (nothing arrives)&lt;/b&gt; and &lt;b&gt;restart with a new group (everything arrives)&lt;/b&gt;. If a pair only does those two, the lab succeeded.&quot;]},

  s4a:{title:&quot;Lab 1 setup&quot;,sub:&quot;5 min&quot;,points:[
    &quot;Timebox ruthlessly: &lt;b&gt;five minutes, then pair up&lt;/b&gt;. Nobody debugs a client config for twenty minutes in a three-hour workshop.&quot;,
    &quot;Have the bootstrap string and &lt;code&gt;client.properties&lt;/code&gt; pre-shared in chat or on a slide — typing SASL config from a projector is where workshops die.&quot;,
    &quot;The common failure is network, not auth: wrong VPC/subnet, security group not allowing 9098, or the TLS port instead of the IAM port. Check that first, every time.&quot;,
    &quot;If a pair is fully blocked, put them on a neighbour's screen as navigator — participation beats a working terminal.&quot;]},

  s4b:{title:&quot;Lab 1 steps&quot;,sub:&quot;20 min · circulate&quot;,points:[
    &quot;Set the goal before they type: 'produce keyed records, consume them, then look at your own offsets'.&quot;,
    &quot;Nudge everyone to &lt;b&gt;reuse keys&lt;/b&gt; (two &lt;code&gt;cust-1&lt;/code&gt; records) — otherwise the key→partition lesson doesn't land.&quot;,
    &quot;Step 5 is the payoff, not step 4. Make sure every pair runs &lt;code&gt;kafka-consumer-groups --describe&lt;/code&gt; and reads CURRENT-OFFSET / LOG-END-OFFSET / LAG out loud.&quot;,
    &quot;Then push the two closing checkpoints: &lt;b&gt;same group → nothing; new group → everything&lt;/b&gt;. Walk around and ask pairs to show you that result.&quot;,
    &quot;Common stumbles: forgetting &lt;code&gt;--from-beginning&lt;/code&gt; on the first run and concluding nothing was produced; forgetting &lt;code&gt;parse.key=true&lt;/code&gt; so every record has a null key and spreads randomly.&quot;,
    &quot;Call a 5-minute warning so everyone reaches step 5.&quot;]},

  s4c:{title:&quot;Lab 1 debrief&quot;,sub:&quot;5 min&quot;,points:[
    &quot;Do this as a conversation, not a lecture — ask what surprised them before showing the cards.&quot;,
    &quot;The two cards to dwell on: &lt;b&gt;you held a cursor&lt;/b&gt; and &lt;b&gt;a new group saw history&lt;/b&gt;. Those are the two things their current broker cannot do.&quot;,
    &quot;Collect the questions the lab raised — 'how do I retry one bad record?' and 'what if the format changes?' — and promise them in Lab 2 and Ch 06. Write them on the board.&quot;,
    &quot;&lt;b&gt;Then take the 10-minute break here&lt;/b&gt; if you haven't already, and tell them to leave terminals open.&quot;]},

  ch5:{title:&quot;Chapter 05 — Lab 2&quot;,sub:&quot;35 min hands-on&quot;,points:[
    &quot;Lab 2 is the differentiator lab: replay, independent groups, scaling ceiling, compaction, schema evolution.&quot;,
    &quot;&lt;b&gt;You will not finish all five steps with every pair.&lt;/b&gt; Prioritise steps 1–3 for everyone; run step 5 as a guided demo if time is short. Say this up front so nobody feels behind.&quot;]},

  s5a:{title:&quot;Lab 2 · groups &amp; replay&quot;,sub:&quot;8 min&quot;,points:[
    &quot;Click the replay button on the diagram first so they know what they're aiming for.&quot;,
    &quot;Emphasise the operational reality: the group must be &lt;b&gt;stopped&lt;/b&gt; to reset its offsets. People hit this immediately.&quot;,
    &quot;Show them &lt;code&gt;--dry-run&lt;/code&gt; before &lt;code&gt;--execute&lt;/code&gt; — it's the habit you want them to take to production.&quot;,
    &quot;&lt;code&gt;--to-datetime&lt;/code&gt; is the one that wins arguments with the business: 'reprocess from 09:00 yesterday' is a command, not a project.&quot;,
    &quot;The checkpoint to verify at each table: &lt;b&gt;analytics re-reads everything while lab-consumer stays at lag 0&lt;/b&gt;.&quot;]},

  s5b:{title:&quot;Lab 2 · scale &amp; rebalance&quot;,sub:&quot;9 min · swap drivers here&quot;,points:[
    &quot;Tell them the fourth consumer is &lt;em&gt;supposed&lt;/em&gt; to get nothing. The point is to see the ceiling in a lab rather than in an incident.&quot;,
    &quot;Have them run &lt;code&gt;--describe&lt;/code&gt; while all four are up and read the CONSUMER-ID column — seeing ownership per partition makes the model concrete.&quot;,
    &quot;Then &lt;code&gt;--alter --partitions 6&lt;/code&gt; and watch the idle consumer pick up work. Note partitions only go up, never down.&quot;,
    &quot;&lt;b&gt;The real lesson is the last checkpoint:&lt;/b&gt; produce more &lt;code&gt;cust-1&lt;/code&gt; records after repartitioning and watch them possibly land elsewhere. hash(key) mod 6 ≠ hash(key) mod 3. Per-key ordering breaks across the change.&quot;,
    &quot;Takeaway to state plainly: &lt;b&gt;size partitions for peak with headroom; it is not an elastic knob.&lt;/b&gt;&quot;]},

  s5c:{title:&quot;Lab 2 · compaction&quot;,sub:&quot;8 min&quot;,points:[
    &quot;The demo-friendly configs matter: &lt;code&gt;segment.ms=10000&lt;/code&gt; and a low &lt;code&gt;min.cleanable.dirty.ratio&lt;/code&gt;, or compaction won't visibly happen inside the lab.&quot;,
    &quot;Set expectations: compaction is &lt;b&gt;asynchronous&lt;/b&gt;. Right after writing they'll see both values — that's correct, not a bug.&quot;,
    &quot;The tombstone (empty value) is the delete mechanism. Make sure at least a few pairs try it.&quot;,
    &quot;The reframe to land: &lt;b&gt;reading from offset 0 reconstructs current state for every key&lt;/b&gt; — no database query. Then name where they'd use it: reference data, feature flags, master data, rebuildable local caches.&quot;,
    &quot;If you're behind schedule, this is the step to demo from the front rather than have everyone do.&quot;]},

  s5d:{title:&quot;Lab 2 · schema evolution&quot;,sub:&quot;8 min · demo if short on time&quot;,points:[
    &quot;Be honest about the Avro/registry setup cost. If you're past the 2h20 mark, &lt;b&gt;run this as a guided demo&lt;/b&gt; — the concept carries the value, not the keystrokes.&quot;,
    &quot;The sequence that teaches: v1 producer → running v1 consumer → add an optional field with a default → v1 consumer keeps working.&quot;,
    &quot;Then the &lt;b&gt;deliberate failure&lt;/b&gt;: remove or rename a required field and watch the registry reject it. That rejection is the product.&quot;,
    &quot;Finish with the replay dimension: a v2 consumer reading from offset 0 gets &lt;code&gt;channel=\&quot;unknown\&quot;&lt;/code&gt; on old records from the default. &lt;b&gt;That combination — rejected breakage plus safe replay — is what makes a log safe as a platform.&lt;/b&gt;&quot;]},

  s5e:{title:&quot;Lab 2 debrief&quot;,sub:&quot;4 min&quot;,points:[
    &quot;Four capability cards, then immediately the honest list of what got harder. Both halves, every time.&quot;,
    &quot;Tie each capability back to a named pain from 01.3 — by now you should be able to do this with their own words.&quot;,
    &quot;Close with the bridge sentence: &lt;b&gt;that trade is the whole decision, and it's made one use case at a time, not once for the estate.&lt;/b&gt; Go straight into Ch 06.&quot;]},

  ch6:{title:&quot;Chapter 06 — Use case discovery&quot;,sub:&quot;25 min&quot;,points:[
    &quot;This chapter is why they came, even if they think they came for Kafka. Protect its time — if you're running long, cut Chapter 07 content instead.&quot;,
    &quot;Have the board of candidates from 01.3 and 02.4 visible. That's the input.&quot;]},

  s6a:{title:&quot;The decision framework&quot;,sub:&quot;6 min&quot;,points:[
    &quot;Stress the unit of analysis: &lt;b&gt;one use case at a time&lt;/b&gt;. 'Should we use Kafka?' is an unanswerable question; 'should this flow be a topic?' is answerable in five minutes.&quot;,
    &quot;Walk the six positive questions quickly. Note that &lt;b&gt;1, 2 and 3 carry +2&lt;/b&gt; — multiple consumers, replay value, and facts-not-commands are the real signals.&quot;,
    &quot;Then the negative list, with equal weight in your voice. A and B at −2 each mean one queue-shaped requirement can sink an otherwise attractive case — correctly.&quot;,
    &quot;The scoring guidance matters less than the last line: &lt;b&gt;if both sides score high, it's two use cases wearing one name.&lt;/b&gt; Split it — stream the facts, queue the work. This resolves most arguments in the room.&quot;,
    &quot;Say the score isn't science. It's a device for making the conversation concrete and reproducible on Monday.&quot;]},

  s6b:{title:&quot;The exercise&quot;,sub:&quot;15 min · they work, you float&quot;,points:[
    &quot;Format: 12 minutes writing, 3 minutes picking. One person at each table holds the pen and the clock.&quot;,
    &quot;Insist on &lt;b&gt;writing it down&lt;/b&gt;. A scored row they can defend beats an enthusiastic conversation they can't reconstruct.&quot;,
    &quot;The field that does the most work is &lt;b&gt;Consumers (today → tomorrow)&lt;/b&gt;. Push every table to name actual systems and teams, not 'analytics might want it'.&quot;,
    &quot;The second most valuable field is &lt;b&gt;Blockers&lt;/b&gt; — it's what turns a candidate into a plan. Common honest answers: no schema owner, network approval, nobody owns the producer.&quot;,
    &quot;Circulate and challenge gently: 'who is the second consumer?', 'how far back would you replay, and why?', 'is this a fact or a command?'&quot;,
    &quot;Give a 3-minute warning, then run two minutes per table of sharing.&quot;]},

  s6c:{title:&quot;Picking &amp; anti-patterns&quot;,sub:&quot;4 min&quot;,points:[
    &quot;The counter-intuitive point first: &lt;b&gt;pick for learning, not for prestige&lt;/b&gt;. The best first use case is rarely the most valuable one.&quot;,
    &quot;'Not on the critical path for money on day one' plus 'run alongside the existing flow' is the risk posture that gets a pilot approved.&quot;,
    &quot;Read all four anti-patterns — each one is a real failure you can describe. 'Replace all the MQ' and 'a topic with no owner' are the two that kill programmes rather than projects.&quot;,
    &quot;Close on hybrid as the normal end state: &lt;b&gt;nobody should leave planning to delete their queues.&lt;/b&gt; Streams for facts, queues for work, connectors where they meet.&quot;],
   ask:&quot;If you started one pilot in the next month, which use case — and who would own the schema?&quot;},

  ch7:{title:&quot;Chapter 07 — Wrap-up&quot;,sub:&quot;10 min&quot;,points:[
    &quot;Land the plane. Recap, path, asks. Do not introduce any new concept here.&quot;]},

  s7a:{title:&quot;Recap&quot;,sub:&quot;3 min&quot;,points:[
    &quot;Six cards, one sentence each, no elaboration. If you find yourself explaining, you're over time.&quot;,
    &quot;Card 06 is deliberately last: &lt;b&gt;queues are still right sometimes&lt;/b&gt;. Ending on the honest note is what makes the rest trustworthy.&quot;,
    &quot;The three metrics at the bottom are the memorable compression: &lt;b&gt;facts → stream, commands → queue, both → a mature estate.&lt;/b&gt;&quot;]},

  s7b:{title:&quot;The pilot path&quot;,sub:&quot;4 min&quot;,points:[
    &quot;Walk the six steps at pace. The two that people skip and regret: &lt;b&gt;dual-publish alongside the existing flow&lt;/b&gt;, and &lt;b&gt;deliberately prove replay, failover and schema evolution&lt;/b&gt; before cutover.&quot;,
    &quot;'Add two consumers — one that exists today, one that couldn't before.' The second consumer is the business case, not a nice-to-have.&quot;,
    &quot;The 'decide before week 3' list is the governance minimum. Topic ownership and the failure-handling standard are the two that get skipped and cause the most pain at use case number four.&quot;,
    &quot;The 'go faster' panel is practical: MSK Connect for a CDC producer, Lambda ESM for a first consumer, Managed Flink if the pilot needs windows or joins. Don't let them hand-roll stateful processing in a pilot.&quot;]},

  s7c:{title:&quot;Resources &amp; close&quot;,sub:&quot;3 min + Q&amp;A&quot;,points:[
    &quot;Point at the &lt;b&gt;Amazon MSK workshop&lt;/b&gt; on catalog.workshops.aws as the self-paced continuation — it goes well beyond today's labs.&quot;,
    &quot;Then the three asks, and get them answered out loud before anyone leaves: &lt;b&gt;named candidate, named owner, named support request.&lt;/b&gt; A workshop with no owner named has a 0% follow-through rate.&quot;,
    &quot;Offer the concrete follow-ons. The deep-dive deck (&lt;b&gt;\&quot;Apache Kafka — How It Works\&quot;&lt;/b&gt;, 9 chapters on internals) already exists — offer it as the engineers' session once a pilot team is named. Then sizing &amp; cost, Flink, MQ/SQS migration, platform &amp; governance. Let them pick one.&quot;,
    &quot;Ask for the honest feedback — which part earned its time, which part to cut.&quot;,
    &quot;Close on the line: &lt;b&gt;stop deleting the message, start keeping the fact.&lt;/b&gt;&quot;],
   ask:&quot;One sentence each before we close: what will you do differently next week?&quot;}

};

  /* ---------- chapter rail (replaces per-slide dots) ---------- */
  .rail{display:flex;gap:7px;align-items:center;pointer-events:auto}
  .rail button{width:clamp(14px,2.1vw,30px);height:4px;border-radius:3px;border:0;padding:0;cursor:pointer;
    background:var(--line);transition:.3s}
  .rail button.done{background:var(--cyan-dim);opacity:.7}
  .rail button.on{background:var(--cyan);box-shadow:0 0 12px var(--cyan);height:6px}
  .meta-right{display:flex;align-items:center;gap:14px;pointer-events:auto}
  .counter{font-size:11px;color:var(--muted);letter-spacing:.14em;white-space:nowrap}
  .counter b{color:var(--ink);font-weight:500}
  .clock{font-size:11px;letter-spacing:.14em;color:var(--muted);border:1px solid var(--line);
    border-radius:7px;padding:6px 10px;cursor:pointer;background:rgba(255,255,255,.02);white-space:nowrap}
  .clock.run{color:var(--cyan);border-color:rgba(55,230,201,.35)}
  .clock.over{color:var(--red);border-color:rgba(255,93,108,.4)}

  /* current chapter marker — lives in the bottom chrome, beside the brand */
  .ch-flag{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .ch-flag b{color:var(--cyan);font-weight:500}
  .ch-flag:not(:empty)::before{content:&quot;·&quot;;margin:0 9px;color:var(--line)}

  /* ---------- chapter divider slides ---------- */
  .slide.chapter{justify-content:center}
  .ch-ghost{position:absolute;right:clamp(20px,5vw,80px);bottom:4vh;font-family:var(--disp);font-weight:800;
    font-size:clamp(120px,26vw,340px);line-height:.8;pointer-events:none;
    background:linear-gradient(180deg,rgba(232,237,245,.10),rgba(232,237,245,.01));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .ch-title{font-family:var(--disp);font-weight:800;font-size:clamp(38px,7.4vw,104px);line-height:.93;letter-spacing:-.025em;position:relative}
  .ch-q{color:var(--amber);font-size:clamp(13px,1.5vw,19px);margin-top:20px;max-width:60ch;line-height:1.55}
  /* flex (not grid) so the final row stretches to fill instead of leaving an orphan gap */
  .ch-list{margin-top:30px;display:flex;flex-wrap:wrap;gap:11px;max-width:1180px;position:relative}
  .ch-item{flex:1 1 210px;border:1px solid var(--line);border-left:2px solid var(--cyan-dim);border-radius:9px;
    background:rgba(255,255,255,.02);padding:13px 15px;font-size:12px;color:var(--muted);line-height:1.5}
  .ch-item b{display:block;color:var(--ink);font-weight:600;font-size:12.5px;margin-bottom:4px;letter-spacing:.02em}
  .ch-budget{display:inline-flex;align-items:center;gap:9px;margin-top:26px;font-size:11px;
    letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    border:1px solid var(--line);border-radius:100px;padding:7px 15px}
  .ch-budget b{color:var(--amber);font-weight:500}

  /* ---------- dense content slides ---------- */
  .slide.dense{justify-content:flex-start;padding-top:min(6.2vh,52px);padding-bottom:min(9vh,80px)}
  .slide.dense h2{font-size:clamp(24px,3.5vw,44px);margin-bottom:6px}
  .slide.dense .lede{font-size:clamp(12.5px,1.15vw,15.5px);max-width:82ch;margin-top:10px}
  .slide.dense .split{align-items:start}
  .body-wrap{width:100%;margin-top:clamp(14px,2.2vh,26px)}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,2.2vw,30px);width:100%;align-items:start}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,1.8vw,24px);width:100%;align-items:stretch}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(12px,1.4vw,18px);width:100%;align-items:stretch}
  .grid-25{display:grid;grid-template-columns:1fr 1.6fr;gap:clamp(18px,2.6vw,38px);width:100%;align-items:start}
  .grid-52{display:grid;grid-template-columns:1.6fr 1fr;gap:clamp(18px,2.6vw,38px);width:100%;align-items:start}

  .card{border:1px solid var(--line);border-radius:14px;padding:clamp(13px,1.5vw,20px);
    background:linear-gradient(180deg,rgba(255,255,255,.022),rgba(255,255,255,.005));
    box-shadow:0 20px 50px -40px rgba(0,0,0,.9)}
  .card h4{font-family:var(--disp);font-weight:800;font-size:clamp(14px,1.35vw,18px);color:var(--ink);
    letter-spacing:-.01em;margin-bottom:8px;display:flex;align-items:baseline;gap:8px}
  .card h4 .n{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--muted);font-weight:500}
  .card p{font-size:clamp(11.5px,1.02vw,13.5px);color:var(--muted);line-height:1.62}
  .card p + p{margin-top:8px}
  .card ul{list-style:none;margin-top:9px;display:flex;flex-direction:column;gap:7px}
  .card li{font-size:clamp(11px,.98vw,13px);color:var(--muted);line-height:1.5;padding-left:14px;position:relative}
  .card li::before{content:&quot;·&quot;;position:absolute;left:2px;color:var(--cyan);font-weight:700}
  .card.cy{border-left:2px solid var(--cyan)} .card.am{border-left:2px solid var(--amber)}
  .card.vi{border-left:2px solid var(--violet)} .card.rd{border-left:2px solid var(--red)}
  .card .kicker{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}

  /* tables */
  table.tbl{width:100%;border-collapse:collapse;font-size:clamp(10.5px,1vw,13px)}
  .tbl th{text-align:left;color:var(--cyan);font-weight:500;font-size:9.5px;letter-spacing:.2em;
    text-transform:uppercase;padding:0 12px 9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl td{padding:9px 12px;border-bottom:1px solid rgba(30,42,61,.55);color:var(--muted);vertical-align:top;line-height:1.5}
  .tbl td b{color:var(--ink);font-weight:600}
  .tbl td code{color:var(--amber)}
  .tbl tr:last-child td{border-bottom:0}
  .tbl.compact td{padding:6.5px 12px}
  .tbl-wrap{border:1px solid var(--line);border-radius:14px;padding:clamp(14px,1.6vw,20px);
    background:linear-gradient(180deg,rgba(255,255,255,.022),rgba(255,255,255,.004))}

  /* code */
  pre.code{border:1px solid var(--line);border-radius:13px;background:rgba(3,6,11,.66);
    padding:clamp(13px,1.5vw,19px);font-size:clamp(10.5px,.98vw,12.5px);line-height:1.72;color:#93a4bd;
    overflow:auto;font-family:var(--mono)}
  pre.code .c{color:#4a5b78}
  pre.code .k{color:var(--cyan)}
  pre.code .v{color:var(--amber)}
  pre.code .s{color:#a9efdd}
  pre.code .f{color:var(--violet)}
  pre.code b{color:var(--ink);font-weight:600}
  .code-cap{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}

  /* callouts */
  .callout{border:1px solid var(--line);border-radius:12px;padding:12px 15px;
    font-size:clamp(11px,1vw,13px);color:var(--muted);line-height:1.6;display:flex;gap:11px;align-items:flex-start}
  .callout .ic{flex:0 0 auto;font-size:13px;line-height:1.35}
  .callout b{color:var(--ink)}
  .callout + .callout{margin-top:10px}
  .callout.warn{border-color:rgba(255,93,108,.38);background:rgba(255,93,108,.055)}
  .callout.warn .ic{color:var(--red)}
  .callout.good{border-color:rgba(55,230,201,.32);background:rgba(55,230,201,.05)}
  .callout.good .ic{color:var(--cyan)}
  .callout.note{border-color:rgba(139,123,255,.32);background:rgba(139,123,255,.05)}
  .callout.note .ic{color:var(--violet)}
  .callout.amb{border-color:rgba(255,179,71,.32);background:rgba(255,179,71,.05)}
  .callout.amb .ic{color:var(--amber)}

  /* metrics */
  .metrics{display:flex;gap:clamp(16px,2.6vw,44px);flex-wrap:wrap;align-items:flex-end}
  .metric .big{font-family:var(--disp);font-weight:800;font-size:clamp(26px,3.6vw,50px);line-height:1;
    color:var(--cyan);letter-spacing:-.02em}
  .metric .big.am{color:var(--amber)} .metric .big.vi{color:var(--violet)} .metric .big.rd{color:var(--red)}
  .metric .cap{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:8px;max-width:22ch;line-height:1.5}

  /* step flow — flex-basis:auto so columnar step lists are content-height,
     min-width keeps the row variant wrapping at a sane width */
  .steps{display:flex;gap:9px;align-items:stretch;flex-wrap:wrap}
  .step{flex:1 1 auto;min-width:140px;border:1px solid var(--line);border-radius:11px;padding:11px 13px;
    background:rgba(255,255,255,.02);font-size:clamp(10.5px,.95vw,12.5px);color:var(--muted);line-height:1.55}
  .step .n{font-family:var(--disp);font-weight:800;font-size:12px;color:var(--amber);display:block;margin-bottom:6px;letter-spacing:.06em}
  .step b{color:var(--ink)}

  /* chips */
  .tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .chip{border:1px solid var(--line);border-radius:7px;padding:6px 11px;font-size:11px;color:var(--muted);
    background:rgba(255,255,255,.02);letter-spacing:.04em}
  .chip b{color:var(--amber);font-weight:500}
  .chip.cy b{color:var(--cyan)} .chip.vi b{color:var(--violet)} .chip.rd b{color:var(--red)}

  /* byte-layout map */
  .bytemap{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .bfield{border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:rgba(255,255,255,.02);
    font-size:10.5px;color:var(--muted);line-height:1.45;min-width:78px}
  .bfield b{display:block;color:var(--ink);font-size:11px;font-weight:600}
  .bfield.cy{border-color:rgba(55,230,201,.4);background:rgba(55,230,201,.06)}
  .bfield.am{border-color:rgba(255,179,71,.4);background:rgba(255,179,71,.06)}
  .bfield.vi{border-color:rgba(139,123,255,.4);background:rgba(139,123,255,.06)}
  .bfield.rd{border-color:rgba(255,93,108,.4);background:rgba(255,93,108,.06)}

  /* small section headings inside dense slides */
  .sub{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--cyan);margin-bottom:11px;
    display:flex;align-items:center;gap:10px}
  .sub::after{content:&quot;&quot;;flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
  .sub.am{color:var(--amber)} .sub.vi{color:var(--violet)} .sub.rd{color:var(--red)}

  .stage.short{min-height:clamp(200px,30vh,300px)}
  .stage.mid{min-height:clamp(240px,36vh,380px)}
  .stage.tall{min-height:clamp(300px,52vh,540px)}
  .stage.pad{padding:clamp(16px,2vw,26px)}

  /* auto-fit wrapper: JS scales this down when a slide would overflow,
     so dense slides stay whole on short viewports instead of clipping */
  .fit{width:100%;transform-origin:top left;will-change:transform}

  /* interactive stage buttons — top-right, so they never sit on a diagram's bottom caption */
  .stage-btn{position:absolute;top:11px;right:12px;z-index:6;font-family:var(--mono);font-size:11px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--cyan);background:rgba(55,230,201,.08);
    border:1px solid rgba(55,230,201,.4);border-radius:8px;padding:8px 13px;cursor:pointer;transition:.25s}
  .stage-btn:hover{background:rgba(55,230,201,.16)}
  .stage-btn.rd{color:var(--red);background:rgba(255,93,108,.08);border-color:rgba(255,93,108,.4)}
  .stage-btn.rd:hover{background:rgba(255,93,108,.16)}
  .stage-btn.left{right:auto;left:14px}

  /* ---------- presenter notes ---------- */
  .notes{position:fixed;z-index:40;top:0;right:0;bottom:0;width:min(440px,40vw);
    background:rgba(5,8,13,.965);border-left:1px solid var(--line);backdrop-filter:blur(10px);
    padding:26px 24px 90px;overflow:auto;transform:translateX(103%);
    transition:transform .38s cubic-bezier(.2,.7,.2,1)}
  .notes.on{transform:none}
  .notes .nhead{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--cyan);
    display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:12px}
  .notes .nhead span{color:var(--muted)}
  .notes h5{font-family:var(--disp);font-weight:800;font-size:19px;color:var(--ink);margin:18px 0 4px;letter-spacing:-.01em}
  .notes .nsub{font-size:11px;color:var(--muted);letter-spacing:.1em;margin-bottom:16px}
  .notes ul{list-style:none;display:flex;flex-direction:column;gap:13px}
  .notes li{font-size:12.5px;line-height:1.68;color:#a6b6cc;padding-left:17px;position:relative}
  .notes li::before{content:&quot;▸&quot;;position:absolute;left:0;top:0;color:var(--amber)}
  .notes li b{color:var(--ink);font-weight:600}
  .notes li code{color:var(--cyan)}
  .notes .ask{margin-top:20px;border:1px solid rgba(139,123,255,.3);background:rgba(139,123,255,.06);
    border-radius:10px;padding:12px 14px;font-size:12px;color:#a6b6cc;line-height:1.6}
  .notes .ask b{color:var(--violet);display:block;font-size:10px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:6px}
  .notes-toggle{position:fixed;z-index:41;top:20px;right:clamp(24px,5vw,60px);font-family:var(--mono);
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:7px;padding:6px 11px;cursor:pointer}
  .notes-toggle:hover{color:var(--cyan);border-color:var(--cyan)}
  body.notes-on .hint{display:none}

  /* ---------- agenda overlay ---------- */
  .agenda{position:fixed;inset:0;z-index:45;background:rgba(4,7,12,.94);backdrop-filter:blur(12px);
    display:none;flex-direction:column;justify-content:center;padding:6vh clamp(28px,7vw,120px)}
  .agenda.on{display:flex}
  .agenda h3{font-family:var(--disp);font-weight:800;font-size:clamp(26px,4vw,48px);margin-bottom:24px}
  .agenda-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
  .agenda-card{border:1px solid var(--line);border-radius:12px;padding:16px 18px;cursor:pointer;
    background:rgba(255,255,255,.02);transition:.25s}
  .agenda-card:hover{border-color:var(--cyan);background:rgba(55,230,201,.07);transform:translateY(-2px)}
  .agenda-card .an{font-family:var(--disp);font-weight:800;font-size:22px;color:var(--cyan)}
  .agenda-card .at{font-size:13px;color:var(--ink);margin-top:6px;font-weight:600}
  .agenda-card .ad{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}

  @media (max-width:1100px){
    .grid-3,.grid-4{grid-template-columns:1fr 1fr}
  }
  @media (max-width:880px){
    .split{grid-template-columns:1fr;gap:24px}
    .stage{min-height:300px}
    .title-meta{display:none}
    .grid-2,.grid-3,.grid-4,.grid-25,.grid-52{grid-template-columns:1fr}
    .notes{width:100vw}
  }
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div class=&quot;bg-atmos&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;bg-grid&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;bg-noise&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;progress&quot; id=&quot;progress&quot;&gt;&lt;/div&gt;

&lt;div class=&quot;deck&quot; id=&quot;deck&quot;&gt;

  &lt;!-- ============ 00 · TITLE ============ --&gt;
  &lt;section class=&quot;slide&quot; id=&quot;s0&quot; data-ch=&quot;0&quot;&gt;
    &lt;div class=&quot;title-wrap&quot;&gt;
      &lt;div class=&quot;title-meta r r1&quot;&gt;
        &lt;div&gt;&lt;span class=&quot;live&quot;&gt;●&lt;/span&gt; STREAM ONLINE&lt;/div&gt;
        &lt;div&gt;append-only · immutable · distributed&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;eyebrow r r1&quot;&gt;Distributed Event Streaming &lt;span class=&quot;num&quot;&gt;/ 00&lt;/span&gt;&lt;/div&gt;
      &lt;h1 class=&quot;r r2&quot;&gt;APACHE&lt;br&gt;&lt;span class=&quot;glow-kafka&quot;&gt;KAFKA&lt;/span&gt;
        &lt;span class=&quot;mono-sub r r3&quot;&gt;// how the log that never forgets actually works&lt;/span&gt;
      &lt;/h1&gt;
      &lt;div class=&quot;pill-row r r4&quot;&gt;
        &lt;div class=&quot;pill&quot;&gt;&lt;b&gt;01&lt;/b&gt; The Big Idea&lt;/div&gt;
        &lt;div class=&quot;pill&quot;&gt;&lt;b&gt;02&lt;/b&gt; Architecture&lt;/div&gt;
        &lt;div class=&quot;pill&quot;&gt;&lt;b&gt;03&lt;/b&gt; Topics &amp;amp; Partitions&lt;/div&gt;
        &lt;div class=&quot;pill&quot;&gt;&lt;b&gt;04&lt;/b&gt; The Commit Log&lt;/div&gt;
        &lt;div class=&quot;pill&quot;&gt;&lt;b&gt;05&lt;/b&gt; Producers&lt;/div&gt;
        &lt;div class=&quot;pill&quot;&gt;&lt;b&gt;06&lt;/b&gt; Consumers &amp;amp; Groups&lt;/div&gt;
        &lt;div class=&quot;pill&quot;&gt;&lt;b&gt;07&lt;/b&gt; Replication &amp;amp; ISR&lt;/div&gt;
        &lt;div class=&quot;pill&quot;&gt;&lt;b&gt;08&lt;/b&gt; Guarantees&lt;/div&gt;
        &lt;div class=&quot;pill&quot;&gt;&lt;b&gt;09&lt;/b&gt; The Whole Picture&lt;/div&gt;
      &lt;/div&gt;
      &lt;p class=&quot;lede r r5&quot; style=&quot;margin-top:30px&quot;&gt;Nine chapters · ~20 minutes each. Press &lt;b&gt;N&lt;/b&gt; for speaker notes, &lt;b&gt;A&lt;/b&gt; for the agenda, &lt;b&gt;1–9&lt;/b&gt; to jump to a chapter.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- ============ CHAPTER 01 ============ --&gt;
  &lt;section class=&quot;slide chapter&quot; id=&quot;ch1&quot; data-ch=&quot;1&quot;&gt;
    &lt;div class=&quot;ch-ghost&quot;&gt;01&lt;/div&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Chapter 01 &lt;span class=&quot;num&quot;&gt;/ ~20 min&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;ch-title r r2&quot;&gt;The big idea:&lt;br&gt;why a &lt;span class=&quot;k-cyan&quot;&gt;log&lt;/span&gt;?&lt;/h2&gt;
    &lt;p class=&quot;ch-q r r3&quot;&gt;The question this chapter answers: &lt;b&gt;why did the industry converge on an append-only log as the backbone of data infrastructure&lt;/b&gt;, instead of a queue, a database, or an API mesh?&lt;/p&gt;
    &lt;div class=&quot;ch-list&quot;&gt;
      &lt;div class=&quot;ch-item r r4&quot;&gt;&lt;b&gt;1 · The log&lt;/b&gt;Immutable, ordered, replayable — the primitive everything else is built from.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r4&quot;&gt;&lt;b&gt;2 · The N×M problem&lt;/b&gt;Point-to-point integration collapses under its own weight.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r5&quot;&gt;&lt;b&gt;3 · Queue vs log vs DB&lt;/b&gt;What Kafka is, and what it deliberately is not.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r5&quot;&gt;&lt;b&gt;4 · What replay buys you&lt;/b&gt;Backfills, new consumers, time travel, incident recovery.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r6&quot;&gt;&lt;b&gt;5 · When not to use it&lt;/b&gt;The honest limits — request/reply, tiny scale, per-message TTL.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ch-budget r r6&quot;&gt;Time budget &lt;b&gt;≈20 min&lt;/b&gt; · 5 slides · demo: live tail&lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 01a · WHAT IS KAFKA (original) --&gt;
  &lt;section class=&quot;slide&quot; id=&quot;s1a&quot; data-ch=&quot;1&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;The Big Idea &lt;span class=&quot;num&quot;&gt;/ 01.1&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;split&quot;&gt;
      &lt;div&gt;
        &lt;h2 class=&quot;r r2&quot;&gt;An immutable&lt;br&gt;log of events.&lt;/h2&gt;
        &lt;p class=&quot;lede r r3&quot;&gt;Kafka is not a queue that forgets. It's a &lt;b&gt;durable, replayable, append-only log&lt;/b&gt; that decouples the systems producing data from the systems consuming it.&lt;/p&gt;
        &lt;ul class=&quot;feat&quot;&gt;
          &lt;li class=&quot;r r4&quot;&gt;&lt;b&gt;Producers&lt;/b&gt; append events; they never wait on consumers.&lt;/li&gt;
          &lt;li class=&quot;r r5&quot;&gt;&lt;b&gt;Consumers&lt;/b&gt; read at their own pace and remember where they were.&lt;/li&gt;
          &lt;li class=&quot;r r6&quot;&gt;&lt;b&gt;Brokers&lt;/b&gt; store events on disk, replicated for durability.&lt;/li&gt;
        &lt;/ul&gt;
        &lt;div class=&quot;tagrow r r6&quot;&gt;
          &lt;div class=&quot;chip&quot;&gt;&lt;b&gt;append-only&lt;/b&gt; no in-place edits&lt;/div&gt;
          &lt;div class=&quot;chip cy&quot;&gt;&lt;b&gt;ordered&lt;/b&gt; per partition&lt;/div&gt;
          &lt;div class=&quot;chip vi&quot;&gt;&lt;b&gt;replayable&lt;/b&gt; offsets, not deletes&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stage r r4&quot; id=&quot;stage-intro&quot;&gt;
        &lt;span class=&quot;stage-label&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;events.stream — tail -f&lt;/span&gt;
        &lt;div id=&quot;logfeed&quot; style=&quot;position:absolute;inset:44px 18px 18px;font-size:12px;line-height:1.85;color:var(--muted);overflow:hidden&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 01b · THE N×M PROBLEM --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s1b&quot; data-ch=&quot;1&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Why It Exists &lt;span class=&quot;num&quot;&gt;/ 01.2&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;The problem: &lt;span class=&quot;k-red&quot;&gt;N×M&lt;/span&gt; integrations.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;Every new system that needs data adds another bespoke pipeline. With 6 sources and 6 sinks you don't have 12 connections to maintain — you have &lt;b&gt;36&lt;/b&gt;, each with its own format, retry logic, backpressure story and 3am pager.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-52&quot;&gt;
      &lt;div class=&quot;stage mid r r4&quot; id=&quot;stage-nxm&quot;&gt;
        &lt;span class=&quot;stage-label&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;before → after · click to toggle&lt;/span&gt;
        &lt;svg viewBox=&quot;0 0 640 420&quot; id=&quot;nxmsvg&quot;&gt;&lt;/svg&gt;
        &lt;button class=&quot;stage-btn&quot; id=&quot;nxmBtn&quot;&gt;Introduce the log ▸&lt;/button&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub am&quot;&gt;What actually changes&lt;/div&gt;
        &lt;div class=&quot;card am r r5&quot;&gt;
          &lt;h4&gt;From O(N×M) to O(N+M)&lt;/h4&gt;
          &lt;p&gt;Each producer learns &lt;b&gt;one&lt;/b&gt; protocol. Each consumer learns &lt;b&gt;one&lt;/b&gt; protocol. Adding the seventh consumer costs one subscription, not six integrations.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;card cy r r6&quot; style=&quot;margin-top:12px&quot;&gt;
          &lt;h4&gt;The real win is &lt;span class=&quot;k-cyan&quot;&gt;decoupling in time&lt;/span&gt;&lt;/h4&gt;
          &lt;p&gt;The producer doesn't need the consumer to exist yet. A team can start consuming a stream that has been running for six months — and read all of it. That is impossible with a queue that deletes on delivery, or an RPC call that requires both sides to be up.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;callout note r r6&quot; style=&quot;margin-top:12px&quot;&gt;
          &lt;span class=&quot;ic&quot;&gt;◆&lt;/span&gt;
          &lt;div&gt;This is LinkedIn's original 2010 problem statement: dozens of data systems, each pair wired by hand. Kafka was written to be the &lt;b&gt;single central nervous system&lt;/b&gt; — and the design follows from that goal, not from &quot;we needed a faster queue&quot;.&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 01c · QUEUE vs LOG vs DATABASE --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s1c&quot; data-ch=&quot;1&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Mental Model &lt;span class=&quot;num&quot;&gt;/ 01.3&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Queue vs log vs database.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;Most Kafka misuse comes from carrying over instincts from one of the other two. Kafka borrows the &lt;b&gt;pub/sub interface&lt;/b&gt; of a broker and the &lt;b&gt;storage model&lt;/b&gt; of a database — and refuses several features of both.&lt;/p&gt;
    &lt;div class=&quot;body-wrap tbl-wrap r r4&quot;&gt;
      &lt;table class=&quot;tbl&quot;&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Classic queue (SQS, Rabbit)&lt;/th&gt;&lt;th class=&quot;k-cyan&quot;&gt;Kafka (log)&lt;/th&gt;&lt;th&gt;Database&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;&lt;b&gt;Read model&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Broker pushes; message is &lt;b&gt;consumed and removed&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Consumer &lt;b&gt;pulls&lt;/b&gt; at an offset; data stays&lt;/td&gt;&lt;td&gt;Query by key/predicate, any order&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;b&gt;After reading&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Gone — ack deletes it&lt;/td&gt;&lt;td&gt;Still there until retention expires&lt;/td&gt;&lt;td&gt;Still there until deleted&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;b&gt;Second consumer&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Competes for messages, or you fan out to another queue&lt;/td&gt;&lt;td&gt;Independent group, same data, own offsets&lt;/td&gt;&lt;td&gt;Another query&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;b&gt;Ordering&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Best-effort; strict order usually means 1 consumer&lt;/td&gt;&lt;td&gt;Strict &lt;b&gt;per partition&lt;/b&gt;, with N-way parallelism&lt;/td&gt;&lt;td&gt;None inherent&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;b&gt;Per-message ops&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Delete/retry/delay a &lt;b&gt;single&lt;/b&gt; message&lt;/td&gt;&lt;td class=&quot;k-red&quot;&gt;No. The log is immutable, offsets move forward&lt;/td&gt;&lt;td&gt;Update/delete any row&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;b&gt;Scale unit&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Queue depth (aim: empty)&lt;/td&gt;&lt;td&gt;Partition count (depth is normal, not an alarm)&lt;/td&gt;&lt;td&gt;Index + shard&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;b&gt;Random access&lt;/b&gt;&lt;/td&gt;&lt;td&gt;No&lt;/td&gt;&lt;td&gt;By &lt;b&gt;offset&lt;/b&gt; or &lt;b&gt;timestamp&lt;/b&gt; only — never by content&lt;/td&gt;&lt;td&gt;Yes, that's the point&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;div class=&quot;body-wrap grid-3&quot; style=&quot;margin-top:16px&quot;&gt;
      &lt;div class=&quot;callout good r r5&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✓&lt;/span&gt;&lt;div&gt;Kafka is a &lt;b&gt;storage system that speaks pub/sub&lt;/b&gt;. Retention is a config value, not a delivery side-effect.&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;callout warn r r5&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✕&lt;/span&gt;&lt;div&gt;If your design needs &quot;delete &lt;em&gt;this&lt;/em&gt; message&quot; or &quot;retry &lt;em&gt;this one&lt;/em&gt; in 30s&quot;, you are fighting the log. Use a queue, or model retries as a separate topic.&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;callout note r r6&quot;&gt;&lt;span class=&quot;ic&quot;&gt;◆&lt;/span&gt;&lt;div&gt;&quot;A database is a log with an index bolted on.&quot; Turning that inside out — publishing the log and letting each consumer build its own index — is the whole idea.&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 01d · WHAT REPLAY BUYS YOU --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s1d&quot; data-ch=&quot;1&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;The Superpower &lt;span class=&quot;num&quot;&gt;/ 01.4&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Durable + replayable&lt;br&gt;changes how you build.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;Once history is retained, a whole class of hard operational problems turns into &quot;reset an offset&quot;. This is the capability that most teams underuse for the first year.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-2&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub&quot;&gt;Things replay makes cheap&lt;/div&gt;
        &lt;div class=&quot;grid-2&quot; style=&quot;gap:12px&quot;&gt;
          &lt;div class=&quot;card cy r r4&quot;&gt;&lt;h4&gt;Bug in a consumer&lt;/h4&gt;&lt;p&gt;Fix the code, rewind the group to yesterday's offset, reprocess. No source system involvement, no export/import.&lt;/p&gt;&lt;/div&gt;
          &lt;div class=&quot;card cy r r4&quot;&gt;&lt;h4&gt;New consumer, old data&lt;/h4&gt;&lt;p&gt;A brand-new service reads from &lt;code&gt;earliest&lt;/code&gt; and bootstraps its own state from the same stream — no backfill job, no snapshot handoff.&lt;/p&gt;&lt;/div&gt;
          &lt;div class=&quot;card am r r5&quot;&gt;&lt;h4&gt;Rebuild a derived store&lt;/h4&gt;&lt;p&gt;Search index corrupted? Drop it, replay the topic, rebuild. The log is the source of truth; the index is a cache.&lt;/p&gt;&lt;/div&gt;
          &lt;div class=&quot;card am r r5&quot;&gt;&lt;h4&gt;Audit &amp;amp; forensics&lt;/h4&gt;&lt;p&gt;&quot;What did we know at 14:32?&quot; The exact bytes are still on disk with their offsets and timestamps.&lt;/p&gt;&lt;/div&gt;
          &lt;div class=&quot;card vi r r6&quot;&gt;&lt;h4&gt;Blue/green consumers&lt;/h4&gt;&lt;p&gt;Run v2 of a processor in a second group against live traffic, compare outputs, then cut over.&lt;/p&gt;&lt;/div&gt;
          &lt;div class=&quot;card vi r r6&quot;&gt;&lt;h4&gt;Time-travel by timestamp&lt;/h4&gt;&lt;p&gt;&lt;code&gt;offsetsForTimes()&lt;/code&gt; maps a wall-clock time to offsets, so &quot;start from 09:00&quot; is a one-liner.&lt;/p&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub am&quot;&gt;The physics that make it affordable&lt;/div&gt;
        &lt;div class=&quot;metrics r r4&quot; style=&quot;margin-bottom:20px&quot;&gt;
          &lt;div class=&quot;metric&quot;&gt;&lt;div class=&quot;big&quot;&gt;100s MB/s&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;sequential disk throughput per drive — the log never seeks&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;metric&quot;&gt;&lt;div class=&quot;big am&quot;&gt;O(1)&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;write and read cost, independent of how much data is retained&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;metric&quot;&gt;&lt;div class=&quot;big vi&quot;&gt;~7 T&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;messages/day at LinkedIn scale across ~100 clusters&lt;/div&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;card r r5&quot;&gt;
          &lt;div class=&quot;kicker&quot;&gt;Why it isn't slow&lt;/div&gt;
          &lt;ul&gt;
            &lt;li&gt;&lt;b&gt;Append-only writes&lt;/b&gt; are sequential; no b-tree maintenance, no random IO, no write amplification from index updates.&lt;/li&gt;
            &lt;li&gt;&lt;b&gt;The OS page cache is the cache.&lt;/b&gt; Kafka has no separate in-process record cache — recent data is served from RAM the kernel already holds.&lt;/li&gt;
            &lt;li&gt;&lt;b&gt;Zero-copy reads:&lt;/b&gt; &lt;code&gt;sendfile()&lt;/code&gt; pushes bytes from page cache to socket without entering the JVM heap.&lt;/li&gt;
            &lt;li&gt;&lt;b&gt;Batching + compression happen once,&lt;/b&gt; at the producer, and the batch stays compressed through the broker to the consumer.&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/div&gt;
        &lt;div class=&quot;callout amb r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;▲&lt;/span&gt;&lt;div&gt;Retention is &lt;b&gt;per topic&lt;/b&gt;: &lt;code&gt;retention.ms&lt;/code&gt; (default 7 days) and/or &lt;code&gt;retention.bytes&lt;/code&gt;. Retaining a week isn't a hack — it's the intended operating mode. With tiered storage, months.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 01e · WHEN NOT TO USE KAFKA --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s1e&quot; data-ch=&quot;1&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Credibility Check &lt;span class=&quot;num&quot;&gt;/ 01.5&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;When Kafka is the &lt;span class=&quot;k-red&quot;&gt;wrong&lt;/span&gt; answer.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;A talk that only sells is a bad talk. These are the cases where reaching for Kafka costs you months and buys you nothing.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-3&quot;&gt;
      &lt;div class=&quot;card rd r r4&quot;&gt;&lt;h4&gt;&lt;span class=&quot;n&quot;&gt;01&lt;/span&gt;Request/reply&lt;/h4&gt;&lt;p&gt;You need a response to &lt;em&gt;this&lt;/em&gt; call, in-band, in 5&amp;nbsp;ms. Kafka can do request/reply with a correlation id and a reply topic, but you have re-invented RPC with worse tooling. Use gRPC/HTTP.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card rd r r4&quot;&gt;&lt;h4&gt;&lt;span class=&quot;n&quot;&gt;02&lt;/span&gt;Per-message scheduling&lt;/h4&gt;&lt;p&gt;&quot;Deliver this in 4 hours&quot;, &quot;retry only this one&quot;, &quot;delete message X&quot;. The log has no per-record addressing. Use a queue with visibility timeouts, or a scheduler + topic.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card rd r r5&quot;&gt;&lt;h4&gt;&lt;span class=&quot;n&quot;&gt;03&lt;/span&gt;Tiny scale, tiny team&lt;/h4&gt;&lt;p&gt;Three services and 50 events/second? A managed queue or Postgres &lt;code&gt;LISTEN/NOTIFY&lt;/code&gt; will cost you a day, not a quarter. Kafka's floor is operational, not throughput.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card rd r r5&quot;&gt;&lt;h4&gt;&lt;span class=&quot;n&quot;&gt;04&lt;/span&gt;Millions of topics&lt;/h4&gt;&lt;p&gt;Per-tenant or per-user topics don't scale — each partition is files, memory, and replication overhead. Model tenancy as &lt;b&gt;keys inside&lt;/b&gt; a topic, not topics.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card rd r r6&quot;&gt;&lt;h4&gt;&lt;span class=&quot;n&quot;&gt;05&lt;/span&gt;Ad-hoc querying&lt;/h4&gt;&lt;p&gt;There is no &lt;code&gt;WHERE&lt;/code&gt;. If the access pattern is &quot;find the record for user 42&quot;, you need a store; Kafka feeds it, it doesn't replace it.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card rd r r6&quot;&gt;&lt;h4&gt;&lt;span class=&quot;n&quot;&gt;06&lt;/span&gt;Very large payloads&lt;/h4&gt;&lt;p&gt;Default max record ~1&amp;nbsp;MB. Video/blobs belong in object storage; put the &lt;b&gt;pointer&lt;/b&gt; and metadata on the topic (claim-check pattern).&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout note r r6&quot; style=&quot;margin-top:18px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;◆&lt;/span&gt;&lt;div&gt;&lt;b&gt;The honest framing for the rest of the talk:&lt;/b&gt; Kafka trades away per-message flexibility and random access to buy ordering, durable replay, and linear scale. Everything in the next eight chapters is a consequence of that one trade.&lt;/div&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- ============ CHAPTER 02 ============ --&gt;
  &lt;section class=&quot;slide chapter&quot; id=&quot;ch2&quot; data-ch=&quot;2&quot;&gt;
    &lt;div class=&quot;ch-ghost&quot;&gt;02&lt;/div&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Chapter 02 &lt;span class=&quot;num&quot;&gt;/ ~20 min&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;ch-title r r2&quot;&gt;Inside the&lt;br&gt;&lt;span class=&quot;k-amber&quot;&gt;cluster&lt;/span&gt;.&lt;/h2&gt;
    &lt;p class=&quot;ch-q r r3&quot;&gt;The question this chapter answers: &lt;b&gt;what is actually running on those machines&lt;/b&gt; — who coordinates whom, what happens to a request between socket and disk, and what the bytes look like on the filesystem?&lt;/p&gt;
    &lt;div class=&quot;ch-list&quot;&gt;
      &lt;div class=&quot;ch-item r r4&quot;&gt;&lt;b&gt;1 · Topology&lt;/b&gt;Brokers, producers, consumers, and the shape of the cluster.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r4&quot;&gt;&lt;b&gt;2 · KRaft&lt;/b&gt;Metadata as a Raft-replicated log; why ZooKeeper is gone.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r5&quot;&gt;&lt;b&gt;3 · Inside a broker&lt;/b&gt;Network threads, request queue, IO threads, purgatory, page cache.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r5&quot;&gt;&lt;b&gt;4 · On disk&lt;/b&gt;Segments, sparse indexes, and how a lookup by offset works.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r6&quot;&gt;&lt;b&gt;5 · Bootstrap&lt;/b&gt;How a client discovers leaders — and the listener bug everyone hits.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r6&quot;&gt;&lt;b&gt;6 · Sizing&lt;/b&gt;Brokers, partitions, disk, network, and cross-AZ cost.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ch-budget r r6&quot;&gt;Time budget &lt;b&gt;≈20 min&lt;/b&gt; · 6 slides · demo: request path&lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 02a · ARCHITECTURE (original) --&gt;
  &lt;section class=&quot;slide&quot; id=&quot;s2a&quot; data-ch=&quot;2&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;System Map &lt;span class=&quot;num&quot;&gt;/ 02.1&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;split&quot;&gt;
      &lt;div&gt;
        &lt;h2 class=&quot;r r2&quot;&gt;The&lt;br&gt;architecture.&lt;/h2&gt;
        &lt;p class=&quot;lede r r3&quot;&gt;A Kafka &lt;b&gt;cluster&lt;/b&gt; is a set of &lt;span class=&quot;k-amber&quot;&gt;brokers&lt;/span&gt;. Modern Kafka coordinates them with &lt;b&gt;KRaft&lt;/b&gt; — a built-in Raft quorum — replacing the old ZooKeeper dependency.&lt;/p&gt;
        &lt;ul class=&quot;feat&quot;&gt;
          &lt;li class=&quot;r r4&quot;&gt;&lt;b class=&quot;k-cyan&quot;&gt;Producers&lt;/b&gt; write events into the cluster.&lt;/li&gt;
          &lt;li class=&quot;r r5&quot;&gt;&lt;b class=&quot;k-amber&quot;&gt;Brokers&lt;/b&gt; store partitions &amp;amp; serve reads/writes.&lt;/li&gt;
          &lt;li class=&quot;r r6&quot;&gt;&lt;b class=&quot;k-violet&quot;&gt;Consumers&lt;/b&gt; subscribe and pull events downstream.&lt;/li&gt;
        &lt;/ul&gt;
        &lt;div class=&quot;tagrow r r6&quot;&gt;
          &lt;div class=&quot;chip&quot;&gt;&lt;b&gt;controller&lt;/b&gt; quorum of 3 or 5&lt;/div&gt;
          &lt;div class=&quot;chip cy&quot;&gt;&lt;b&gt;broker&lt;/b&gt; stores partition replicas&lt;/div&gt;
          &lt;div class=&quot;chip vi&quot;&gt;&lt;b&gt;client&lt;/b&gt; talks directly to leaders&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stage r r4&quot; id=&quot;stage-arch&quot;&gt;
        &lt;span class=&quot;stage-label&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;cluster.topology&lt;/span&gt;
        &lt;svg viewBox=&quot;0 0 640 480&quot; id=&quot;archsvg&quot;&gt;&lt;/svg&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 02b · KRAFT --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s2b&quot; data-ch=&quot;2&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Coordination &lt;span class=&quot;num&quot;&gt;/ 02.2&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;KRaft: the cluster's&lt;br&gt;own metadata log.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;Kafka's answer to &quot;who is the leader of partition 7?&quot; used to live in ZooKeeper — a separate system, with a separate ops story, and a push-based propagation model that got slower as clusters grew. KRaft stores metadata in &lt;b&gt;a Kafka log replicated by Raft&lt;/b&gt;, so the cluster manages its own state with its own primitives.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-52&quot;&gt;
      &lt;div class=&quot;stage mid r r4&quot; id=&quot;stage-kraft&quot;&gt;
        &lt;span class=&quot;stage-label&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;__cluster_metadata — controller quorum&lt;/span&gt;
        &lt;svg viewBox=&quot;0 0 640 400&quot; id=&quot;kraftsvg&quot;&gt;&lt;/svg&gt;
        &lt;button class=&quot;stage-btn rd&quot; id=&quot;kraftBtn&quot;&gt;⚡ Kill active controller&lt;/button&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub am&quot;&gt;How it works&lt;/div&gt;
        &lt;div class=&quot;card r r5&quot;&gt;
          &lt;ul&gt;
            &lt;li&gt;3 or 5 nodes run in &lt;b&gt;controller&lt;/b&gt; role. They elect an &lt;b&gt;active controller&lt;/b&gt; via Raft; the others are hot standbys that &lt;b&gt;already have the full log&lt;/b&gt;.&lt;/li&gt;
            &lt;li&gt;All metadata — topics, partitions, leaders, ISR, configs, ACLs — is written as records to a single-partition internal log, &lt;code&gt;__cluster_metadata&lt;/code&gt;.&lt;/li&gt;
            &lt;li&gt;Brokers &lt;b&gt;fetch&lt;/b&gt; that log like any consumer and replay it into an in-memory image. Metadata propagation becomes ordinary replication.&lt;/li&gt;
            &lt;li&gt;Each broker caches its own offset in that log, so a restart is a &lt;b&gt;tail&lt;/b&gt;, not a full re-read.&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/div&gt;
        &lt;div class=&quot;grid-2 r r6&quot; style=&quot;margin-top:12px;gap:12px&quot;&gt;
          &lt;div class=&quot;callout good&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✓&lt;/span&gt;&lt;div&gt;&lt;b&gt;Failover&lt;/b&gt; drops from seconds/minutes (ZK: reload all state) to &lt;b&gt;sub-second&lt;/b&gt; — the standby is already caught up.&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;callout good&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✓&lt;/span&gt;&lt;div&gt;&lt;b&gt;One system to run:&lt;/b&gt; one security model, one config style, one set of metrics. ZooKeeper removal completed in Kafka 4.0.&lt;/div&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;callout amb r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;▲&lt;/span&gt;&lt;div&gt;Ops notes: controllers can be &lt;b&gt;dedicated&lt;/b&gt; (recommended in production) or &lt;b&gt;combined&lt;/b&gt; with broker role (fine for dev). Migration from ZK is a defined, staged procedure — and one-way. Quorum size is about failure tolerance, not throughput: 3 tolerates 1 loss, 5 tolerates 2.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 02c · INSIDE A BROKER --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s2c&quot; data-ch=&quot;2&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Request Path &lt;span class=&quot;num&quot;&gt;/ 02.3&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Inside a broker:&lt;br&gt;socket → disk.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;Nearly every &quot;Kafka is slow&quot; investigation ends somewhere on this path. Knowing the four stages — and which metric watches each — is the difference between guessing and diagnosing.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-52&quot;&gt;
      &lt;div class=&quot;stage mid r r4&quot; id=&quot;stage-broker&quot;&gt;
        &lt;span class=&quot;stage-label&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;broker request pipeline&lt;/span&gt;
        &lt;svg viewBox=&quot;0 0 660 400&quot; id=&quot;brokersvg&quot;&gt;&lt;/svg&gt;
        &lt;button class=&quot;stage-btn&quot; id=&quot;brokerBtn&quot;&gt;Send acks=all produce ▸&lt;/button&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub&quot;&gt;The stages&lt;/div&gt;
        &lt;div class=&quot;steps r r5&quot;&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;1 · ACCEPT&lt;/span&gt;One acceptor thread per listener accepts TCP connections and hands each to a &lt;b&gt;network thread&lt;/b&gt;.&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;2 · NETWORK&lt;/span&gt;&lt;code&gt;num.network.threads&lt;/code&gt; read bytes off sockets, parse the request header, and push onto the shared &lt;b&gt;request queue&lt;/b&gt;.&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;3 · IO / HANDLER&lt;/span&gt;&lt;code&gt;num.io.threads&lt;/code&gt; do the real work: validate, assign offsets, append to the leader's log (into page cache), or read for a fetch.&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;4 · PURGATORY&lt;/span&gt;Requests that must &lt;b&gt;wait&lt;/b&gt; — &lt;code&gt;acks=all&lt;/code&gt; until replicas catch up, fetches until &lt;code&gt;fetch.min.bytes&lt;/code&gt; — park here without holding a handler thread.&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;callout note r r6&quot; style=&quot;margin-top:14px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;◆&lt;/span&gt;&lt;div&gt;&lt;b&gt;Purgatory is the trick.&lt;/b&gt; A parked request costs a timer entry, not a thread — that's how one broker holds tens of thousands of waiting fetches and slow &lt;code&gt;acks=all&lt;/code&gt; produces at the same time.&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;tbl-wrap r r6&quot; style=&quot;margin-top:12px;padding:14px 16px&quot;&gt;
          &lt;table class=&quot;tbl compact&quot;&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Symptom&lt;/th&gt;&lt;th&gt;Watch&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td&gt;Requests queuing up&lt;/td&gt;&lt;td&gt;&lt;code&gt;RequestQueueSize&lt;/code&gt;, &lt;code&gt;RequestQueueTimeMs&lt;/code&gt; → raise &lt;code&gt;num.io.threads&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Slow at the socket&lt;/td&gt;&lt;td&gt;&lt;code&gt;NetworkProcessorAvgIdlePercent&lt;/code&gt; &amp;lt; 0.3 → raise &lt;code&gt;num.network.threads&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Disk is the wall&lt;/td&gt;&lt;td&gt;&lt;code&gt;LocalTimeMs&lt;/code&gt; high → IO bound / fsync / bad disk&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Replicas lagging&lt;/td&gt;&lt;td&gt;&lt;code&gt;RemoteTimeMs&lt;/code&gt; high → follower fetch slow, not your disk&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 02d · ON DISK --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s2d&quot; data-ch=&quot;2&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Physical Layout &lt;span class=&quot;num&quot;&gt;/ 02.4&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Segments, indexes,&lt;br&gt;and the filesystem.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;A partition is a &lt;b&gt;directory&lt;/b&gt;. Inside it, the log is chopped into &lt;b&gt;segments&lt;/b&gt; named after the first offset they contain — which is what makes deletion, lookup and compaction cheap.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-2&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub am&quot;&gt;What's on disk&lt;/div&gt;
        &lt;pre class=&quot;code r r4&quot;&gt;&lt;span class=&quot;c&quot;&gt;# /var/lib/kafka/data/orders-0/&lt;/span&gt;
&lt;span class=&quot;k&quot;&gt;00000000000000000000.log&lt;/span&gt;        &lt;span class=&quot;c&quot;&gt;← records, base offset 0&lt;/span&gt;
&lt;span class=&quot;k&quot;&gt;00000000000000000000.index&lt;/span&gt;      &lt;span class=&quot;c&quot;&gt;← offset → byte position (sparse)&lt;/span&gt;
&lt;span class=&quot;k&quot;&gt;00000000000000000000.timeindex&lt;/span&gt;  &lt;span class=&quot;c&quot;&gt;← timestamp → offset (sparse)&lt;/span&gt;
&lt;span class=&quot;k&quot;&gt;00000000000000368104.log&lt;/span&gt;        &lt;span class=&quot;c&quot;&gt;← next segment&lt;/span&gt;
&lt;span class=&quot;k&quot;&gt;00000000000000368104.index&lt;/span&gt;
&lt;span class=&quot;k&quot;&gt;00000000000000368104.timeindex&lt;/span&gt;
&lt;span class=&quot;k&quot;&gt;00000000000000368104.snapshot&lt;/span&gt;   &lt;span class=&quot;c&quot;&gt;← producer state (idempotence)&lt;/span&gt;
&lt;span class=&quot;v&quot;&gt;leader-epoch-checkpoint&lt;/span&gt;         &lt;span class=&quot;c&quot;&gt;← epoch → start offset&lt;/span&gt;
&lt;span class=&quot;v&quot;&gt;partition.metadata&lt;/span&gt;

&lt;span class=&quot;c&quot;&gt;# the active segment is the only one being written&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;# roll triggers: segment.bytes (1 GiB) or segment.ms (7 d)&lt;/span&gt;&lt;/pre&gt;
        &lt;div class=&quot;callout amb r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;▲&lt;/span&gt;&lt;div&gt;Retention deletes &lt;b&gt;whole segments&lt;/b&gt;, never individual records. That's why a topic with &lt;code&gt;retention.ms=1h&lt;/code&gt; can still hold 3 hours of data: the active segment hasn't rolled yet. Surprises a lot of people during GDPR conversations.&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;callout note r r6&quot; style=&quot;margin-top:10px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;◆&lt;/span&gt;&lt;div&gt;Multiple &lt;code&gt;log.dirs&lt;/code&gt; = multiple disks, JBOD style. Partitions are spread across them; Kafka does not stripe a single partition across disks.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub&quot;&gt;Finding offset 368,192 — three hops&lt;/div&gt;
        &lt;div class=&quot;stage mid pad r r5&quot; id=&quot;stage-seg&quot;&gt;
          &lt;span class=&quot;stage-label&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;sparse index lookup&lt;/span&gt;
          &lt;svg viewBox=&quot;0 0 640 380&quot; id=&quot;segsvg&quot;&gt;&lt;/svg&gt;
          &lt;button class=&quot;stage-btn&quot; id=&quot;segBtn&quot;&gt;Look up an offset ▸&lt;/button&gt;
        &lt;/div&gt;
        &lt;div class=&quot;grid-2 r r6&quot; style=&quot;margin-top:12px;gap:12px&quot;&gt;
          &lt;div class=&quot;card cy&quot;&gt;&lt;h4&gt;Why sparse?&lt;/h4&gt;&lt;p&gt;One index entry per &lt;code&gt;index.interval.bytes&lt;/code&gt; (4&amp;nbsp;KiB), not per record. The index stays small enough to be memory-mapped, and the final step is a short sequential scan.&lt;/p&gt;&lt;/div&gt;
          &lt;div class=&quot;card am&quot;&gt;&lt;h4&gt;Binary search + scan&lt;/h4&gt;&lt;p&gt;Pick the segment by filename → binary-search the &lt;code&gt;.index&lt;/code&gt; for the nearest lower offset → scan forward in the &lt;code&gt;.log&lt;/code&gt;. Millions of records, three cheap steps.&lt;/p&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 02e · BOOTSTRAP &amp; METADATA --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s2e&quot; data-ch=&quot;2&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Client Discovery &lt;span class=&quot;num&quot;&gt;/ 02.5&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;How a client finds&lt;br&gt;the right broker.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;There is no proxy and no router in front of Kafka. Clients are &lt;b&gt;thick&lt;/b&gt;: they learn the cluster's layout and then talk &lt;b&gt;directly to each partition's leader&lt;/b&gt;. Understanding this makes an entire family of connectivity bugs obvious.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-2&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub&quot;&gt;The handshake&lt;/div&gt;
        &lt;div class=&quot;steps r r4&quot; style=&quot;flex-direction:column&quot;&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;1 · BOOTSTRAP&lt;/span&gt;&lt;code&gt;bootstrap.servers&lt;/code&gt; is only a &lt;b&gt;seed list&lt;/b&gt; — any reachable broker will do. It is not a load balancer and not a permanent binding.&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;2 · METADATA&lt;/span&gt;The client sends a Metadata request and gets back &lt;b&gt;every broker's advertised host:port&lt;/b&gt;, plus the leader and ISR for each partition it cares about.&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;3 · DIRECT CONNECT&lt;/span&gt;The client opens connections to the &lt;b&gt;leaders&lt;/b&gt; and sends produce/fetch there. Writing to a non-leader is an error, not a redirect.&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;4 · REFRESH&lt;/span&gt;Metadata is refreshed every &lt;code&gt;metadata.max.age.ms&lt;/code&gt; (5 min) and immediately on &lt;code&gt;NOT_LEADER_OR_FOLLOWER&lt;/code&gt; — that error is &lt;b&gt;normal&lt;/b&gt; during failover and is retried transparently.&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;callout good r r6&quot; style=&quot;margin-top:14px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✓&lt;/span&gt;&lt;div&gt;Consequence worth stating out loud: &lt;b&gt;the client does the routing and the partitioning.&lt;/b&gt; Kafka's server stays simple because the smarts live in the library.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub rd&quot;&gt;The bug everyone hits once&lt;/div&gt;
        &lt;pre class=&quot;code r r5&quot;&gt;&lt;span class=&quot;c&quot;&gt;# server.properties — the classic mistake&lt;/span&gt;
&lt;span class=&quot;k&quot;&gt;listeners&lt;/span&gt;=PLAINTEXT://0.0.0.0:9092
&lt;span class=&quot;c&quot;&gt;# advertised.listeners not set → defaults to the&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;# broker's own hostname, e.g. &quot;kafka-1&quot; (container id)&lt;/span&gt;

&lt;span class=&quot;c&quot;&gt;# client, from outside Docker/k8s:&lt;/span&gt;
bootstrap.servers=&lt;span class=&quot;s&quot;&gt;localhost:9092&lt;/span&gt;   &lt;span class=&quot;c&quot;&gt;✓ connects&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;# ...then metadata says: leader is at kafka-1:9092&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;# → UnknownHostException / timeouts. &quot;It connected&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;# and then hung&quot; is the signature.&lt;/span&gt;

&lt;span class=&quot;c&quot;&gt;# fix: advertise the address CLIENTS can resolve&lt;/span&gt;
&lt;span class=&quot;k&quot;&gt;listeners&lt;/span&gt;=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094
&lt;span class=&quot;k&quot;&gt;advertised.listeners&lt;/span&gt;=INTERNAL://kafka-1:9092,\
                      EXTERNAL://&lt;span class=&quot;v&quot;&gt;kafka.example.com:9094&lt;/span&gt;
&lt;span class=&quot;k&quot;&gt;listener.security.protocol.map&lt;/span&gt;=INTERNAL:PLAINTEXT,\
                      EXTERNAL:SASL_SSL
&lt;span class=&quot;k&quot;&gt;inter.broker.listener.name&lt;/span&gt;=INTERNAL&lt;/pre&gt;
        &lt;div class=&quot;callout warn r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✕&lt;/span&gt;&lt;div&gt;A TCP load balancer in front of brokers &lt;b&gt;cannot&lt;/b&gt; fix this: metadata still returns per-broker addresses, and the client will use them. Every broker needs an address the client can reach — that's why per-broker DNS/NLB listeners exist.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 02f · SIZING --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s2f&quot; data-ch=&quot;2&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Capacity &lt;span class=&quot;num&quot;&gt;/ 02.6&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Sizing a cluster,&lt;br&gt;honestly.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;Four resources bound a Kafka cluster — &lt;b&gt;network, disk throughput, disk capacity, and partition count&lt;/b&gt;. Note what's usually &lt;em&gt;not&lt;/em&gt; the bottleneck: CPU.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-52&quot;&gt;
      &lt;div class=&quot;tbl-wrap r r4&quot;&gt;
        &lt;table class=&quot;tbl&quot;&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Dimension&lt;/th&gt;&lt;th&gt;Rule of thumb&lt;/th&gt;&lt;th&gt;What blows it up&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;&lt;b&gt;Write network&lt;/b&gt;&lt;/td&gt;&lt;td&gt;ingress × RF leaves the NIC on the leader. 100&amp;nbsp;MB/s in at RF=3 → ~200&amp;nbsp;MB/s replication out&lt;/td&gt;&lt;td&gt;Consumer fan-out: every extra group re-reads the whole stream&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;b&gt;Disk throughput&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Sequential; NVMe or good EBS. Watch p99 write latency, not average&lt;/td&gt;&lt;td&gt;Cold reads (consumer lag) turn cached reads into disk reads&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;b&gt;Disk capacity&lt;/b&gt;&lt;/td&gt;&lt;td&gt;ingress × RF × retention × (1 ÷ compression) × 1.4 headroom&lt;/td&gt;&lt;td&gt;Someone sets &lt;code&gt;retention.ms=-1&lt;/code&gt; &quot;temporarily&quot;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;b&gt;Partitions/broker&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Low thousands of replicas per broker is comfortable; each one is files + memory + a fetch entry&lt;/td&gt;&lt;td&gt;Per-tenant topics; 200-partition defaults on 400 topics&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;b&gt;Brokers&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Start at 3 (RF=3, &lt;code&gt;min.insync=2&lt;/code&gt;) spread across 3 AZs; grow for throughput, not for storage alone&lt;/td&gt;&lt;td&gt;Losing a whole AZ must leave you above &lt;code&gt;min.insync.replicas&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;b&gt;Heap&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Modest — 6&amp;nbsp;GB is plenty. &lt;b&gt;Leave the rest of RAM to the page cache&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Big heaps → GC pauses → ISR shrink → false alarms&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub am&quot;&gt;The cost line nobody forecasts&lt;/div&gt;
        &lt;div class=&quot;card am r r5&quot;&gt;&lt;h4&gt;Cross-AZ replication traffic&lt;/h4&gt;&lt;p&gt;RF=3 across three AZs means every byte written crosses an AZ boundary &lt;b&gt;twice&lt;/b&gt;. In cloud environments that inter-AZ transfer is often billed — and can rival the compute bill for a high-throughput cluster.&lt;/p&gt;&lt;p&gt;Mitigations: &lt;b&gt;rack-aware consumers&lt;/b&gt; (&lt;code&gt;client.rack&lt;/code&gt; + rack-aware replica selection) so reads stay in-AZ; compression at the producer; and honest retention.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;card cy r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;h4&gt;Tiered storage changes the shape&lt;/h4&gt;&lt;p&gt;With remote storage (KIP-405), brokers keep a hot local window and offload older segments to object storage. Capacity stops driving broker count, and cluster rebalances get dramatically faster because there's less local data to move.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;callout note r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;◆&lt;/span&gt;&lt;div&gt;&lt;b&gt;Benchmark before you believe anyone.&lt;/b&gt; &lt;code&gt;kafka-producer-perf-test&lt;/code&gt; and &lt;code&gt;kafka-consumer-perf-test&lt;/code&gt; ship in the box — run them with &lt;em&gt;your&lt;/em&gt; record size, RF and acks setting. Record size alone can move throughput by 10×.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- ============ CHAPTER 03 ============ --&gt;
  &lt;section class=&quot;slide chapter&quot; id=&quot;ch3&quot; data-ch=&quot;3&quot;&gt;
    &lt;div class=&quot;ch-ghost&quot;&gt;03&lt;/div&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Chapter 03 &lt;span class=&quot;num&quot;&gt;/ ~20 min&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;ch-title r r2&quot;&gt;Topics, partitions,&lt;br&gt;and &lt;span class=&quot;k-amber&quot;&gt;keys&lt;/span&gt;.&lt;/h2&gt;
    &lt;p class=&quot;ch-q r r3&quot;&gt;The question this chapter answers: &lt;b&gt;partitioning is the one decision you cannot easily undo&lt;/b&gt; — so what does it actually control, how many should you pick, and what happens when the keys are unevenly distributed?&lt;/p&gt;
    &lt;div class=&quot;ch-list&quot;&gt;
      &lt;div class=&quot;ch-item r r4&quot;&gt;&lt;b&gt;1 · The unit of everything&lt;/b&gt;Parallelism, ordering and storage all come from the partition.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r4&quot;&gt;&lt;b&gt;2 · How many?&lt;/b&gt;The throughput math, and the cost of guessing high.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r5&quot;&gt;&lt;b&gt;3 · Keys &amp;amp; skew&lt;/b&gt;Hashing, hot partitions, and the sticky partitioner.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r5&quot;&gt;&lt;b&gt;4 · Retention vs compaction&lt;/b&gt;Two cleanup policies with completely different semantics.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r6&quot;&gt;&lt;b&gt;5 · Living with it&lt;/b&gt;Adding partitions breaks key affinity — plan for that.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ch-budget r r6&quot;&gt;Time budget &lt;b&gt;≈20 min&lt;/b&gt; · 5 slides · demo: skew &amp;amp; compaction&lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 03a · TOPICS &amp; PARTITIONS (original) --&gt;
  &lt;section class=&quot;slide&quot; id=&quot;s3a&quot; data-ch=&quot;3&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Sharding the Stream &lt;span class=&quot;num&quot;&gt;/ 03.1&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;split&quot;&gt;
      &lt;div&gt;
        &lt;h2 class=&quot;r r2&quot;&gt;Topics &amp;amp;&lt;br&gt;partitions.&lt;/h2&gt;
        &lt;p class=&quot;lede r r3&quot;&gt;A &lt;b&gt;topic&lt;/b&gt; is a named stream. Kafka splits it into &lt;b&gt;partitions&lt;/b&gt; — the unit of parallelism, ordering, and storage. Each partition is an ordered, numbered sequence.&lt;/p&gt;
        &lt;ul class=&quot;feat&quot;&gt;
          &lt;li class=&quot;r r4&quot;&gt;Order is guaranteed &lt;b&gt;within a partition&lt;/b&gt;, not across them.&lt;/li&gt;
          &lt;li class=&quot;r r5&quot;&gt;More partitions → more &lt;b&gt;parallel throughput&lt;/b&gt;.&lt;/li&gt;
          &lt;li class=&quot;r r6&quot;&gt;A message's &lt;b&gt;key&lt;/b&gt; decides its partition (hash % N).&lt;/li&gt;
        &lt;/ul&gt;
        &lt;div class=&quot;callout note r r6&quot; style=&quot;margin-top:20px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;◆&lt;/span&gt;&lt;div&gt;Say this early and repeat it: &lt;b&gt;a topic has no order.&lt;/b&gt; Only a partition does. Every &quot;Kafka reordered my events&quot; bug is really &quot;my events went to different partitions&quot;.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stage r r4&quot; id=&quot;stage-part&quot;&gt;
        &lt;span class=&quot;stage-label&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;topic: orders — 3 partitions&lt;/span&gt;
        &lt;svg viewBox=&quot;0 0 640 480&quot; id=&quot;partsvg&quot;&gt;&lt;/svg&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 03b · HOW MANY PARTITIONS --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s3b&quot; data-ch=&quot;3&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;The Sizing Decision &lt;span class=&quot;num&quot;&gt;/ 03.2&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;How many partitions?&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;The starting formula is simple; the interesting part is why both over- and under-provisioning hurt, and why the mistake is asymmetric.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-2&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub am&quot;&gt;Start with the math&lt;/div&gt;
        &lt;pre class=&quot;code r r4&quot;&gt;&lt;span class=&quot;c&quot;&gt;# t = target throughput&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;# p = what ONE partition can produce at&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;# c = what ONE consumer instance can consume at&lt;/span&gt;

&lt;span class=&quot;k&quot;&gt;partitions&lt;/span&gt; = max( t/p , t/c )

&lt;span class=&quot;c&quot;&gt;# worked example&lt;/span&gt;
target        = &lt;span class=&quot;v&quot;&gt;600 MB/s&lt;/span&gt;
per-partition = &lt;span class=&quot;v&quot;&gt;~30 MB/s&lt;/span&gt;   &lt;span class=&quot;c&quot;&gt;→ 20&lt;/span&gt;
per-consumer  = &lt;span class=&quot;v&quot;&gt;~15 MB/s&lt;/span&gt;   &lt;span class=&quot;c&quot;&gt;→ 40   ← binding&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;→ 40 partitions, then round up for headroom: 48&lt;/span&gt;

&lt;span class=&quot;c&quot;&gt;# then sanity-check the other constraints:&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;#  · ≥ max consumers you ever want in one group&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;#  · keys distribute evenly across 48 buckets?&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;#  · 48 × RF 3 = 144 replicas added to the cluster&lt;/span&gt;&lt;/pre&gt;
        &lt;div class=&quot;callout amb r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;▲&lt;/span&gt;&lt;div&gt;&lt;b&gt;The consumer side is usually the binding constraint&lt;/b&gt;, because per-message processing (a DB write, an API call) is far slower than Kafka's own IO. Size for the slowest link in the chain, not for the broker.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub rd&quot;&gt;Why the mistake is asymmetric&lt;/div&gt;
        &lt;div class=&quot;card rd r r5&quot;&gt;&lt;h4&gt;Too few&lt;/h4&gt;&lt;ul&gt;
          &lt;li&gt;Consumer parallelism is &lt;b&gt;capped&lt;/b&gt; — extra instances sit idle no matter how much lag you have.&lt;/li&gt;
          &lt;li&gt;Fixing it means adding partitions, which &lt;b&gt;changes key→partition mapping&lt;/b&gt; for all future records.&lt;/li&gt;
          &lt;li&gt;You cannot &lt;b&gt;reduce&lt;/b&gt; partition count at all. Ever. Only recreate the topic.&lt;/li&gt;
        &lt;/ul&gt;&lt;/div&gt;
        &lt;div class=&quot;card am r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;h4&gt;Too many&lt;/h4&gt;&lt;ul&gt;
          &lt;li&gt;Each replica is open &lt;b&gt;file handles&lt;/b&gt; + memory on the broker, and an entry in every follower's fetch loop.&lt;/li&gt;
          &lt;li&gt;Producer memory grows: a batch buffer &lt;b&gt;per partition&lt;/b&gt; (&lt;code&gt;batch.size&lt;/code&gt; each) — 10k partitions × 16&amp;nbsp;KiB is real RAM.&lt;/li&gt;
