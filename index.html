          &lt;li&gt;Always &lt;code&gt;close()&lt;/code&gt; on shutdown — a clean LeaveGroup avoids a 45-second timeout wait.&lt;/li&gt;
          &lt;li&gt;Keep &lt;code&gt;max.poll.records&lt;/code&gt; small enough that one poll can never exceed the interval.&lt;/li&gt;
          &lt;li&gt;Alert on &lt;b&gt;rebalance rate&lt;/b&gt;, not just lag. A healthy group rebalances on deploys — and otherwise, never.&lt;/li&gt;
        &lt;/ul&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 06e · ASSIGNORS --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s6e&quot; data-ch=&quot;6&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Assignment Strategy &lt;span class=&quot;num&quot;&gt;/ 06.5&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Who gets which partition.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;The assignor runs &lt;b&gt;inside the group leader's client&lt;/b&gt;, which means it's pluggable and you can reason about it. The differences look academic until you have state or uneven topics.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-4&quot;&gt;
      &lt;div class=&quot;card r r4&quot;&gt;&lt;h4&gt;Range&lt;/h4&gt;&lt;p&gt;Per topic, hand out contiguous ranges of partitions. Simple — and &lt;b&gt;systematically unfair&lt;/b&gt;: with 2 topics of 3 partitions and 2 consumers, consumer&amp;nbsp;A gets 4 and B gets 2, because the remainder lands on the same consumer for every topic.&lt;/p&gt;&lt;p class=&quot;k-muted&quot; style=&quot;margin-top:8px&quot;&gt;The old default. Rarely what you want.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card r r4&quot;&gt;&lt;h4&gt;Round robin&lt;/h4&gt;&lt;p&gt;Lay every topic-partition in one list and deal them out. Fair distribution — but it &lt;b&gt;reshuffles everything&lt;/b&gt; on every membership change, so all state is invalidated.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card cy r r5&quot;&gt;&lt;h4&gt;Sticky&lt;/h4&gt;&lt;p&gt;Fair &lt;b&gt;and&lt;/b&gt; minimally disruptive: keeps existing assignments wherever possible and only moves what balance requires. Fewer partitions move → less state rebuilt.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card vi r r5&quot;&gt;&lt;h4&gt;Cooperative sticky&lt;/h4&gt;&lt;p&gt;Sticky's placement plus the incremental rebalance protocol. &lt;b&gt;The default choice today&lt;/b&gt; for anything you care about.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;body-wrap grid-2&quot; style=&quot;margin-top:16px&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub am&quot;&gt;Notes from the field&lt;/div&gt;
        &lt;div class=&quot;card am r r6&quot;&gt;&lt;ul&gt;
          &lt;li&gt;All members must agree on a strategy — during a migration, list &lt;b&gt;both&lt;/b&gt; old and new so the group can roll: &lt;code&gt;partition.assignment.strategy=CooperativeSticky,Range&lt;/code&gt;, deploy, then drop the old one. Skipping the two-step means a group that can't form.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Custom assignors are legitimate.&lt;/b&gt; Rack-aware placement (keep consumers in the same AZ as their leader), weighted assignment for uneven partitions, or co-partitioning two topics so joins stay local.&lt;/li&gt;
          &lt;li&gt;Kafka Streams ships its own assignor — it co-partitions inputs and places &lt;b&gt;standby replicas&lt;/b&gt; for state stores. Don't override it.&lt;/li&gt;
        &lt;/ul&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub&quot;&gt;Assign vs subscribe&lt;/div&gt;
        &lt;pre class=&quot;code r r6&quot;&gt;&lt;span class=&quot;c&quot;&gt;// subscribe: dynamic, in a group, rebalances, &lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;// offsets managed by Kafka&lt;/span&gt;
consumer.&lt;b&gt;subscribe&lt;/b&gt;(List.of(&lt;span class=&quot;s&quot;&gt;&quot;orders&quot;&lt;/span&gt;));

&lt;span class=&quot;c&quot;&gt;// assign: manual, NO group coordination,&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;// NO rebalancing, NO automatic assignment&lt;/span&gt;
consumer.&lt;b&gt;assign&lt;/b&gt;(List.of(
    &lt;span class=&quot;k&quot;&gt;new&lt;/span&gt; TopicPartition(&lt;span class=&quot;s&quot;&gt;&quot;orders&quot;&lt;/span&gt;, &lt;span class=&quot;v&quot;&gt;3&lt;/span&gt;)));

&lt;span class=&quot;c&quot;&gt;// use assign() when you own the partition→worker&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;// mapping yourself (e.g. sharded by k8s ordinal,&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;// or a one-off replay tool). you then also own&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;// failover: nobody picks up partition 3 if you die.&lt;/span&gt;&lt;/pre&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 06f · OFFSETS &amp; LAG --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s6f&quot; data-ch=&quot;6&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Progress &amp;amp; Correctness &lt;span class=&quot;num&quot;&gt;/ 06.6&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Committing offsets&lt;br&gt;&amp;amp; watching lag.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;Where you commit decides your delivery semantics. What you monitor decides whether you find out before your users do.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-2&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub&quot;&gt;Commit strategies&lt;/div&gt;
        &lt;div class=&quot;tbl-wrap r r4&quot;&gt;
          &lt;table class=&quot;tbl compact&quot;&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Strategy&lt;/th&gt;&lt;th&gt;Semantics&lt;/th&gt;&lt;th&gt;Notes&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;enable.auto.commit=true&lt;/code&gt;&lt;/td&gt;&lt;td&gt;At-least-once, &lt;b&gt;usually&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Commits during &lt;code&gt;poll()&lt;/code&gt; every 5 s. Records fetched but not yet processed can be committed → &lt;b&gt;silent loss&lt;/b&gt; on crash&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;commitSync()&lt;/code&gt; after processing&lt;/td&gt;&lt;td&gt;At-least-once&lt;/td&gt;&lt;td&gt;Blocks and retries; simple and correct. The safe default&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;commitAsync()&lt;/code&gt;&lt;/td&gt;&lt;td&gt;At-least-once&lt;/td&gt;&lt;td&gt;Faster; no retry on failure. Pattern: async in the loop, &lt;b&gt;sync in &lt;code&gt;finally&lt;/code&gt;&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Commit &lt;b&gt;before&lt;/b&gt; processing&lt;/td&gt;&lt;td&gt;At-most-once&lt;/td&gt;&lt;td&gt;Deliberate loss on crash. Rarely the right call&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Offsets in &lt;b&gt;your DB&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Effectively exactly-once&lt;/td&gt;&lt;td&gt;Same transaction as your writes; use &lt;code&gt;seek()&lt;/code&gt; on assignment to resume&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;sendOffsetsToTransaction&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Exactly-once (Kafka→Kafka)&lt;/td&gt;&lt;td&gt;Chapter 05 — needs &lt;code&gt;read_committed&lt;/code&gt; downstream&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;
        &lt;div class=&quot;callout warn r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✕&lt;/span&gt;&lt;div&gt;Committed offset is &lt;b&gt;next to read&lt;/b&gt;, not last processed — i.e. &lt;code&gt;lastProcessed + 1&lt;/code&gt;. Off-by-one here reprocesses or skips exactly one record per partition per restart, which is maddening to debug.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub am&quot;&gt;Lag: the one metric to own&lt;/div&gt;
        &lt;pre class=&quot;code r r5&quot;&gt;&lt;span class=&quot;k&quot;&gt;lag&lt;/span&gt;(partition) = LEO − committedOffset

kafka-consumer-groups.sh --describe \
  --group billing-svc --bootstrap-server ...

TOPIC   PARTITION  CURRENT  LOG-END   &lt;span class=&quot;v&quot;&gt;LAG&lt;/span&gt;
orders  0          904511   904533    &lt;span class=&quot;v&quot;&gt;22&lt;/span&gt;
orders  1          811002   988110    &lt;span class=&quot;v&quot;&gt;177108&lt;/span&gt;  &lt;span class=&quot;c&quot;&gt;← skew or a stuck consumer&lt;/span&gt;
orders  2          904488   904533    &lt;span class=&quot;v&quot;&gt;45&lt;/span&gt;&lt;/pre&gt;
        &lt;div class=&quot;card r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;ul&gt;
          &lt;li&gt;&lt;b&gt;Alert on trend, not absolute value.&lt;/b&gt; Lag of 200k that is falling is fine; lag of 500 that is rising for 10 minutes is an incident.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Prefer time-lag&lt;/b&gt; where you can compute it (record timestamp vs now) — &quot;we are 40 seconds behind&quot; is a statement a product owner understands.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Per partition, always.&lt;/b&gt; Aggregate lag hides one stuck partition behind eleven healthy ones.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Rebalance rate + commit failures&lt;/b&gt; next to lag. Lag with a rebalance loop is a completely different diagnosis from lag with a slow database.&lt;/li&gt;
          &lt;li&gt;Lag &lt;b&gt;stuck at a constant number&lt;/b&gt; usually means a poison record: consumer retries forever, never advances. Add a dead-letter path and bounded retries.&lt;/li&gt;
        &lt;/ul&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- ============ CHAPTER 07 ============ --&gt;
  &lt;section class=&quot;slide chapter&quot; id=&quot;ch7&quot; data-ch=&quot;7&quot;&gt;
    &lt;div class=&quot;ch-ghost&quot;&gt;07&lt;/div&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Chapter 07 &lt;span class=&quot;num&quot;&gt;/ ~20 min&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;ch-title r r2&quot;&gt;Surviving&lt;br&gt;&lt;span class=&quot;k-amber&quot;&gt;failure&lt;/span&gt;.&lt;/h2&gt;
    &lt;p class=&quot;ch-q r r3&quot;&gt;The question this chapter answers: &lt;b&gt;what exactly happens when a broker dies&lt;/b&gt; — who decides, how long it takes, what can be lost, and which of these choices you control?&lt;/p&gt;
    &lt;div class=&quot;ch-list&quot;&gt;
      &lt;div class=&quot;ch-item r r4&quot;&gt;&lt;b&gt;1 · Leaders &amp;amp; followers&lt;/b&gt;The ISR, and where reads and writes go.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r4&quot;&gt;&lt;b&gt;2 · How replication works&lt;/b&gt;Followers are consumers; the HW advances behind them.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r5&quot;&gt;&lt;b&gt;3 · ISR mechanics&lt;/b&gt;Shrink, expand, and what min.insync really enforces.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r5&quot;&gt;&lt;b&gt;4 · Failure walkthroughs&lt;/b&gt;Leader loss, unclean election, and the loss window.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r6&quot;&gt;&lt;b&gt;5 · Multi-AZ &amp;amp; DR&lt;/b&gt;Rack awareness, stretch clusters, MirrorMaker 2.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r6&quot;&gt;&lt;b&gt;6 · Ops catalogue&lt;/b&gt;Symptom → metric → cause → fix.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ch-budget r r6&quot;&gt;Time budget &lt;b&gt;≈20 min&lt;/b&gt; · 6 slides · demo: kill the leader&lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 07a · REPLICATION (original) --&gt;
  &lt;section class=&quot;slide&quot; id=&quot;s7a&quot; data-ch=&quot;7&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Surviving Failure &lt;span class=&quot;num&quot;&gt;/ 07.1&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;split&quot;&gt;
      &lt;div&gt;
        &lt;h2 class=&quot;r r2&quot;&gt;Replication&lt;br&gt;&amp;amp; the ISR.&lt;/h2&gt;
        &lt;p class=&quot;lede r r3&quot;&gt;Each partition has one &lt;b class=&quot;k-amber&quot;&gt;leader&lt;/b&gt; and N &lt;b class=&quot;k-cyan&quot;&gt;followers&lt;/b&gt; on other brokers. Followers that keep up form the &lt;b&gt;In-Sync Replica&lt;/b&gt; set (ISR).&lt;/p&gt;
        &lt;ul class=&quot;feat&quot;&gt;
          &lt;li class=&quot;r r4&quot;&gt;All reads &amp;amp; writes go through the &lt;b&gt;leader&lt;/b&gt;.&lt;/li&gt;
          &lt;li class=&quot;r r5&quot;&gt;If the leader dies, an &lt;b&gt;ISR follower is promoted&lt;/b&gt;.&lt;/li&gt;
          &lt;li class=&quot;r r6&quot;&gt;&lt;b&gt;replication.factor=3&lt;/b&gt; survives 2 broker losses.&lt;/li&gt;
        &lt;/ul&gt;
        &lt;div class=&quot;callout note r r6&quot; style=&quot;margin-top:20px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;◆&lt;/span&gt;&lt;div&gt;Replication is &lt;b&gt;per partition&lt;/b&gt;, not per broker. Every broker is a leader for some partitions and a follower for others — which is how load stays even and why &quot;the leader&quot; is always a partition-scoped statement.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stage r r4&quot; id=&quot;stage-repl&quot;&gt;
        &lt;span class=&quot;stage-label&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;partition replication — RF=3&lt;/span&gt;
        &lt;svg viewBox=&quot;0 0 640 480&quot; id=&quot;replsvg&quot;&gt;&lt;/svg&gt;
        &lt;button id=&quot;killBtn&quot; style=&quot;position:absolute;top:11px;right:12px;z-index:6;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);background:rgba(255,93,108,.08);border:1px solid rgba(255,93,108,.4);border-radius:8px;padding:8px 13px;cursor:pointer&quot;&gt;⚡ Kill leader broker&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 07b · HOW REPLICATION WORKS --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s7b&quot; data-ch=&quot;7&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Mechanics &lt;span class=&quot;num&quot;&gt;/ 07.2&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Followers are&lt;br&gt;just consumers.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;There is no separate replication protocol. A follower issues &lt;b&gt;Fetch requests&lt;/b&gt; to the leader exactly like a consumer does — same code path, same batching, same zero-copy. Elegant, and it means the high watermark advances as a side effect of fetching.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-52&quot;&gt;
      &lt;div class=&quot;stage mid r r4&quot; id=&quot;stage-fetch&quot;&gt;
        &lt;span class=&quot;stage-label&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;follower fetch → HW advance&lt;/span&gt;
        &lt;svg viewBox=&quot;0 0 660 400&quot; id=&quot;fetchsvg&quot;&gt;&lt;/svg&gt;
        &lt;button class=&quot;stage-btn&quot; id=&quot;fetchBtn&quot;&gt;Produce a record ▸&lt;/button&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub&quot;&gt;The loop&lt;/div&gt;
        &lt;div class=&quot;steps r r5&quot; style=&quot;flex-direction:column&quot;&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;1 · FETCH&lt;/span&gt;Follower sends &lt;code&gt;Fetch(partition, offset=its own LEO)&lt;/code&gt;. That offset &lt;b&gt;implicitly acknowledges&lt;/b&gt; everything before it — no separate ack message exists.&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;2 · APPEND&lt;/span&gt;Follower appends the returned batches to its own log, advancing its LEO.&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;3 · HW ADVANCE&lt;/span&gt;The leader sets &lt;code&gt;HW = min(LEO of all ISR members)&lt;/code&gt;. Only now are those records &lt;b&gt;visible to consumers&lt;/b&gt;.&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;4 · PROPAGATE&lt;/span&gt;The new HW rides along in the &lt;b&gt;next&lt;/b&gt; fetch response — which is why followers learn it one round trip late, and why a follower's view of the HW always lags slightly.&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;callout note r r6&quot; style=&quot;margin-top:14px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;◆&lt;/span&gt;&lt;div&gt;&lt;b&gt;Leader epoch&lt;/b&gt; (KIP-101) is the fix for a real historical bug class: after a failover, replicas could truncate to the wrong point and diverge. Each leadership term gets a monotonic epoch number; recovering replicas ask &quot;where did epoch N end?&quot; and truncate precisely. It's why &lt;code&gt;leader-epoch-checkpoint&lt;/code&gt; is on disk and why the epoch is in every batch header.&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;callout amb r r6&quot; style=&quot;margin-top:10px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;▲&lt;/span&gt;&lt;div&gt;Tuning: &lt;code&gt;num.replica.fetchers&lt;/code&gt; (default 1) is a common bottleneck on brokers with many partitions — replication is single-threaded per source broker by default. Raise it when &lt;code&gt;RemoteTimeMs&lt;/code&gt; or under-replicated counts climb during load.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 07c · ISR MECHANICS --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s7c&quot; data-ch=&quot;7&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;The ISR &lt;span class=&quot;num&quot;&gt;/ 07.3&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Shrink, expand,&lt;br&gt;and what it costs you.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;The ISR is &lt;b&gt;dynamic membership&lt;/b&gt;, and it is the single most informative thing to watch on a Kafka cluster. Every durability guarantee is phrased in terms of it.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-2&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub am&quot;&gt;The rules&lt;/div&gt;
        &lt;div class=&quot;card r r4&quot;&gt;&lt;ul&gt;
          &lt;li&gt;A replica is &lt;b&gt;in sync&lt;/b&gt; if it has fetched up to the leader's log-end offset within &lt;code&gt;replica.lag.time.max.ms&lt;/code&gt; (30&amp;nbsp;s default). Note it's &lt;b&gt;time&lt;/b&gt;-based, not message-count based — a modern fix, because a lag-in-messages threshold falsely ejects replicas during traffic spikes.&lt;/li&gt;
          &lt;li&gt;Fall behind → the leader &lt;b&gt;shrinks&lt;/b&gt; the ISR and records it in cluster metadata. Catch up → &lt;b&gt;expand&lt;/b&gt;.&lt;/li&gt;
          &lt;li&gt;&lt;code&gt;acks=all&lt;/code&gt; means &quot;all &lt;b&gt;current&lt;/b&gt; ISR members&quot;, so a shrinking ISR silently weakens your guarantee — which is exactly why &lt;code&gt;min.insync.replicas&lt;/code&gt; exists as a floor.&lt;/li&gt;
          &lt;li&gt;Only ISR members are eligible for leadership (unless you allow unclean election).&lt;/li&gt;
        &lt;/ul&gt;&lt;/div&gt;
        &lt;div class=&quot;sub rd&quot; style=&quot;margin-top:16px&quot;&gt;Why replicas fall out&lt;/div&gt;
        &lt;div class=&quot;card rd r r6&quot;&gt;&lt;ul&gt;
          &lt;li&gt;&lt;b&gt;GC pause&lt;/b&gt; on the follower — a 40-second stop-the-world beats the 30-second threshold. The reason big heaps are discouraged.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Slow or saturated disk&lt;/b&gt; on one broker — often one bad EBS volume.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Network saturation&lt;/b&gt;, particularly cross-AZ during a backfill.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Not enough fetcher threads&lt;/b&gt; for the partition count.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;A genuine traffic spike&lt;/b&gt; the follower can't keep up with.&lt;/li&gt;
        &lt;/ul&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub&quot;&gt;Metrics that tell the story&lt;/div&gt;
        &lt;div class=&quot;tbl-wrap r r5&quot;&gt;
          &lt;table class=&quot;tbl compact&quot;&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Metric&lt;/th&gt;&lt;th&gt;Healthy&lt;/th&gt;&lt;th&gt;Meaning&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;UnderReplicatedPartitions&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;0&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Partitions with fewer replicas in ISR than RF. Non-zero for more than a rolling restart = investigate&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;UnderMinIsrPartitionCount&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;0&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;k-red&quot;&gt;&lt;b&gt;Page immediately.&lt;/b&gt; These partitions are rejecting &lt;code&gt;acks=all&lt;/code&gt; writes right now&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;OfflinePartitionsCount&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;0&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;k-red&quot;&gt;No leader at all — those partitions are unavailable for read &lt;b&gt;and&lt;/b&gt; write&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;IsrShrinksPerSec&lt;/code&gt;/&lt;code&gt;Expands&lt;/code&gt;&lt;/td&gt;&lt;td&gt;~0&lt;/td&gt;&lt;td&gt;Flapping = a marginal broker, GC, or disk. Ejecting and rejoining repeatedly is worse than being out&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;ActiveControllerCount&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;exactly 1&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Sum across the cluster. 0 = no controller; 2 = split brain&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;LeaderCount&lt;/code&gt; skew&lt;/td&gt;&lt;td&gt;even&lt;/td&gt;&lt;td&gt;One broker leading everything after a failure → run preferred-leader election&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;
        &lt;div class=&quot;callout good r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✓&lt;/span&gt;&lt;div&gt;If you keep only four alerts: &lt;code&gt;UnderMinIsrPartitionCount &amp;gt; 0&lt;/code&gt;, &lt;code&gt;OfflinePartitionsCount &amp;gt; 0&lt;/code&gt;, &lt;code&gt;ActiveControllerCount != 1&lt;/code&gt;, and consumer-lag-rising. Everything else is a dashboard.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 07d · FAILURE WALKTHROUGHS --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s7d&quot; data-ch=&quot;7&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Walkthroughs &lt;span class=&quot;num&quot;&gt;/ 07.4&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Three failures,&lt;br&gt;step by step.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;Rehearse these out loud. Being able to narrate a failover second by second is what separates &quot;we use Kafka&quot; from &quot;we operate Kafka&quot;.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-3&quot;&gt;
      &lt;div class=&quot;card cy r r4&quot;&gt;
        &lt;div class=&quot;kicker&quot;&gt;Scenario A · clean&lt;/div&gt;
        &lt;h4&gt;Leader broker dies&lt;/h4&gt;
        &lt;div class=&quot;steps&quot; style=&quot;flex-direction:column;gap:8px;margin-top:10px&quot;&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;t+0&lt;/span&gt;Broker 1 crashes. Producers to its partitions start timing out.&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;t+~1s&lt;/span&gt;Controller notices the session loss and picks a new leader &lt;b&gt;from the ISR&lt;/b&gt; for every partition broker 1 led.&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;t+~1s&lt;/span&gt;Metadata update propagates. Clients get &lt;code&gt;NOT_LEADER_OR_FOLLOWER&lt;/code&gt;, refresh metadata, and retry.&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;after&lt;/span&gt;ISR is now 2 of 3. With &lt;code&gt;min.insync=2&lt;/code&gt; you're still writable. &lt;code&gt;UnderReplicated &amp;gt; 0&lt;/code&gt; until broker 1 returns or you reassign.&lt;/div&gt;
        &lt;/div&gt;
        &lt;p class=&quot;k-cyan&quot; style=&quot;margin-top:10px;font-size:12px&quot;&gt;&lt;b&gt;Data loss: none.&lt;/b&gt; The new leader had everything up to the HW, and only HW-committed data was ever visible.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card rd r r5&quot;&gt;
        &lt;div class=&quot;kicker&quot;&gt;Scenario B · unclean&lt;/div&gt;
        &lt;h4&gt;All ISR members die&lt;/h4&gt;
        &lt;div class=&quot;steps&quot; style=&quot;flex-direction:column;gap:8px;margin-top:10px&quot;&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;t+0&lt;/span&gt;Leader and both in-sync followers are gone. Only a &lt;b&gt;stale&lt;/b&gt; out-of-sync replica remains.&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;choice&lt;/span&gt;&lt;b&gt;unclean.leader.election=false&lt;/b&gt; (default): the partition goes &lt;b&gt;offline&lt;/b&gt;. No reads, no writes, until an ISR member returns.&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;choice&lt;/span&gt;&lt;b&gt;=true&lt;/b&gt;: the stale replica becomes leader. The cluster is available again — and every record it never received is &lt;b&gt;permanently gone&lt;/b&gt;, including acknowledged ones.&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;worse&lt;/span&gt;Consumers that already read those offsets now see &lt;b&gt;different data&lt;/b&gt; at the same offsets. The log has silently forked.&lt;/div&gt;
        &lt;/div&gt;
        &lt;p class=&quot;k-red&quot; style=&quot;margin-top:10px;font-size:12px&quot;&gt;&lt;b&gt;This is the CAP trade, made explicit as a config flag.&lt;/b&gt; Keep it &lt;code&gt;false&lt;/code&gt; unless you can articulate why losing data is preferable.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card am r r6&quot;&gt;
        &lt;div class=&quot;kicker&quot;&gt;Scenario C · sneaky&lt;/div&gt;
        &lt;h4&gt;The slow broker&lt;/h4&gt;
        &lt;div class=&quot;steps&quot; style=&quot;flex-direction:column;gap:8px;margin-top:10px&quot;&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;t+0&lt;/span&gt;One broker's disk degrades. It doesn't die — it just gets slow.&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;effect&lt;/span&gt;As a &lt;b&gt;follower&lt;/b&gt; it flaps in and out of ISR. As a &lt;b&gt;leader&lt;/b&gt; it makes &lt;code&gt;acks=all&lt;/code&gt; produce latency spike for every partition it leads.&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;effect&lt;/span&gt;Purgatory fills; p99 produce latency climbs cluster-wide because clients batch multiple partitions per request.&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;fix&lt;/span&gt;Move leadership off it, then reassign its replicas away, then replace the host. &lt;b&gt;A degraded broker is worse than a dead one&lt;/b&gt; — failure detection only handles the dead case.&lt;/div&gt;
        &lt;/div&gt;
        &lt;p class=&quot;k-amber&quot; style=&quot;margin-top:10px;font-size:12px&quot;&gt;Watch &lt;code&gt;IsrShrinksPerSec&lt;/code&gt; per broker and per-broker p99 produce latency to catch this early.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout note r r6&quot; style=&quot;margin-top:16px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;◆&lt;/span&gt;&lt;div&gt;&lt;b&gt;Rehearse it for real.&lt;/b&gt; Kill a broker in staging during load and time the recovery. The number you measure — usually 1–3 seconds of elevated errors with retrying clients — is the number to quote when someone asks &quot;what happens if a node dies?&quot;&lt;/div&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 07e · MULTI-AZ / DR --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s7e&quot; data-ch=&quot;7&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Topology &amp;amp; DR &lt;span class=&quot;num&quot;&gt;/ 07.5&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Across zones,&lt;br&gt;across regions.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;Replication within a cluster gives you &lt;b&gt;broker&lt;/b&gt; fault tolerance. Surviving a zone or region needs deliberate placement — and the bill for it is mostly network.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-3&quot;&gt;
      &lt;div class=&quot;card cy r r4&quot;&gt;&lt;h4&gt;Rack awareness&lt;/h4&gt;&lt;p&gt;Set &lt;code&gt;broker.rack&lt;/code&gt; to the AZ. Kafka then spreads each partition's replicas across racks automatically, so RF=3 over 3 AZs survives losing a whole zone with &lt;code&gt;min.insync=2&lt;/code&gt; intact.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Cost:&lt;/b&gt; every write crosses AZ boundaries (RF−1) times, and inter-AZ transfer is usually billed.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card am r r4&quot;&gt;&lt;h4&gt;Follower fetching&lt;/h4&gt;&lt;p&gt;KIP-392: with &lt;code&gt;client.rack&lt;/code&gt; on the consumer and a rack-aware replica selector on the broker, consumers read from a &lt;b&gt;local follower&lt;/b&gt; instead of a possibly-remote leader.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Win:&lt;/b&gt; big reduction in cross-AZ read traffic and latency. &lt;b&gt;Caveat:&lt;/b&gt; followers serve only up to their view of the HW, so add a little latency.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card vi r r5&quot;&gt;&lt;h4&gt;Stretch cluster&lt;/h4&gt;&lt;p&gt;One cluster spanning 3 AZs (or nearby regions) with rack-aware placement. &lt;b&gt;Synchronous&lt;/b&gt; — no failover step, no offset translation, RPO zero.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Requires&lt;/b&gt; low, stable inter-AZ latency: every &lt;code&gt;acks=all&lt;/code&gt; write pays it. Across distant regions, don't.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card r r5&quot;&gt;&lt;h4&gt;MirrorMaker 2&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Asynchronous&lt;/b&gt; replication between clusters (Connect-based). Mirrors topics, configs, ACLs and translates consumer offsets between clusters.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Reality:&lt;/b&gt; non-zero RPO, and failover is an operational procedure — offsets don't line up exactly. Test it, don't assume it.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card cy r r6&quot;&gt;&lt;h4&gt;Active/active&lt;/h4&gt;&lt;p&gt;Two regions, each with local producers, mirroring each other with topic prefixes to avoid loops. Great availability; you now own &lt;b&gt;conflict resolution&lt;/b&gt; at the application level.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card am r r6&quot;&gt;&lt;h4&gt;Tiered storage&lt;/h4&gt;&lt;p&gt;Old segments live in object storage, which is already multi-AZ durable. Shrinks local disk, makes rebalancing fast, and lets retention stretch to months — but historical reads get object-store latency.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;body-wrap grid-2&quot; style=&quot;margin-top:16px&quot;&gt;
      &lt;div class=&quot;callout amb r r6&quot;&gt;&lt;span class=&quot;ic&quot;&gt;▲&lt;/span&gt;&lt;div&gt;&lt;b&gt;Say the quiet part:&lt;/b&gt; for a high-throughput cluster, cross-AZ replication traffic can be the largest line item — larger than the instances. Compression, follower fetching and honest retention are cost levers, not just performance ones.&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;callout note r r6&quot;&gt;&lt;span class=&quot;ic&quot;&gt;◆&lt;/span&gt;&lt;div&gt;&lt;b&gt;Define RPO/RTO before choosing.&lt;/b&gt; &quot;Zero data loss&quot; → stretch cluster and accept the latency. &quot;Minutes of loss acceptable&quot; → MM2 and accept the failover runbook. There is no option that gives you both cheaply.&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 07f · OPS CATALOGUE --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s7f&quot; data-ch=&quot;7&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Runbook &lt;span class=&quot;num&quot;&gt;/ 07.6&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;What actually&lt;br&gt;breaks in production.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;Not theory — the recurring incidents, in rough order of frequency.&lt;/p&gt;
    &lt;div class=&quot;body-wrap tbl-wrap r r4&quot;&gt;
      &lt;table class=&quot;tbl&quot;&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Symptom&lt;/th&gt;&lt;th&gt;Look at&lt;/th&gt;&lt;th&gt;Usual cause&lt;/th&gt;&lt;th&gt;Fix&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;&lt;b&gt;Consumer lag climbing&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Lag per partition, rebalance rate, downstream latency&lt;/td&gt;&lt;td&gt;Slow processing or a rebalance loop — rarely Kafka itself&lt;/td&gt;&lt;td&gt;Scale consumers (up to partition count), lower &lt;code&gt;max.poll.records&lt;/code&gt;, fix the slow dependency&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;b&gt;Producer timeouts&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;RequestQueueTimeMs&lt;/code&gt;, &lt;code&gt;UnderMinIsr&lt;/code&gt;, buffer-available&lt;/td&gt;&lt;td&gt;ISR below min.insync, a slow broker, or a full client buffer&lt;/td&gt;&lt;td&gt;Restore replication first; raise &lt;code&gt;delivery.timeout.ms&lt;/code&gt; only as a stopgap&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;b&gt;Disk full&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Log dir size, retention configs, largest topics&lt;/td&gt;&lt;td&gt;Someone set infinite retention, or a topic 100× its forecast&lt;/td&gt;&lt;td&gt;Shorten retention on the offender (takes effect on segment roll), add disk, then fix the topic policy&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;b&gt;Rebalance storm&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Rebalance rate, &lt;code&gt;CommitFailedException&lt;/code&gt; logs&lt;/td&gt;&lt;td&gt;Processing exceeds &lt;code&gt;max.poll.interval&lt;/code&gt;; eager assignor; unclean shutdowns&lt;/td&gt;&lt;td&gt;Cooperative sticky + &lt;code&gt;group.instance.id&lt;/code&gt;, smaller polls, always &lt;code&gt;close()&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;b&gt;ISR flapping&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;IsrShrinksPerSec&lt;/code&gt; per broker, GC logs, disk p99&lt;/td&gt;&lt;td&gt;GC pauses, one degraded disk, too few replica fetchers&lt;/td&gt;&lt;td&gt;Shrink the heap, replace the disk, raise &lt;code&gt;num.replica.fetchers&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;b&gt;Offline partitions&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;OfflinePartitionsCount&lt;/code&gt;, controller log&lt;/td&gt;&lt;td&gt;Lost more brokers than RF tolerates, or all ISR gone&lt;/td&gt;&lt;td&gt;Bring a broker back. Unclean election only as a documented, accepted-loss decision&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;b&gt;&quot;Connected then hung&quot;&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Client metadata, &lt;code&gt;advertised.listeners&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Advertised addresses aren't resolvable from the client network&lt;/td&gt;&lt;td&gt;Per-broker reachable listeners (Chapter 02.5)&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;b&gt;Duplicate processing&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Rebalance timing, commit strategy&lt;/td&gt;&lt;td&gt;At-least-once + rebalance — &lt;b&gt;working as designed&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Make consumers idempotent; commit in &lt;code&gt;onPartitionsRevoked&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;b&gt;New broker idle&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;LeaderCount&lt;/code&gt;, partition placement&lt;/td&gt;&lt;td&gt;Nothing is reassigned automatically&lt;/td&gt;&lt;td&gt;&lt;code&gt;kafka-reassign-partitions&lt;/code&gt; with a throttle, or Cruise Control&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout good r r6&quot; style=&quot;margin-top:16px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✓&lt;/span&gt;&lt;div&gt;&lt;b&gt;Pattern worth naming:&lt;/b&gt; most &quot;Kafka incidents&quot; are consumer incidents or capacity incidents. The brokers are usually fine. Instrument the clients as carefully as you instrument the cluster.&lt;/div&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- ============ CHAPTER 08 ============ --&gt;
  &lt;section class=&quot;slide chapter&quot; id=&quot;ch8&quot; data-ch=&quot;8&quot;&gt;
    &lt;div class=&quot;ch-ghost&quot;&gt;08&lt;/div&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Chapter 08 &lt;span class=&quot;num&quot;&gt;/ ~20 min&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;ch-title r r2&quot;&gt;Guarantees you&lt;br&gt;&lt;span class=&quot;k-cyan&quot;&gt;dial in&lt;/span&gt;.&lt;/h2&gt;
    &lt;p class=&quot;ch-q r r3&quot;&gt;The question this chapter answers: &lt;b&gt;Kafka doesn't have one correctness level — it has a dial&lt;/b&gt;. Which knobs move it, what does each cost, and where does &quot;exactly-once&quot; stop being true?&lt;/p&gt;
    &lt;div class=&quot;ch-list&quot;&gt;
      &lt;div class=&quot;ch-item r r4&quot;&gt;&lt;b&gt;1 · Three semantics&lt;/b&gt;At most once, at least once, exactly once.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r4&quot;&gt;&lt;b&gt;2 · Ordering&lt;/b&gt;What guarantees it, and the five things that break it.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r5&quot;&gt;&lt;b&gt;3 · End-to-end EOS&lt;/b&gt;Where the guarantee holds and where it leaks.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r6&quot;&gt;&lt;b&gt;4 · Config profiles&lt;/b&gt;Four ready-made settings bundles you can copy.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ch-budget r r6&quot;&gt;Time budget &lt;b&gt;≈20 min&lt;/b&gt; · 4 slides · lots of discussion&lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 08a · GUARANTEES (original) --&gt;
  &lt;section class=&quot;slide&quot; id=&quot;s8a&quot; data-ch=&quot;8&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Delivery Semantics &lt;span class=&quot;num&quot;&gt;/ 08.1&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot; style=&quot;margin-bottom:10px&quot;&gt;The guarantees you can dial in.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot; style=&quot;max-width:70ch&quot;&gt;Kafka lets you trade latency for safety. Three delivery semantics, chosen by config — plus idempotent &amp;amp; transactional producers for exactly-once.&lt;/p&gt;
    &lt;div class=&quot;split&quot; style=&quot;grid-template-columns:1fr 1fr 1fr;margin-top:36px;align-items:stretch&quot;&gt;
      &lt;div class=&quot;stage r r4&quot; style=&quot;min-height:auto;padding:26px 24px 24px&quot;&gt;
        &lt;div class=&quot;k-red&quot; style=&quot;font-family:var(--disp);font-weight:800;font-size:26px&quot;&gt;At most once&lt;/div&gt;
        &lt;p class=&quot;lede&quot; style=&quot;margin-top:12px&quot;&gt;Commit offset &lt;b&gt;before&lt;/b&gt; processing. Fast, but a crash can &lt;b&gt;lose&lt;/b&gt; messages. Rarely what you want.&lt;/p&gt;
        &lt;p class=&quot;lede&quot; style=&quot;margin-top:10px;font-size:12px&quot;&gt;Producer side: &lt;code&gt;acks=0&lt;/code&gt;, no retries.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stage r r5&quot; style=&quot;min-height:auto;padding:26px 24px 24px&quot;&gt;
        &lt;div class=&quot;k-amber&quot; style=&quot;font-family:var(--disp);font-weight:800;font-size:26px&quot;&gt;At least once&lt;/div&gt;
        &lt;p class=&quot;lede&quot; style=&quot;margin-top:12px&quot;&gt;Commit &lt;b&gt;after&lt;/b&gt; processing. Never loses data, but a retry can &lt;b&gt;duplicate&lt;/b&gt;. The common default.&lt;/p&gt;
        &lt;p class=&quot;lede&quot; style=&quot;margin-top:10px;font-size:12px&quot;&gt;Producer: &lt;code&gt;acks=all&lt;/code&gt; + retries. Consumer: commit after work. &lt;b&gt;Make handlers idempotent.&lt;/b&gt;&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stage r r6&quot; style=&quot;min-height:auto;padding:26px 24px 24px&quot;&gt;
        &lt;div class=&quot;k-cyan&quot; style=&quot;font-family:var(--disp);font-weight:800;font-size:26px&quot;&gt;Exactly once&lt;/div&gt;
        &lt;p class=&quot;lede&quot; style=&quot;margin-top:12px&quot;&gt;Idempotent producer + &lt;b&gt;transactions&lt;/b&gt; across topics. No loss, no dupes — with a throughput cost.&lt;/p&gt;
        &lt;p class=&quot;lede&quot; style=&quot;margin-top:10px;font-size:12px&quot;&gt;Only end-to-end when &lt;b&gt;both&lt;/b&gt; ends participate: &lt;code&gt;read_committed&lt;/code&gt;, or an idempotent sink.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout amb r r6&quot; style=&quot;margin-top:26px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;▲&lt;/span&gt;&lt;div&gt;&lt;b&gt;90% of production systems should choose at-least-once with idempotent handlers.&lt;/b&gt; It's simpler, faster, and survives every failure mode. Reach for transactions when the processing is Kafka→Kafka and the arithmetic must be exact.&lt;/div&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 08b · ORDERING --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s8b&quot; data-ch=&quot;8&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Ordering &lt;span class=&quot;num&quot;&gt;/ 08.2&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;What actually&lt;br&gt;guarantees order.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;The guarantee is narrow and precise: &lt;b&gt;records with the same key, produced by one producer to one partition, are consumed in the order they were produced.&lt;/b&gt; Every clause in that sentence is load-bearing.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-2&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub rd&quot;&gt;Five ways it breaks&lt;/div&gt;
        &lt;div class=&quot;card rd r r4&quot;&gt;&lt;ul&gt;
          &lt;li&gt;&lt;b&gt;Different partitions.&lt;/b&gt; No cross-partition ordering exists — not even approximately. Two consumers process partition 0 and 1 at unrelated speeds.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Retries without idempotence.&lt;/b&gt; With &lt;code&gt;max.in.flight&amp;gt;1&lt;/code&gt; and &lt;code&gt;enable.idempotence=false&lt;/code&gt;, batch 2 can land before a retried batch 1. Silent reordering.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Partition count change.&lt;/b&gt; After a resize, a key's records live in two partitions with no ordering between them.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Rebalances + concurrency.&lt;/b&gt; Hand records to a thread pool and you've discarded partition order inside your own app, whatever Kafka delivered.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Multiple producers, same key.&lt;/b&gt; Kafka orders by &lt;b&gt;arrival at the leader&lt;/b&gt;. Two producers writing the same entity race, and the winner is whoever's packet arrives first — not whoever acted first.&lt;/li&gt;
        &lt;/ul&gt;&lt;/div&gt;
        &lt;div class=&quot;callout warn r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✕&lt;/span&gt;&lt;div&gt;The last one is the deepest. If two services can write the same entity, Kafka's ordering won't save you — you need a single writer per key, or version numbers / optimistic concurrency in the payload.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub&quot;&gt;Getting ordering you can rely on&lt;/div&gt;
        &lt;div class=&quot;card cy r r5&quot;&gt;&lt;ul&gt;
          &lt;li&gt;&lt;b&gt;Key by the entity&lt;/b&gt; whose order matters — &lt;code&gt;accountId&lt;/code&gt;, not &lt;code&gt;eventId&lt;/code&gt;. This is the single most consequential modelling decision on the producer side.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;One writer per key.&lt;/b&gt; Route commands for an entity through one owner service (or one Streams task).&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Keep &lt;code&gt;enable.idempotence=true&lt;/code&gt;&lt;/b&gt; (the default) so pipelining and ordering coexist.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Process a partition in one thread&lt;/b&gt;, or use a key-affine executor that pins a key to a worker.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Carry a version or timestamp&lt;/b&gt; in the payload so downstream can reject stale updates even if ordering is violated. Defence in depth.&lt;/li&gt;
        &lt;/ul&gt;&lt;/div&gt;
        &lt;div class=&quot;callout good r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✓&lt;/span&gt;&lt;div&gt;&lt;b&gt;Reframe for the audience:&lt;/b&gt; ordering isn't something Kafka gives you — it's something you buy with a key, and pay for with a limit on parallelism for that key. That trade is the whole partition model in one sentence.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 08c · END-TO-END EOS --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s8c&quot; data-ch=&quot;8&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Honest EOS &lt;span class=&quot;num&quot;&gt;/ 08.3&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Where exactly-once&lt;br&gt;stops being true.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;Kafka's exactly-once is real, but it is scoped: &lt;b&gt;reads and writes within Kafka&lt;/b&gt;. The moment you touch the outside world, the guarantee becomes your responsibility.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-3&quot;&gt;
      &lt;div class=&quot;card cy r r4&quot;&gt;
        &lt;div class=&quot;kicker&quot;&gt;Holds&lt;/div&gt;
        &lt;h4&gt;Kafka → Kafka&lt;/h4&gt;
        &lt;p&gt;Read from topic A, transform, write to B and C, commit offsets — all in one transaction, consumed with &lt;code&gt;read_committed&lt;/code&gt;.&lt;/p&gt;
        &lt;p&gt;&lt;b&gt;This genuinely works.&lt;/b&gt; Kafka Streams with &lt;code&gt;exactly_once_v2&lt;/code&gt;, or Flink with its Kafka sink, gives it to you as a config value.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card am r r5&quot;&gt;
        &lt;div class=&quot;kicker&quot;&gt;Needs your help&lt;/div&gt;
        &lt;h4&gt;Kafka → database&lt;/h4&gt;
        &lt;p&gt;The transaction can't span Kafka and Postgres. Two options that actually work:&lt;/p&gt;
        &lt;p&gt;&lt;b&gt;1.&lt;/b&gt; Store the &lt;b&gt;offset in the same DB transaction&lt;/b&gt; as the data, and &lt;code&gt;seek()&lt;/code&gt; to it on assignment. Now &quot;processed&quot; and &quot;recorded&quot; commit together.&lt;/p&gt;
        &lt;p&gt;&lt;b&gt;2.&lt;/b&gt; Make the write &lt;b&gt;idempotent&lt;/b&gt; — upsert by a business key, or &lt;code&gt;INSERT ... ON CONFLICT DO NOTHING&lt;/code&gt; on a dedup table keyed by &lt;code&gt;(topic,partition,offset)&lt;/code&gt;.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card rd r r6&quot;&gt;
        &lt;div class=&quot;kicker&quot;&gt;Cannot hold&lt;/div&gt;
        &lt;h4&gt;Kafka → external side effect&lt;/h4&gt;
        &lt;p&gt;Charging a card, sending an email, calling a third-party API. You cannot make &quot;process the record&quot; and &quot;the side effect happened&quot; atomic across a network you don't control.&lt;/p&gt;
        &lt;p&gt;&lt;b&gt;The only real answer&lt;/b&gt; is an idempotency key that the &lt;em&gt;receiving&lt;/em&gt; system honours (every serious payments API supports one). Kafka's job is to guarantee you get the record &lt;b&gt;at least once&lt;/b&gt;; deduplication belongs at the boundary.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;body-wrap grid-2&quot; style=&quot;margin-top:16px&quot;&gt;
      &lt;div class=&quot;callout note r r6&quot;&gt;&lt;span class=&quot;ic&quot;&gt;◆&lt;/span&gt;&lt;div&gt;&lt;b&gt;Useful framing for skeptics:&lt;/b&gt; &quot;exactly-once&quot; doesn't mean each record is physically delivered once — retries still happen. It means the &lt;b&gt;observable effect&lt;/b&gt; occurs once. That's why idempotence at the boundary is always part of the design, never an admission of failure.&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;callout good r r6&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✓&lt;/span&gt;&lt;div&gt;&lt;b&gt;Design rule:&lt;/b&gt; make handlers idempotent first, then decide whether transactions are still worth the cost. Teams that do it the other way round end up with slow pipelines that &lt;em&gt;still&lt;/em&gt; need idempotent handlers.&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 08d · CONFIG PROFILES --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s8d&quot; data-ch=&quot;8&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Cheat Sheet &lt;span class=&quot;num&quot;&gt;/ 08.4&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Four profiles&lt;br&gt;you can copy.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;Pick the column that matches the topic — not the company. Most systems run several of these side by side, and mixing them per topic is correct, not sloppy.&lt;/p&gt;
    &lt;div class=&quot;body-wrap tbl-wrap r r4&quot;&gt;
      &lt;table class=&quot;tbl&quot;&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Setting&lt;/th&gt;&lt;th class=&quot;k-cyan&quot;&gt;Max durability&lt;/th&gt;&lt;th class=&quot;k-amber&quot;&gt;Balanced (default)&lt;/th&gt;&lt;th class=&quot;k-violet&quot;&gt;Max throughput&lt;/th&gt;&lt;th class=&quot;k-red&quot;&gt;Lowest latency&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;acks&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;all&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;all&lt;/b&gt;&lt;/td&gt;&lt;td&gt;all&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;replication.factor&lt;/code&gt;&lt;/td&gt;&lt;td&gt;3 (or 5)&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;min.insync.replicas&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;2&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;2&lt;/b&gt;&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;enable.idempotence&lt;/code&gt;&lt;/td&gt;&lt;td&gt;true&lt;/td&gt;&lt;td&gt;true&lt;/td&gt;&lt;td&gt;true&lt;/td&gt;&lt;td&gt;true&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;linger.ms&lt;/code&gt;&lt;/td&gt;&lt;td&gt;5–20&lt;/td&gt;&lt;td&gt;&lt;b&gt;5–10&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;50–100&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;0&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;batch.size&lt;/code&gt;&lt;/td&gt;&lt;td&gt;64 KB&lt;/td&gt;&lt;td&gt;32–64 KB&lt;/td&gt;&lt;td&gt;&lt;b&gt;256 KB–1 MB&lt;/b&gt;&lt;/td&gt;&lt;td&gt;16 KB&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;compression.type&lt;/code&gt;&lt;/td&gt;&lt;td&gt;lz4 / zstd&lt;/td&gt;&lt;td&gt;&lt;b&gt;lz4&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;zstd&lt;/b&gt;&lt;/td&gt;&lt;td&gt;lz4 or none&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;unclean.leader.election&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;false&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;false&lt;/b&gt;&lt;/td&gt;&lt;td&gt;false&lt;/td&gt;&lt;td&gt;false&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;fetch.min.bytes&lt;/code&gt;&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;1–10 KB&lt;/td&gt;&lt;td&gt;&lt;b&gt;100 KB+&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;1&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Consumer commit&lt;/td&gt;&lt;td&gt;Sync, after processing&lt;/td&gt;&lt;td&gt;Async + sync on close&lt;/td&gt;&lt;td&gt;Async, larger batches&lt;/td&gt;&lt;td&gt;Async&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Transactions&lt;/td&gt;&lt;td&gt;If Kafka→Kafka&lt;/td&gt;&lt;td&gt;No&lt;/td&gt;&lt;td&gt;No&lt;/td&gt;&lt;td&gt;No&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;b&gt;Typical use&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Payments, ledger, CDC of record&lt;/td&gt;&lt;td&gt;Almost everything&lt;/td&gt;&lt;td&gt;Logs, metrics, clickstream, ETL&lt;/td&gt;&lt;td&gt;Trading signals, live dashboards&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;div class=&quot;body-wrap grid-3&quot; style=&quot;margin-top:16px&quot;&gt;
      &lt;div class=&quot;callout good r r5&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✓&lt;/span&gt;&lt;div&gt;Note how little changes between columns. &lt;b&gt;Durability is nearly free&lt;/b&gt;; latency and throughput are where the real money is spent.&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;callout warn r r5&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✕&lt;/span&gt;&lt;div&gt;Never mix &lt;code&gt;acks=all&lt;/code&gt; with &lt;code&gt;min.insync.replicas=1&lt;/code&gt; and call it durable. That's the trap from Chapter 05.3.&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;callout note r r6&quot;&gt;&lt;span class=&quot;ic&quot;&gt;◆&lt;/span&gt;&lt;div&gt;Set these &lt;b&gt;per topic&lt;/b&gt; where you can (&lt;code&gt;min.insync.replicas&lt;/code&gt;, retention, cleanup policy are topic configs) so one profile doesn't tax every stream.&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- ============ CHAPTER 09 ============ --&gt;
  &lt;section class=&quot;slide chapter&quot; id=&quot;ch9&quot; data-ch=&quot;9&quot;&gt;
    &lt;div class=&quot;ch-ghost&quot;&gt;09&lt;/div&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Chapter 09 &lt;span class=&quot;num&quot;&gt;/ ~20 min&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;ch-title r r2&quot;&gt;The whole&lt;br&gt;&lt;span class=&quot;k-cyan&quot;&gt;picture&lt;/span&gt;.&lt;/h2&gt;
    &lt;p class=&quot;ch-q r r3&quot;&gt;The question this chapter answers: &lt;b&gt;now that the log exists, what gets built on top of it&lt;/b&gt; — and what do you actually need to run day two?&lt;/p&gt;
    &lt;div class=&quot;ch-list&quot;&gt;
      &lt;div class=&quot;ch-item r r4&quot;&gt;&lt;b&gt;1 · Fan-out&lt;/b&gt;One stream, many independent consumers.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r4&quot;&gt;&lt;b&gt;2 · The ecosystem&lt;/b&gt;Connect, Streams, Flink, Schema Registry, tiered storage.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r5&quot;&gt;&lt;b&gt;3 · Day two&lt;/b&gt;The dashboard, the alerts, the habits.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r6&quot;&gt;&lt;b&gt;4 · Recap&lt;/b&gt;Ten sentences that carry the whole talk.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ch-budget r r6&quot;&gt;Time budget &lt;b&gt;≈20 min&lt;/b&gt; · 4 slides · Q&amp;amp;A&lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 09a · FAN-OUT (original) --&gt;
  &lt;section class=&quot;slide&quot; id=&quot;s9a&quot; data-ch=&quot;9&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;The Whole Picture &lt;span class=&quot;num&quot;&gt;/ 09.1&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;split&quot; style=&quot;grid-template-columns:1.1fr 1fr&quot;&gt;
      &lt;div&gt;
        &lt;h2 class=&quot;r r2&quot;&gt;One log,&lt;br&gt;many worlds.&lt;/h2&gt;
        &lt;p class=&quot;lede r r3&quot;&gt;Because the log is durable and replayable, a single stream feeds many purposes at once — the pattern behind modern event-driven systems.&lt;/p&gt;
        &lt;div class=&quot;pill-row r r5&quot; style=&quot;margin-top:30px&quot;&gt;
          &lt;div class=&quot;pill&quot;&gt;&lt;b&gt;▸&lt;/b&gt; Event sourcing&lt;/div&gt;
          &lt;div class=&quot;pill&quot;&gt;&lt;b&gt;▸&lt;/b&gt; Log aggregation&lt;/div&gt;
          &lt;div class=&quot;pill&quot;&gt;&lt;b&gt;▸&lt;/b&gt; Stream processing&lt;/div&gt;
          &lt;div class=&quot;pill&quot;&gt;&lt;b&gt;▸&lt;/b&gt; Metrics &amp;amp; telemetry&lt;/div&gt;
          &lt;div class=&quot;pill&quot;&gt;&lt;b&gt;▸&lt;/b&gt; Change data capture&lt;/div&gt;
          &lt;div class=&quot;pill&quot;&gt;&lt;b&gt;▸&lt;/b&gt; Microservice backbone&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;callout note r r6&quot; style=&quot;margin-top:24px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;◆&lt;/span&gt;&lt;div&gt;Each of these is a &lt;b&gt;separate consumer group&lt;/b&gt; reading the same bytes at its own pace, with its own offsets and its own failure domain. Adding one is a config change, not a project.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stage r r4&quot; id=&quot;stage-fan&quot;&gt;
        &lt;span class=&quot;stage-label&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;one topic → many consumers&lt;/span&gt;
        &lt;svg viewBox=&quot;0 0 640 480&quot; id=&quot;fansvg&quot;&gt;&lt;/svg&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 09b · ECOSYSTEM --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s9b&quot; data-ch=&quot;9&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Around the Log &lt;span class=&quot;num&quot;&gt;/ 09.2&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;You rarely use&lt;br&gt;Kafka alone.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;Most of the value people attribute to &quot;Kafka&quot; is actually delivered by the layer around it. Knowing which tool owns which job saves a lot of custom code.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-3&quot;&gt;
      &lt;div class=&quot;card cy r r4&quot;&gt;&lt;h4&gt;Kafka Connect&lt;/h4&gt;&lt;p&gt;A runtime for &lt;b&gt;source and sink connectors&lt;/b&gt; — Debezium for database CDC, S3/JDBC/Elastic/Snowflake sinks. Distributed, with offset and config state kept in Kafka topics.&lt;/p&gt;&lt;p class=&quot;k-cyan&quot; style=&quot;font-size:11.5px;margin-top:8px&quot;&gt;Rule: if you're writing a service whose only job is to copy data between Kafka and a store, a connector probably exists.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card am r r4&quot;&gt;&lt;h4&gt;Kafka Streams&lt;/h4&gt;&lt;p&gt;A &lt;b&gt;library&lt;/b&gt; (no cluster) for joins, windowed aggregations, and local state backed by RocksDB with a compacted changelog topic. Scales by adding instances; exactly-once with one setting.&lt;/p&gt;&lt;p class=&quot;k-amber&quot; style=&quot;font-size:11.5px;margin-top:8px&quot;&gt;Best fit when you want stream processing inside an existing JVM service.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card vi r r5&quot;&gt;&lt;h4&gt;Apache Flink&lt;/h4&gt;&lt;p&gt;A &lt;b&gt;cluster&lt;/b&gt; for heavier stream processing: event-time semantics, large state, SQL, and multi-source pipelines. The default choice for large or long-lived streaming jobs.&lt;/p&gt;&lt;p class=&quot;k-violet&quot; style=&quot;font-size:11.5px;margin-top:8px&quot;&gt;Streams for embedded and simple; Flink for big, stateful and operationally owned.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card r r5&quot;&gt;&lt;h4&gt;Schema Registry&lt;/h4&gt;&lt;p&gt;Kafka values are &lt;b&gt;opaque bytes&lt;/b&gt; — nothing stops a producer changing the shape and breaking every consumer. A registry stores Avro/Protobuf/JSON-Schema versions and &lt;b&gt;enforces compatibility&lt;/b&gt; at serialization time.&lt;/p&gt;&lt;p class=&quot;k-muted&quot; style=&quot;font-size:11.5px;margin-top:8px&quot;&gt;Adopt this early. Retrofitting schemas onto a live topic is genuinely painful.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card cy r r6&quot;&gt;&lt;h4&gt;Tiered storage&lt;/h4&gt;&lt;p&gt;Old segments offloaded to object storage (KIP-405). Retention measured in months without giant brokers, and much faster rebalances because less data is local.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card am r r6&quot;&gt;&lt;h4&gt;Where it's heading&lt;/h4&gt;&lt;p&gt;&lt;b&gt;KRaft everywhere&lt;/b&gt; (ZooKeeper removed in 4.0) · &lt;b&gt;KIP-848&lt;/b&gt; broker-side rebalancing · &lt;b&gt;share groups / queue semantics&lt;/b&gt; (KIP-932) bringing per-message acknowledgement to Kafka · &lt;b&gt;diskless / object-store-first&lt;/b&gt; designs aimed squarely at cross-AZ cost.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout amb r r6&quot; style=&quot;margin-top:16px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;▲&lt;/span&gt;&lt;div&gt;&lt;b&gt;Governance is the part that bites at scale.&lt;/b&gt; Naming conventions, topic ownership, schema compatibility rules, retention defaults, and an ACL model — decide these while you have 20 topics, not 2,000. The technology scales more gracefully than the conventions do.&lt;/div&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 09c · DAY TWO --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s9c&quot; data-ch=&quot;9&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Operating It &lt;span class=&quot;num&quot;&gt;/ 09.3&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Day two: the dashboard&lt;br&gt;and the habits.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;If you take one operational artifact from this talk, take this list. Four pages, a handful of alerts, three habits.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-2&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub&quot;&gt;The dashboard, in four panels&lt;/div&gt;
        &lt;div class=&quot;tbl-wrap r r4&quot;&gt;
          &lt;table class=&quot;tbl compact&quot;&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Panel&lt;/th&gt;&lt;th&gt;Metrics&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td&gt;&lt;b&gt;Cluster health&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;ActiveControllerCount&lt;/code&gt; (=1) · &lt;code&gt;OfflinePartitionsCount&lt;/code&gt; · &lt;code&gt;UnderReplicatedPartitions&lt;/code&gt; · &lt;code&gt;UnderMinIsrPartitionCount&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;b&gt;Broker load&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Bytes in/out per broker · request rate · &lt;code&gt;RequestQueueTimeMs&lt;/code&gt;, &lt;code&gt;LocalTimeMs&lt;/code&gt;, &lt;code&gt;RemoteTimeMs&lt;/code&gt; p99 · idle % of network and IO threads · disk used&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;b&gt;Producers&lt;/b&gt;&lt;/td&gt;&lt;td&gt;record-error-rate · request-latency p99 · buffer-available-bytes · batch-size-avg · &lt;b&gt;records-per-request&lt;/b&gt; (batching health)&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;b&gt;Consumers&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;Lag per group per partition&lt;/b&gt; · records-lag-max · commit rate + failures · &lt;b&gt;rebalance rate&lt;/b&gt; · fetch latency&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;
        &lt;div class=&quot;sub rd&quot; style=&quot;margin-top:16px&quot;&gt;Alert on these; graph the rest&lt;/div&gt;
        &lt;div class=&quot;card rd r r5&quot;&gt;&lt;ul&gt;
          &lt;li&gt;&lt;code&gt;UnderMinIsrPartitionCount &amp;gt; 0&lt;/code&gt; → writes are being rejected &lt;b&gt;now&lt;/b&gt;&lt;/li&gt;
          &lt;li&gt;&lt;code&gt;OfflinePartitionsCount &amp;gt; 0&lt;/code&gt; → data unavailable &lt;b&gt;now&lt;/b&gt;&lt;/li&gt;
          &lt;li&gt;&lt;code&gt;ActiveControllerCount != 1&lt;/code&gt; across the cluster&lt;/li&gt;
          &lt;li&gt;Consumer lag &lt;b&gt;rising&lt;/b&gt; for N minutes (per group, not aggregate)&lt;/li&gt;
          &lt;li&gt;Disk &amp;gt; 75% on any broker — retention math needs revisiting before it's 95%&lt;/li&gt;
          &lt;li&gt;Rebalance rate above baseline outside deploy windows&lt;/li&gt;
        &lt;/ul&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub am&quot;&gt;Habits that prevent incidents&lt;/div&gt;
        &lt;div class=&quot;card am r r6&quot;&gt;&lt;ul&gt;
          &lt;li&gt;&lt;b&gt;Never auto-create topics in production.&lt;/b&gt; &lt;code&gt;auto.create.topics.enable=false&lt;/code&gt;. A typo in a producer shouldn't create a 1-partition, RF-1 topic that quietly becomes load-bearing.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Set explicit defaults&lt;/b&gt; for RF, &lt;code&gt;min.insync.replicas&lt;/code&gt; and retention at the cluster level so the lazy path is the safe path.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Rolling restarts, one broker at a time&lt;/b&gt;, waiting for &lt;code&gt;UnderReplicatedPartitions=0&lt;/code&gt; between each. Never two at once with RF=3.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Throttle every reassignment.&lt;/b&gt; Unthrottled rebalances have taken down more clusters than hardware has.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Own client versions.&lt;/b&gt; Old clients force broker-side format conversion; very old ones lack idempotence by default.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Practise a broker kill and a group offset reset&lt;/b&gt; in staging, with the runbook open, before you need either.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Quotas&lt;/b&gt; (&lt;code&gt;producer_byte_rate&lt;/code&gt;, &lt;code&gt;consumer_byte_rate&lt;/code&gt;, request percentage) on a multi-tenant cluster — one team's backfill shouldn't be everyone's incident.&lt;/li&gt;
        &lt;/ul&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 09d · RECAP / CLOSE --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s9d&quot; data-ch=&quot;9&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Close &lt;span class=&quot;num&quot;&gt;/ 09.4&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Ten sentences that&lt;br&gt;carry the whole talk.&lt;/h2&gt;
    &lt;div class=&quot;body-wrap grid-2&quot; style=&quot;margin-top:20px&quot;&gt;
      &lt;div&gt;
        &lt;ul class=&quot;feat tight&quot;&gt;
          &lt;li class=&quot;r r3&quot;&gt;&lt;b&gt;1.&lt;/b&gt; Kafka is a &lt;b&gt;durable, replayable, append-only log&lt;/b&gt; — storage that speaks pub/sub, not a queue that forgets.&lt;/li&gt;
          &lt;li class=&quot;r r3&quot;&gt;&lt;b&gt;2.&lt;/b&gt; The &lt;b&gt;partition&lt;/b&gt; is the unit of ordering, parallelism and storage. A topic itself has no order.&lt;/li&gt;
          &lt;li class=&quot;r r4&quot;&gt;&lt;b&gt;3.&lt;/b&gt; The &lt;b&gt;key&lt;/b&gt; buys per-entity ordering and decides load distribution — pick it deliberately, and expect skew.&lt;/li&gt;
          &lt;li class=&quot;r r4&quot;&gt;&lt;b&gt;4.&lt;/b&gt; Records are stored in &lt;b&gt;batches&lt;/b&gt;, in segment files, found via sparse indexes; performance comes from sequential IO, the page cache and zero-copy.&lt;/li&gt;
          &lt;li class=&quot;r r5&quot;&gt;&lt;b&gt;5.&lt;/b&gt; Durability comes from &lt;b&gt;replication&lt;/b&gt;, not fsync: &lt;code&gt;acks=all&lt;/code&gt; &lt;b&gt;plus&lt;/b&gt; &lt;code&gt;min.insync.replicas=2&lt;/code&gt;.&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;ul class=&quot;feat tight&quot;&gt;
          &lt;li class=&quot;r r5&quot;&gt;&lt;b&gt;6.&lt;/b&gt; Consumers &lt;b&gt;pull&lt;/b&gt; and own their offsets, which are themselves records in a compacted topic.&lt;/li&gt;
          &lt;li class=&quot;r r5&quot;&gt;&lt;b&gt;7.&lt;/b&gt; &lt;b&gt;Rebalancing&lt;/b&gt; is where most production pain lives — cooperative sticky, static membership, small polls.&lt;/li&gt;
          &lt;li class=&quot;r r6&quot;&gt;&lt;b&gt;8.&lt;/b&gt; The &lt;b&gt;high watermark&lt;/b&gt; is why replication lag shows up as consumer latency.&lt;/li&gt;
          &lt;li class=&quot;r r6&quot;&gt;&lt;b&gt;9.&lt;/b&gt; &lt;b&gt;At-least-once with idempotent handlers&lt;/b&gt; is the right default; exactly-once is real but scoped to Kafka→Kafka.&lt;/li&gt;
          &lt;li class=&quot;r r6&quot;&gt;&lt;b&gt;10.&lt;/b&gt; Kafka is &lt;b&gt;boringly reliable&lt;/b&gt; when you respect four numbers: RF, &lt;code&gt;min.insync.replicas&lt;/code&gt;, partition count, and retention.&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;lede r r6&quot; style=&quot;margin-top:30px;text-align:center;max-width:100%;color:var(--muted);font-size:clamp(15px,1.7vw,22px)&quot;&gt;
      &lt;span class=&quot;k-cyan&quot;&gt;Producers append. Brokers replicate. Consumers replay.&lt;/span&gt; &amp;nbsp;— that's Kafka.
    &lt;/p&gt;
    &lt;div class=&quot;pill-row r r6&quot; style=&quot;margin-top:26px;justify-content:center&quot;&gt;
      &lt;div class=&quot;pill&quot;&gt;&lt;b&gt;read&lt;/b&gt; Kafka: The Definitive Guide (2nd ed.)&lt;/div&gt;
      &lt;div class=&quot;pill&quot;&gt;&lt;b&gt;read&lt;/b&gt; &quot;The Log&quot; — Jay Kreps&lt;/div&gt;
      &lt;div class=&quot;pill&quot;&gt;&lt;b&gt;read&lt;/b&gt; Designing Data-Intensive Applications, ch. 11&lt;/div&gt;
      &lt;div class=&quot;pill&quot;&gt;&lt;b&gt;do&lt;/b&gt; kafka-producer-perf-test on your own payloads&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

&lt;/div&gt;

&lt;button class=&quot;notes-toggle&quot; id=&quot;notesToggle&quot;&gt;Notes · N&lt;/button&gt;
&lt;div class=&quot;hint&quot;&gt;Navigate &lt;kbd&gt;←&lt;/kbd&gt; &lt;kbd&gt;→&lt;/kbd&gt; · &lt;kbd&gt;Space&lt;/kbd&gt; · &lt;kbd&gt;N&lt;/kbd&gt; notes · &lt;kbd&gt;A&lt;/kbd&gt; agenda&lt;/div&gt;

&lt;aside class=&quot;notes&quot; id=&quot;notesPanel&quot;&gt;
  &lt;div class=&quot;nhead&quot;&gt;&lt;span id=&quot;notesCh&quot;&gt;—&lt;/span&gt;&lt;span id=&quot;notesPos&quot;&gt;—&lt;/span&gt;&lt;/div&gt;
  &lt;h5 id=&quot;notesTitle&quot;&gt;—&lt;/h5&gt;
  &lt;div class=&quot;nsub&quot; id=&quot;notesSub&quot;&gt;—&lt;/div&gt;
  &lt;ul id=&quot;notesList&quot;&gt;&lt;/ul&gt;
&lt;/aside&gt;

&lt;div class=&quot;agenda&quot; id=&quot;agenda&quot;&gt;
  &lt;h3&gt;Nine chapters · ~20 min each&lt;/h3&gt;
  &lt;div class=&quot;agenda-grid&quot; id=&quot;agendaGrid&quot;&gt;&lt;/div&gt;
  &lt;p class=&quot;lede&quot; style=&quot;margin-top:26px&quot;&gt;Click a chapter, or press &lt;b&gt;1–9&lt;/b&gt;. &lt;b&gt;Esc&lt;/b&gt; closes.&lt;/p&gt;
&lt;/div&gt;

&lt;div class=&quot;chrome&quot;&gt;
  &lt;div class=&quot;brand&quot;&gt;APACHE &lt;b&gt;KAFKA&lt;/b&gt; · how it works&lt;span class=&quot;ch-flag&quot; id=&quot;chFlag&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;rail&quot; id=&quot;rail&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;meta-right&quot;&gt;
    &lt;div class=&quot;counter&quot; id=&quot;counter&quot;&gt;&lt;/div&gt;
    &lt;button class=&quot;clock&quot; id=&quot;clock&quot; title=&quot;Click to start/pause the talk timer&quot;&gt;⏱ 00:00&lt;/button&gt;
    &lt;div class=&quot;nav&quot;&gt;
      &lt;button id=&quot;prev&quot;&gt;◂ Prev&lt;/button&gt;
      &lt;button id=&quot;next&quot;&gt;Next ▸&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
const NS=&quot;http://www.w3.org/2000/svg&quot;;
function el(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function tspanRows(parent,x,y,rows,cls,fill,dy){rows.forEach((t,i)=&gt;{const n=el('text',{x,y:y+i*(dy||14),class:cls||'lbl-sm'},parent);if(fill)n.setAttribute('fill',fill);n.textContent=t;});}

/* ============ CHAPTERS ============ */
const CHAPTERS=[
  {n:'01',t:'The Big Idea',d:'Why a log — and when not to use one'},
  {n:'02',t:'Architecture',d:'KRaft, broker internals, disk layout, sizing'},
  {n:'03',t:'Topics &amp; Partitions',d:'Sharding, keys, skew, retention, compaction'},
  {n:'04',t:'The Commit Log',d:'Record format, watermarks, offsets, why it is fast'},
  {n:'05',t:'Producers',d:'Batching, acks, idempotence, transactions, tuning'},
  {n:'06',t:'Consumers &amp; Groups',d:'Poll loop, group protocol, rebalancing, lag'},
  {n:'07',t:'Replication &amp; ISR',d:'Follower fetch, ISR, failover, multi-AZ, ops'},
  {n:'08',t:'Guarantees',d:'Delivery semantics, ordering, EOS, config profiles'},
  {n:'09',t:'The Whole Picture',d:'Fan-out, ecosystem, operating it, recap'}
];

/* ============ DECK NAV ============ */
const slides=[...document.querySelectorAll('.slide')];
const rail=document.getElementById('rail');
const progress=document.getElementById('progress');
const counter=document.getElementById('counter');
const chFlag=document.getElementById('chFlag');
let idx=0;

const chOf=s=&gt;parseInt(s.dataset.ch||'0',10);
const firstSlideOfCh={};
slides.forEach((s,i)=&gt;{const c=chOf(s);if(firstSlideOfCh[c]===undefined)firstSlideOfCh[c]=i;});

CHAPTERS.forEach((c,i)=&gt;{
  const b=document.createElement('button');
  b.title=c.n+' · '+c.t;
  b.onclick=()=&gt;go(firstSlideOfCh[i+1]);
  rail.appendChild(b);
});
const railBtns=[...rail.children];

/* agenda overlay */
const agenda=document.getElementById('agenda'), agendaGrid=document.getElementById('agendaGrid');
CHAPTERS.forEach((c,i)=&gt;{
  const d=document.createElement('div');
  d.className='agenda-card';
  d.innerHTML='&lt;div class=&quot;an&quot;&gt;'+c.n+'&lt;/div&gt;&lt;div class=&quot;at&quot;&gt;'+c.t+'&lt;/div&gt;&lt;div class=&quot;ad&quot;&gt;'+c.d+'&lt;/div&gt;';
  d.onclick=()=&gt;{agenda.classList.remove('on');go(firstSlideOfCh[i+1]);};
  agendaGrid.appendChild(d);
});

/* ---- auto-fit: wrap each slide's content and scale it down if it would overflow ---- */
slides.forEach(s=&gt;{
  const f=document.createElement('div');
  f.className='fit';
  while(s.firstChild) f.appendChild(s.firstChild);
  s.appendChild(f);
});
const MIN_SCALE=0.5;   // floor only for pathologically short windows; 1080p needs ~0.93 worst case
function fitSlide(s){
  const f=s.querySelector(':scope &gt; .fit');
  if(!f)return;
  f.style.transform='none';f.style.width='100%';
  const cs=getComputedStyle(s);
  const avail=s.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  if(f.scrollHeight&lt;=avail+1){
    // comfortably short: centre it vertically instead of leaving dead space at the bottom
    s.style.justifyContent='center';
    return;
  }
  // needs scaling — top-align, because we scale from the top-left corner
  s.style.justifyContent='flex-start';
  // Scaling down also widens the box, which reflows text and reduces height again,
  // so iterate until the scaled height fits rather than guessing once.
  let k=1;
  for(let i=0;i&lt;10;i++){
    f.style.width=(100/k)+'%';
    const scaled=f.scrollHeight*k;
    if(scaled&lt;=avail) break;
    const next=k*(avail/scaled)*0.99;
    if(next&lt;=MIN_SCALE){k=MIN_SCALE;f.style.width=(100/k)+'%';break;}
    k=next;
  }
  f.style.width=(100/k)+'%';
  f.style.transform='scale('+k+')';
}
function fitAll(){slides.forEach(fitSlide);}
let fitPending=null;
window.addEventListener('resize',()=&gt;{clearTimeout(fitPending);fitPending=setTimeout(fitAll,150);});

function go(n){
  if(n===undefined||n===null||isNaN(n))return;
  n=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=&gt;{
    s.classList.remove('active','prev');
    if(i&lt;n) s.classList.add('prev');
  });
  idx=n;
  const cur=slides[n];
  cur.classList.add('active');
  const ch=chOf(cur);
  railBtns.forEach((b,i)=&gt;{b.classList.toggle('on',i===ch-1);b.classList.toggle('done',i&lt;ch-1);});
  progress.style.width=((n)/(slides.length-1)*100)+'%';
  counter.innerHTML='&lt;b&gt;'+(n+1)+'&lt;/b&gt; / '+slides.length;
  chFlag.innerHTML = ch===0 ? '' : 'Ch &lt;b&gt;'+CHAPTERS[ch-1].n+'&lt;/b&gt; · '+CHAPTERS[ch-1].t;
  // restart the r-animations by reflow
  cur.querySelectorAll('.r').forEach(x=&gt;{x.style.animation='none';void x.offsetWidth;x.style.animation='';});
  fitSlide(cur);
  stopAllScenes(cur.id);
  if(scenes[cur.id]) scenes[cur.id]();
  renderNotes(cur,n,ch);
  location.hash=cur.id;
}
document.getElementById('next').onclick=()=&gt;go(idx+1);
document.getElementById('prev').onclick=()=&gt;go(idx-1);
window.addEventListener('keydown',e=&gt;{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  const k=e.key;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){e.preventDefault();go(idx+1);}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();go(idx-1);}
  else if(k==='Home'){e.preventDefault();go(0);}
  else if(k==='End'){e.preventDefault();go(slides.length-1);}
  else if(k==='n'||k==='N'){toggleNotes();}
  else if(k==='a'||k==='A'){agenda.classList.toggle('on');}
  else if(k==='t'||k==='T'){toggleClock();}
  else if(k==='Escape'){agenda.classList.remove('on');}
  else if(/^[1-9]$/.test(k)){e.preventDefault();agenda.classList.remove('on');go(firstSlideOfCh[parseInt(k,10)]);}
});
agenda.onclick=ev=&gt;{if(ev.target===agenda)agenda.classList.remove('on');};
// support deep links / manual hash edits without a reload
window.addEventListener('hashchange',()=&gt;{
  const t=location.hash&amp;&amp;document.querySelector(location.hash);
  const i=t?slides.indexOf(t):-1;
  if(i&gt;-1&amp;&amp;i!==idx)go(i);
});

/* ============ SCENES (keyed by slide id) ============ */
const scenes={};
const sceneStops=[];               // [{id, stop()}]
function onStop(id,fn){sceneStops.push({id,fn});}
function stopAllScenes(keepId){
  sceneStops.forEach(s=&gt;{if(s.id!==keepId){try{s.fn();}catch(e){}}});
}

/* ============ PRESENTER NOTES ============ */
const notesPanel=document.getElementById('notesPanel');
function toggleNotes(){notesPanel.classList.toggle('on');document.body.classList.toggle('notes-on',notesPanel.classList.contains('on'));}
document.getElementById('notesToggle').onclick=toggleNotes;
function renderNotes(slide,n,ch){
  const d=NOTES[slide.id]||{};
  document.getElementById('notesCh').textContent = ch===0?'Opening':'Chapter '+CHAPTERS[ch-1].n;
  document.getElementById('notesPos').textContent = 'slide '+(n+1)+'/'+slides.length;
  document.getElementById('notesTitle').textContent = d.title||slide.querySelector('h2')?.textContent.replace(/\s+/g,' ').trim()||'—';
  document.getElementById('notesSub').textContent = d.sub||'';
  const ul=document.getElementById('notesList');
  ul.innerHTML='';
  (d.points||['(no notes for this slide yet)']).forEach(p=&gt;{
    const li=document.createElement('li');li.innerHTML=p;ul.appendChild(li);
  });

/* ---- 03.3 · key skew ---- */
(function(){
  const svg=document.getElementById('skewsvg');

  let timer=null,mode=0,counts=[0,0,0,0,0,0];
  const colors=['var(--cyan)','var(--amber)','var(--violet)','var(--cyan)','var(--amber)','var(--violet)'];
  function pick(){
    if(mode===0) return Math.floor(Math.random()*6);
    // 65% of traffic to one whale key → partition 2
    return Math.random()&lt;.65 ? 2 : Math.floor(Math.random()*6);
  }
  function build(){
    // seed with an even baseline so the &quot;balanced&quot; case reads as balanced immediately
    clearInterval(timer);counts=[20,20,20,20,20,20];draw();
    timer=setInterval(()=&gt;{counts[pick()]++;draw();},110);
    btn.textContent = mode===0 ? 'Introduce a whale key ▸' : '◂ Back to even keys';
    btn.className = mode===0 ? 'stage-btn rd' : 'stage-btn';
  }
  function draw(){
    svg.innerHTML='';
    const total=counts.reduce((a,b)=&gt;a+b,0)||1;
    const max=Math.max(...counts,1);
    el('text',{x:330,y:24,'text-anchor':'middle',class:'lbl-sm',fill:mode?'var(--red)':'var(--cyan)'},svg)
      .textContent = mode ? 'SKEWED · one tenant dominates the key space' : 'BALANCED · high-cardinality keys spread evenly';
    counts.forEach((c,i)=&gt;{
      const x=50+i*100, h=Math.round(210*c/max), pct=Math.round(100*c/total);

      el('rect',{x,y:270-h,width:70,height:h,rx:8,fill:hot?'var(--red)':colors[i],opacity:hot?.75:.45},svg);
      el('text',{x:x+35,y:292,'text-anchor':'middle',class:'lbl-sm',fill:hot?'var(--red)':colors[i]},svg).textContent='P'+i;
      el('text',{x:x+35,y:310,'text-anchor':'middle',class:'lbl-sm'},svg).textContent=pct+'%';
      // consumer utilisation: an even share (100/6 ≈ 17%) maps to a comfortable ~60%

      el('rect',{x,y:330,width:70*util/100,height:12,rx:3,fill:util&gt;90?'var(--red)':'var(--cyan-dim)',opacity:.8},svg);
      el('text',{x:x+35,y:360,'text-anchor':'middle','font-size':'8.5',class:'lbl-sm',fill:util&gt;90?'var(--red)':'var(--muted)'},svg)

    });
