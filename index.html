          &lt;li&gt;&lt;b&gt;End-to-end latency rises&lt;/b&gt;: fewer records per batch per partition means less amortization.&lt;/li&gt;
          &lt;li&gt;Rebalances, leader elections and controller failovers all scale with partition count.&lt;/li&gt;
        &lt;/ul&gt;&lt;/div&gt;
        &lt;div class=&quot;callout good r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✓&lt;/span&gt;&lt;div&gt;&lt;b&gt;Practical default:&lt;/b&gt; a small multiple of your broker count (6, 12, 24) for ordinary topics; size explicitly only for topics you have measured. Uniform is easier to operate than clever.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 03c · KEYS &amp; SKEW --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s3c&quot; data-ch=&quot;3&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Distribution &lt;span class=&quot;num&quot;&gt;/ 03.3&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Keys, hashing,&lt;br&gt;and &lt;span class=&quot;k-red&quot;&gt;hot partitions&lt;/span&gt;.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;The key does two jobs at once: it buys you &lt;b&gt;per-entity ordering&lt;/b&gt;, and it decides &lt;b&gt;load distribution&lt;/b&gt;. When those two goals conflict, you get a hot partition — one consumer at 100% while five idle.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-52&quot;&gt;
      &lt;div class=&quot;stage mid r r4&quot; id=&quot;stage-skew&quot;&gt;
        &lt;span class=&quot;stage-label&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;key distribution — balanced vs skewed&lt;/span&gt;
        &lt;svg viewBox=&quot;0 0 640 400&quot; id=&quot;skewsvg&quot;&gt;&lt;/svg&gt;
        &lt;button class=&quot;stage-btn rd&quot; id=&quot;skewBtn&quot;&gt;Introduce a whale key ▸&lt;/button&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub&quot;&gt;How routing actually works&lt;/div&gt;
        &lt;div class=&quot;card r r5&quot;&gt;&lt;ul&gt;
          &lt;li&gt;&lt;b&gt;Key present:&lt;/b&gt; &lt;code&gt;murmur2(keyBytes) % numPartitions&lt;/code&gt; — deterministic, language-independent, and identical across all official clients. Same key → same partition, forever (for a fixed partition count).&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Key null:&lt;/b&gt; the modern default partitioner is &lt;b&gt;sticky&lt;/b&gt; — it fills one partition's batch, sends it, then switches. That's better than round-robin because it produces &lt;b&gt;fuller batches&lt;/b&gt; and therefore lower latency and higher throughput.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Explicit partition:&lt;/b&gt; you can pass one to &lt;code&gt;send()&lt;/code&gt; and bypass all of it. Useful, and easy to regret.&lt;/li&gt;
        &lt;/ul&gt;&lt;/div&gt;
        &lt;div class=&quot;sub rd&quot; style=&quot;margin-top:16px&quot;&gt;Fixing skew&lt;/div&gt;
        &lt;div class=&quot;grid-2 r r6&quot; style=&quot;gap:12px&quot;&gt;
          &lt;div class=&quot;card rd&quot;&gt;&lt;h4&gt;Composite key&lt;/h4&gt;&lt;p&gt;&lt;code&gt;tenant:bucket&lt;/code&gt; where bucket = &lt;code&gt;hash(orderId)%16&lt;/code&gt;. Spreads the whale, keeps ordering &lt;b&gt;within&lt;/b&gt; a bucket. You must be able to live with that weaker guarantee.&lt;/p&gt;&lt;/div&gt;
          &lt;div class=&quot;card rd&quot;&gt;&lt;h4&gt;Separate topic&lt;/h4&gt;&lt;p&gt;Route the top-N tenants to their own topic with its own partition count and consumer group. Isolation beats cleverness.&lt;/p&gt;&lt;/div&gt;
          &lt;div class=&quot;card rd&quot;&gt;&lt;h4&gt;Two-stage&lt;/h4&gt;&lt;p&gt;Ingest unkeyed for even spread, then re-key into a second topic once the heavy work is done.&lt;/p&gt;&lt;/div&gt;
          &lt;div class=&quot;card rd&quot;&gt;&lt;h4&gt;Custom partitioner&lt;/h4&gt;&lt;p&gt;Implement &lt;code&gt;Partitioner&lt;/code&gt; for known hot keys. Remember: &lt;b&gt;consumers don't know&lt;/b&gt; your scheme, so document it or it becomes tribal knowledge.&lt;/p&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;callout warn r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✕&lt;/span&gt;&lt;div&gt;Diagnose before you redesign: &lt;code&gt;kafka-run-class ... GetOffsetShell&lt;/code&gt; per partition, or per-partition consumer lag. If one partition holds 60% of the records, no amount of consumer scaling helps.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 03d · RETENTION &amp; COMPACTION --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s3d&quot; data-ch=&quot;3&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Cleanup Policy &lt;span class=&quot;num&quot;&gt;/ 03.4&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Delete vs compact:&lt;br&gt;two different topics.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;&lt;code&gt;cleanup.policy=delete&lt;/code&gt; keeps a &lt;b&gt;window of history&lt;/b&gt;. &lt;code&gt;cleanup.policy=compact&lt;/code&gt; keeps the &lt;b&gt;latest value per key&lt;/b&gt;, forever. The second one turns a topic into a durable, replayable table — and it's how Kafka Streams state, Connect offsets and &lt;code&gt;__consumer_offsets&lt;/code&gt; all work.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-52&quot;&gt;
      &lt;div class=&quot;stage mid r r4&quot; id=&quot;stage-compact&quot;&gt;
        &lt;span class=&quot;stage-label&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;log compaction — same log, keys deduped&lt;/span&gt;
        &lt;svg viewBox=&quot;0 0 640 400&quot; id=&quot;compactsvg&quot;&gt;&lt;/svg&gt;
        &lt;button class=&quot;stage-btn&quot; id=&quot;compactBtn&quot;&gt;Run the cleaner ▸&lt;/button&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;tbl-wrap r r5&quot;&gt;
          &lt;table class=&quot;tbl compact&quot;&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;delete&lt;/th&gt;&lt;th class=&quot;k-cyan&quot;&gt;compact&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td&gt;&lt;b&gt;Keeps&lt;/b&gt;&lt;/td&gt;&lt;td&gt;All records inside the window&lt;/td&gt;&lt;td&gt;Latest record &lt;b&gt;per key&lt;/b&gt;, no time limit&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;b&gt;Config&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;retention.ms&lt;/code&gt; / &lt;code&gt;retention.bytes&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;min.cleanable.dirty.ratio&lt;/code&gt;, &lt;code&gt;min.compaction.lag.ms&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;b&gt;Deletion&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Whole segments age out&lt;/td&gt;&lt;td&gt;&lt;b&gt;Tombstone&lt;/b&gt;: key with &lt;code&gt;null&lt;/code&gt; value&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;b&gt;Replay gives&lt;/b&gt;&lt;/td&gt;&lt;td&gt;A period of history&lt;/td&gt;&lt;td&gt;A full &lt;b&gt;snapshot of current state&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;b&gt;Offsets&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Contiguous-ish&lt;/td&gt;&lt;td&gt;&lt;b&gt;Gaps&lt;/b&gt; — compacted offsets vanish&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;b&gt;Use for&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Events, telemetry, clickstream&lt;/td&gt;&lt;td&gt;CDC, config, entity state, changelogs&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;
        &lt;div class=&quot;grid-2 r r6&quot; style=&quot;margin-top:12px;gap:12px&quot;&gt;
          &lt;div class=&quot;callout good&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✓&lt;/span&gt;&lt;div&gt;You can set &lt;b&gt;both&lt;/b&gt;: &lt;code&gt;compact,delete&lt;/code&gt; — latest value per key, but still drop anything older than N days.&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;callout warn&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✕&lt;/span&gt;&lt;div&gt;Compaction is &lt;b&gt;not&lt;/b&gt; immediate and never touches the &lt;b&gt;active segment&lt;/b&gt;. Duplicate keys will be visible for a while — consumers must be idempotent regardless.&lt;/div&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;callout amb r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;▲&lt;/span&gt;&lt;div&gt;Tombstones survive for &lt;code&gt;delete.retention.ms&lt;/code&gt; (default 24h) so that every consumer gets a chance to observe the deletion. Consumer offline for two days = missed delete = phantom row in a derived store. This is a real, common data bug.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 03e · LIVING WITH PARTITIONS --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s3e&quot; data-ch=&quot;3&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Operations &lt;span class=&quot;num&quot;&gt;/ 03.5&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Changing your mind later.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;Partition count is a one-way ratchet, and the reassignment tools move real bytes across the network. Here's what each operation actually costs.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-2&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub am&quot;&gt;Adding partitions&lt;/div&gt;
        &lt;pre class=&quot;code r r4&quot;&gt;&lt;span class=&quot;c&quot;&gt;# allowed — but read the consequences below&lt;/span&gt;
kafka-topics.sh --alter --topic orders \
  --partitions &lt;span class=&quot;v&quot;&gt;24&lt;/span&gt; --bootstrap-server ...

&lt;span class=&quot;c&quot;&gt;# 12 → 24 partitions means:&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;#  hash(k) % 12  ≠  hash(k) % 24&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;#  → future records for key K may land elsewhere&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;#  → K's history is split across two partitions&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;#  → per-key ordering is BROKEN across the change&lt;/span&gt;

&lt;span class=&quot;c&quot;&gt;# existing data is never moved or rehashed.&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;# --partitions 6 (fewer)? rejected outright.&lt;/span&gt;&lt;/pre&gt;
        &lt;div class=&quot;callout warn r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✕&lt;/span&gt;&lt;div&gt;If per-key ordering is load-bearing (state machines, CDC, aggregates), &lt;b&gt;do not&lt;/b&gt; add partitions to a live topic. Create &lt;code&gt;orders.v2&lt;/code&gt; with the new count, dual-write or replay, and cut consumers over deliberately.&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;callout note r r6&quot; style=&quot;margin-top:10px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;◆&lt;/span&gt;&lt;div&gt;Compacted topics are the sharpest case: after a resize, two partitions can hold different &quot;latest&quot; values for the same key, and compaction won't reconcile them because it works per partition.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub&quot;&gt;Moving replicas around&lt;/div&gt;
        &lt;div class=&quot;steps r r5&quot; style=&quot;flex-direction:column&quot;&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;REASSIGN&lt;/span&gt;&lt;code&gt;kafka-reassign-partitions.sh&lt;/code&gt; moves replicas between brokers. New followers replicate from scratch — &lt;b&gt;this is a bulk data copy&lt;/b&gt;, so always set &lt;code&gt;--throttle&lt;/code&gt; or you'll starve live traffic.&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;PREFERRED LEADER&lt;/span&gt;Leadership drifts after failures, so one broker ends up leading everything. &lt;code&gt;auto.leader.rebalance.enable&lt;/code&gt; (or the manual election tool) restores balance. Watch &lt;code&gt;LeaderCount&lt;/code&gt; per broker.&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;ADD A BROKER&lt;/span&gt;Nothing moves automatically. A new broker is idle until you reassign partitions onto it — the single most common &quot;why is the new node doing nothing?&quot; surprise.&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;AUTOMATE IT&lt;/span&gt;Cruise Control (or your vendor's balancer) continuously rebalances by disk/network/leader skew. Worth adopting before you have 30 brokers, not after.&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;callout good r r6&quot; style=&quot;margin-top:14px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✓&lt;/span&gt;&lt;div&gt;&lt;b&gt;Design guidance:&lt;/b&gt; pick partition counts for a 2–3× growth horizon and make them uniform. The cost of 24 partitions when you needed 12 is small and gradual; the cost of resizing a keyed topic in production is a migration project.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- ============ CHAPTER 04 ============ --&gt;
  &lt;section class=&quot;slide chapter&quot; id=&quot;ch4&quot; data-ch=&quot;4&quot;&gt;
    &lt;div class=&quot;ch-ghost&quot;&gt;04&lt;/div&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Chapter 04 &lt;span class=&quot;num&quot;&gt;/ ~20 min&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;ch-title r r2&quot;&gt;The commit log,&lt;br&gt;byte by &lt;span class=&quot;k-cyan&quot;&gt;byte&lt;/span&gt;.&lt;/h2&gt;
    &lt;p class=&quot;ch-q r r3&quot;&gt;The question this chapter answers: &lt;b&gt;what is a &quot;message&quot; physically&lt;/b&gt;, which offsets does the system track (there are more than you think), where do consumer offsets live, and why is a JVM application on commodity disks this fast?&lt;/p&gt;
    &lt;div class=&quot;ch-list&quot;&gt;
      &lt;div class=&quot;ch-item r r4&quot;&gt;&lt;b&gt;1 · Offsets&lt;/b&gt;Append-only, monotonic, and a read is just a pointer move.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r4&quot;&gt;&lt;b&gt;2 · Record batches&lt;/b&gt;The v2 format: what's in the header and why batching is the unit.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r5&quot;&gt;&lt;b&gt;3 · Four watermarks&lt;/b&gt;Log start, high watermark, log-end, last stable offset.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r5&quot;&gt;&lt;b&gt;4 · __consumer_offsets&lt;/b&gt;Offsets are just records in a compacted topic.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r6&quot;&gt;&lt;b&gt;5 · Why it's fast&lt;/b&gt;Sequential IO, page cache, zero-copy, batch amortization.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ch-budget r r6&quot;&gt;Time budget &lt;b&gt;≈20 min&lt;/b&gt; · 5 slides · demo: watermarks&lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 04a · OFFSETS (original) --&gt;
  &lt;section class=&quot;slide&quot; id=&quot;s4a&quot; data-ch=&quot;4&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Anatomy of a Partition &lt;span class=&quot;num&quot;&gt;/ 04.1&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;split&quot;&gt;
      &lt;div&gt;
        &lt;h2 class=&quot;r r2&quot;&gt;Offsets &amp;amp;&lt;br&gt;the commit log.&lt;/h2&gt;
        &lt;p class=&quot;lede r r3&quot;&gt;Every record in a partition gets a monotonically increasing &lt;b class=&quot;k-amber&quot;&gt;offset&lt;/b&gt;. Writes only ever &lt;b&gt;append&lt;/b&gt; to the tail — nothing is edited in place.&lt;/p&gt;
        &lt;ul class=&quot;feat&quot;&gt;
          &lt;li class=&quot;r r4&quot;&gt;Producers append at the &lt;b&gt;log-end offset&lt;/b&gt;.&lt;/li&gt;
          &lt;li class=&quot;r r5&quot;&gt;Consumers track their own &lt;b&gt;committed offset&lt;/b&gt;.&lt;/li&gt;
          &lt;li class=&quot;r r6&quot;&gt;Reading is just moving a pointer — &lt;b&gt;replay anytime&lt;/b&gt;.&lt;/li&gt;
        &lt;/ul&gt;
        &lt;div class=&quot;tagrow r r6&quot;&gt;
          &lt;div class=&quot;chip cy&quot;&gt;&lt;b&gt;offset&lt;/b&gt; position in one partition&lt;/div&gt;
          &lt;div class=&quot;chip&quot;&gt;&lt;b&gt;not&lt;/b&gt; a global sequence number&lt;/div&gt;
          &lt;div class=&quot;chip vi&quot;&gt;&lt;b&gt;stable&lt;/b&gt; never reassigned&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stage r r4&quot; id=&quot;stage-log&quot;&gt;
        &lt;span class=&quot;stage-label&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;partition-0.log&lt;/span&gt;
        &lt;svg viewBox=&quot;0 0 640 480&quot; id=&quot;logsvg&quot;&gt;&lt;/svg&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 04b · RECORD BATCH ANATOMY --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s4b&quot; data-ch=&quot;4&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Wire Format &lt;span class=&quot;num&quot;&gt;/ 04.2&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;What a &quot;message&quot;&lt;br&gt;really is.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;Kafka's unit on the wire and on disk is not a record — it's a &lt;b&gt;record batch&lt;/b&gt;. One batch header amortized over many records is where a surprising amount of the performance comes from, and it's also where idempotence and transactions hide.&lt;/p&gt;
    &lt;div class=&quot;body-wrap&quot;&gt;
      &lt;div class=&quot;grid-2&quot;&gt;
        &lt;div&gt;
          &lt;div class=&quot;sub am&quot;&gt;Batch header — once per batch&lt;/div&gt;
          &lt;div class=&quot;bytemap r r4&quot;&gt;
            &lt;div class=&quot;bfield cy&quot;&gt;&lt;b&gt;baseOffset&lt;/b&gt;int64 · first offset&lt;/div&gt;
            &lt;div class=&quot;bfield&quot;&gt;&lt;b&gt;batchLength&lt;/b&gt;int32&lt;/div&gt;
            &lt;div class=&quot;bfield vi&quot;&gt;&lt;b&gt;partitionLeaderEpoch&lt;/b&gt;int32 · truncation safety&lt;/div&gt;
            &lt;div class=&quot;bfield&quot;&gt;&lt;b&gt;magic&lt;/b&gt;int8 · =2&lt;/div&gt;
            &lt;div class=&quot;bfield&quot;&gt;&lt;b&gt;crc32c&lt;/b&gt;covers the batch&lt;/div&gt;
            &lt;div class=&quot;bfield am&quot;&gt;&lt;b&gt;attributes&lt;/b&gt;compression · timestampType · isTransactional · isControl&lt;/div&gt;
            &lt;div class=&quot;bfield&quot;&gt;&lt;b&gt;lastOffsetDelta&lt;/b&gt;int32&lt;/div&gt;
            &lt;div class=&quot;bfield&quot;&gt;&lt;b&gt;baseTimestamp&lt;/b&gt;int64&lt;/div&gt;
            &lt;div class=&quot;bfield&quot;&gt;&lt;b&gt;maxTimestamp&lt;/b&gt;int64&lt;/div&gt;
            &lt;div class=&quot;bfield rd&quot;&gt;&lt;b&gt;producerId&lt;/b&gt;int64 · PID&lt;/div&gt;
            &lt;div class=&quot;bfield rd&quot;&gt;&lt;b&gt;producerEpoch&lt;/b&gt;int16 · fencing&lt;/div&gt;
            &lt;div class=&quot;bfield rd&quot;&gt;&lt;b&gt;baseSequence&lt;/b&gt;int32 · dedup&lt;/div&gt;
            &lt;div class=&quot;bfield&quot;&gt;&lt;b&gt;recordCount&lt;/b&gt;int32&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;callout note r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;◆&lt;/span&gt;&lt;div&gt;The three red fields are the &lt;b&gt;entire mechanism&lt;/b&gt; behind idempotent producers and transactions. They live in the log format itself — which is why exactly-once needs no extra store.&lt;/div&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;div class=&quot;sub&quot;&gt;Each record — deltas, not absolutes&lt;/div&gt;
          &lt;div class=&quot;bytemap r r5&quot;&gt;
            &lt;div class=&quot;bfield&quot;&gt;&lt;b&gt;length&lt;/b&gt;varint&lt;/div&gt;
            &lt;div class=&quot;bfield&quot;&gt;&lt;b&gt;attributes&lt;/b&gt;int8&lt;/div&gt;
            &lt;div class=&quot;bfield cy&quot;&gt;&lt;b&gt;timestampDelta&lt;/b&gt;varlong · vs baseTimestamp&lt;/div&gt;
            &lt;div class=&quot;bfield cy&quot;&gt;&lt;b&gt;offsetDelta&lt;/b&gt;varint · vs baseOffset&lt;/div&gt;
            &lt;div class=&quot;bfield am&quot;&gt;&lt;b&gt;keyLength + key&lt;/b&gt;varint · nullable&lt;/div&gt;
            &lt;div class=&quot;bfield am&quot;&gt;&lt;b&gt;valueLength + value&lt;/b&gt;varint · nullable = tombstone&lt;/div&gt;
            &lt;div class=&quot;bfield vi&quot;&gt;&lt;b&gt;headers&lt;/b&gt;k/v array · tracing, schema id, type&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;grid-2 r r6&quot; style=&quot;margin-top:14px;gap:12px&quot;&gt;
            &lt;div class=&quot;card cy&quot;&gt;&lt;h4&gt;Varints + deltas&lt;/h4&gt;&lt;p&gt;Timestamps and offsets are stored as small deltas from the batch base, so a record costs a handful of bytes of overhead rather than 20+.&lt;/p&gt;&lt;/div&gt;
            &lt;div class=&quot;card am&quot;&gt;&lt;h4&gt;Compression is per batch&lt;/h4&gt;&lt;p&gt;The whole batch body is compressed as one unit, so &lt;b&gt;similar records compress together&lt;/b&gt; — 5–10× on JSON is normal. Bigger batches compress better.&lt;/p&gt;&lt;/div&gt;
            &lt;div class=&quot;card vi&quot;&gt;&lt;h4&gt;Headers&lt;/h4&gt;&lt;p&gt;Metadata that isn't payload: trace ids, schema version, event type, tenant. Use them instead of stuffing envelope fields into the value.&lt;/p&gt;&lt;/div&gt;
            &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Broker passthrough&lt;/h4&gt;&lt;p&gt;Normally the broker never decompresses: it stores the batch as received and streams the same bytes to consumers. Decompression happens at the client.&lt;/p&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;callout amb r r6&quot; style=&quot;margin-top:16px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;▲&lt;/span&gt;&lt;div&gt;&lt;b&gt;The exception that costs CPU:&lt;/b&gt; if the producer's timestamp type is broker-assigned (&lt;code&gt;log.message.timestamp.type=LogAppendTime&lt;/code&gt;), or a client sends an older format version, the broker must decompress, rewrite and recompress every batch. That single config turns a zero-copy broker into a CPU-bound one.&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 04c · WATERMARKS --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s4c&quot; data-ch=&quot;4&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Visibility &lt;span class=&quot;num&quot;&gt;/ 04.3&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Four offsets&lt;br&gt;that all matter.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;&quot;The offset&quot; is ambiguous. A partition tracks several, and the gaps between them explain latency, lag, data loss windows and read_committed behaviour.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-52&quot;&gt;
      &lt;div class=&quot;stage mid r r4&quot; id=&quot;stage-wm&quot;&gt;
        &lt;span class=&quot;stage-label&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;log start · HW · LEO · LSO&lt;/span&gt;
        &lt;svg viewBox=&quot;0 0 660 400&quot; id=&quot;wmsvg&quot;&gt;&lt;/svg&gt;
        &lt;button class=&quot;stage-btn&quot; id=&quot;wmBtn&quot;&gt;Advance the log ▸&lt;/button&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;tbl-wrap r r5&quot;&gt;
          &lt;table class=&quot;tbl compact&quot;&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Marker&lt;/th&gt;&lt;th&gt;Means&lt;/th&gt;&lt;th&gt;Why you care&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td&gt;&lt;b class=&quot;k-muted&quot;&gt;Log start offset&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Oldest surviving record&lt;/td&gt;&lt;td&gt;Retention/compaction moved it. Reading from an offset below it → &lt;code&gt;OffsetOutOfRange&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;b class=&quot;k-amber&quot;&gt;LEO&lt;/b&gt;&lt;br&gt;log-end offset&lt;/td&gt;&lt;td&gt;Next offset to be written on &lt;b&gt;this&lt;/b&gt; replica&lt;/td&gt;&lt;td&gt;Leader LEO − follower LEO = &lt;b&gt;replica lag&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;b class=&quot;k-cyan&quot;&gt;High watermark&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Highest offset replicated to &lt;b&gt;all in-sync replicas&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;Consumers cannot read past it.&lt;/b&gt; HW→LEO gap is the durability/latency window&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;b class=&quot;k-violet&quot;&gt;LSO&lt;/b&gt;&lt;br&gt;last stable offset&lt;/td&gt;&lt;td&gt;First offset of the oldest &lt;b&gt;open transaction&lt;/b&gt;&lt;/td&gt;&lt;td&gt;With &lt;code&gt;read_committed&lt;/code&gt;, consumption stops here — an abandoned transaction stalls readers&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;b&gt;Committed offset&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Where a consumer &lt;b&gt;group&lt;/b&gt; says it got to&lt;/td&gt;&lt;td&gt;Stored in &lt;code&gt;__consumer_offsets&lt;/code&gt;, not on the partition. Lag = LEO − committed&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;
        &lt;div class=&quot;grid-2 r r6&quot; style=&quot;margin-top:12px;gap:12px&quot;&gt;
          &lt;div class=&quot;callout good&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✓&lt;/span&gt;&lt;div&gt;&lt;b&gt;Why the HW exists:&lt;/b&gt; if consumers could read un-replicated records, a leader failure would make already-delivered data disappear. The HW is what makes reads monotonic across failover.&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;callout warn&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✕&lt;/span&gt;&lt;div&gt;&lt;b&gt;Consequence:&lt;/b&gt; a record isn't visible until replicated. Under-replicated partitions therefore show up as &lt;b&gt;consumer latency&lt;/b&gt;, not just as a replication alarm.&lt;/div&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 04d · __consumer_offsets --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s4d&quot; data-ch=&quot;4&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Where State Lives &lt;span class=&quot;num&quot;&gt;/ 04.4&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Consumer offsets are&lt;br&gt;just… more records.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;There is no offset database. A commit is a &lt;b&gt;produce&lt;/b&gt; to an internal compacted topic, which is a great example of Kafka eating its own dog food — and it explains several otherwise-baffling behaviours.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-2&quot;&gt;
      &lt;div&gt;
        &lt;pre class=&quot;code r r4&quot;&gt;&lt;span class=&quot;c&quot;&gt;# the internal topic&lt;/span&gt;
&lt;span class=&quot;k&quot;&gt;__consumer_offsets&lt;/span&gt;
  partitions = &lt;span class=&quot;v&quot;&gt;50&lt;/span&gt;        &lt;span class=&quot;c&quot;&gt;offsets.topic.num.partitions&lt;/span&gt;
  cleanup.policy = &lt;span class=&quot;v&quot;&gt;compact&lt;/span&gt;
  replication.factor = &lt;span class=&quot;v&quot;&gt;3&lt;/span&gt;  &lt;span class=&quot;c&quot;&gt;← check this on dev clusters!&lt;/span&gt;

&lt;span class=&quot;c&quot;&gt;# a commit record&lt;/span&gt;
key   = (&lt;span class=&quot;s&quot;&gt;groupId&lt;/span&gt;, &lt;span class=&quot;s&quot;&gt;topic&lt;/span&gt;, &lt;span class=&quot;s&quot;&gt;partition&lt;/span&gt;)
value = (&lt;span class=&quot;v&quot;&gt;offset&lt;/span&gt;, leaderEpoch, metadata, commitTimestamp)

&lt;span class=&quot;c&quot;&gt;# which broker coordinates a group?&lt;/span&gt;
partition = &lt;span class=&quot;f&quot;&gt;abs&lt;/span&gt;(&lt;span class=&quot;f&quot;&gt;hash&lt;/span&gt;(groupId)) % 50
&lt;span class=&quot;k&quot;&gt;group coordinator&lt;/span&gt; = the LEADER of that partition

&lt;span class=&quot;c&quot;&gt;# so: FindCoordinator → that broker owns the group,&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;# its membership, and its offset commits.&lt;/span&gt;&lt;/pre&gt;
        &lt;div class=&quot;callout note r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;◆&lt;/span&gt;&lt;div&gt;Because the key is &lt;code&gt;(group, topic, partition)&lt;/code&gt;, compaction keeps exactly the latest committed offset per assignment — the whole &quot;offset store&quot; is emergent behaviour of log compaction.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub am&quot;&gt;What this explains&lt;/div&gt;
        &lt;div class=&quot;card am r r5&quot;&gt;&lt;ul&gt;
          &lt;li&gt;&lt;b&gt;Groups vanish after a while.&lt;/b&gt; &lt;code&gt;offsets.retention.minutes&lt;/code&gt; (7 days by default) expires the offsets of an &lt;b&gt;inactive&lt;/b&gt; group. Restart a weekly job after a long break and it resets per &lt;code&gt;auto.offset.reset&lt;/code&gt; — a classic Monday-morning duplicate storm.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Committing has a cost.&lt;/b&gt; Every commit is a produce+replicate. Committing per message is measurably slow; commit per batch/poll.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Coordinator moves.&lt;/b&gt; Lose the broker that leads that partition and the group briefly re-discovers its coordinator — visible as a short rebalance/pause.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;RF matters.&lt;/b&gt; A single-replica &lt;code&gt;__consumer_offsets&lt;/code&gt; (common in quick-start setups) means one broker loss rewinds every consumer group.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;You can read it.&lt;/b&gt; &lt;code&gt;--formatter OffsetsMessageFormatter&lt;/code&gt; lets you watch commits live — an excellent debugging trick.&lt;/li&gt;
        &lt;/ul&gt;&lt;/div&gt;
        &lt;div class=&quot;callout good r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✓&lt;/span&gt;&lt;div&gt;You are not required to use it. Store offsets in &lt;b&gt;your own database, in the same transaction as your writes&lt;/b&gt;, and you get atomic &quot;processed + recorded&quot; semantics — the classic path to end-to-end exactly-once with an external sink.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 04e · WHY IT'S FAST --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s4e&quot; data-ch=&quot;4&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Performance &lt;span class=&quot;num&quot;&gt;/ 04.5&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Why a JVM app on&lt;br&gt;disks beats your cache.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;Kafka's throughput is not the result of clever code; it's the result of four decisions that let it do almost nothing per message.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-4&quot;&gt;
      &lt;div class=&quot;card cy r r4&quot;&gt;&lt;h4&gt;&lt;span class=&quot;n&quot;&gt;01&lt;/span&gt;Sequential IO&lt;/h4&gt;&lt;p&gt;Appending to the tail of a file is the one access pattern every storage device is good at — hundreds of MB/s even on spinning rust, no seeks, no b-tree rebalancing, no write amplification.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card cy r r4&quot;&gt;&lt;h4&gt;&lt;span class=&quot;n&quot;&gt;02&lt;/span&gt;Page cache, not heap&lt;/h4&gt;&lt;p&gt;Writes go to the OS page cache; the kernel flushes them. Reads of recent data never touch disk. No GC pressure, and cache survives a broker &lt;b&gt;process&lt;/b&gt; restart because it lives in the kernel.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card am r r5&quot;&gt;&lt;h4&gt;&lt;span class=&quot;n&quot;&gt;03&lt;/span&gt;Zero copy&lt;/h4&gt;&lt;p&gt;&lt;code&gt;sendfile()&lt;/code&gt; moves bytes from page cache straight to the NIC — no copy into user space, no JVM objects, no serialization on the read path. The broker is mostly a byte pipe.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card am r r5&quot;&gt;&lt;h4&gt;&lt;span class=&quot;n&quot;&gt;04&lt;/span&gt;Batching everywhere&lt;/h4&gt;&lt;p&gt;Producer batches, broker appends batches, consumer fetches batches, followers replicate batches. Every per-request cost is amortized over hundreds of records.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;body-wrap grid-2&quot; style=&quot;margin-top:16px&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub rd&quot;&gt;Things that silently disable the fast path&lt;/div&gt;
        &lt;div class=&quot;callout warn r r6&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✕&lt;/span&gt;&lt;div&gt;&lt;b&gt;TLS&lt;/b&gt; defeats zero-copy: bytes must be encrypted, so they pass through user space. Expect meaningful CPU cost — budget for it rather than discovering it in prod.&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;callout warn r r6&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✕&lt;/span&gt;&lt;div&gt;&lt;b&gt;Broker-side recompression&lt;/b&gt; (timestamp rewriting, old client formats) turns a byte pipe into a CPU-bound transcoder.&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;callout warn r r6&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✕&lt;/span&gt;&lt;div&gt;&lt;b&gt;Lagging consumers&lt;/b&gt; read cold data from disk instead of cache — one badly behaved backfill can push p99 latency up for everyone on the broker.&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;callout warn r r6&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✕&lt;/span&gt;&lt;div&gt;&lt;b&gt;Tiny records, no linger.&lt;/b&gt; &lt;code&gt;linger.ms=0&lt;/code&gt; with 200-byte records means one request per record. Setting &lt;code&gt;linger.ms=5&lt;/code&gt; is often a 10× throughput change for ~5&amp;nbsp;ms of latency.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub&quot;&gt;Durability ≠ fsync&lt;/div&gt;
        &lt;div class=&quot;card r r6&quot;&gt;&lt;p&gt;Kafka does &lt;b&gt;not&lt;/b&gt; fsync every write. &lt;code&gt;log.flush.interval.messages&lt;/code&gt; is effectively unset by default and the kernel decides when pages hit the platter.&lt;/p&gt;
        &lt;p&gt;Durability instead comes from &lt;b&gt;replication&lt;/b&gt;: &lt;code&gt;acks=all&lt;/code&gt; + &lt;code&gt;min.insync.replicas=2&lt;/code&gt; means the data is in the page cache of multiple machines, ideally in different failure domains. Two independent machines losing power in the same second is the risk you're accepting — and it's a better trade than fsync-per-write on every node.&lt;/p&gt;
        &lt;p class=&quot;k-muted&quot; style=&quot;font-size:11.5px;margin-top:8px&quot;&gt;This is worth stating explicitly to any audience with a database background — it is the single most surprising design choice in Kafka, and it's the reason it is fast.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;metrics r r6&quot; style=&quot;margin-top:16px&quot;&gt;
          &lt;div class=&quot;metric&quot;&gt;&lt;div class=&quot;big am&quot;&gt;~2×&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;throughput often gained just by tuning batch + compression&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;metric&quot;&gt;&lt;div class=&quot;big&quot;&gt;5–10×&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;typical compression ratio on JSON payloads with lz4/zstd&lt;/div&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- ============ CHAPTER 05 ============ --&gt;
  &lt;section class=&quot;slide chapter&quot; id=&quot;ch5&quot; data-ch=&quot;5&quot;&gt;
    &lt;div class=&quot;ch-ghost&quot;&gt;05&lt;/div&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Chapter 05 &lt;span class=&quot;num&quot;&gt;/ ~20 min&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;ch-title r r2&quot;&gt;The write path:&lt;br&gt;&lt;span class=&quot;k-cyan&quot;&gt;producers&lt;/span&gt;.&lt;/h2&gt;
    &lt;p class=&quot;ch-q r r3&quot;&gt;The question this chapter answers: &lt;b&gt;what does &lt;code&gt;send()&lt;/code&gt; actually do&lt;/b&gt; — it returns before anything is durable, so where does the record live in between, what confirms it, and how can Kafka promise no duplicates?&lt;/p&gt;
    &lt;div class=&quot;ch-list&quot;&gt;
      &lt;div class=&quot;ch-item r r4&quot;&gt;&lt;b&gt;1 · Partitioning&lt;/b&gt;Key hash or sticky batching — the routing decision.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r4&quot;&gt;&lt;b&gt;2 · Inside the client&lt;/b&gt;Accumulator, linger, sender thread, in-flight requests.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r5&quot;&gt;&lt;b&gt;3 · acks &amp;amp; min.insync&lt;/b&gt;The durability matrix, and the config trap in it.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r5&quot;&gt;&lt;b&gt;4 · Idempotence&lt;/b&gt;PID + epoch + sequence: how the broker rejects duplicates.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r6&quot;&gt;&lt;b&gt;5 · Transactions&lt;/b&gt;Atomic multi-partition writes and read_committed.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r6&quot;&gt;&lt;b&gt;6 · Tuning&lt;/b&gt;Timeouts, retries, compression, and the failure modes.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ch-budget r r6&quot;&gt;Time budget &lt;b&gt;≈20 min&lt;/b&gt; · 6 slides · demo: batching &amp;amp; dedup&lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 05a · PRODUCERS (original) --&gt;
  &lt;section class=&quot;slide&quot; id=&quot;s5a&quot; data-ch=&quot;5&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;The Write Path &lt;span class=&quot;num&quot;&gt;/ 05.1&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;split&quot;&gt;
      &lt;div&gt;
        &lt;h2 class=&quot;r r2&quot;&gt;Producers.&lt;/h2&gt;
        &lt;p class=&quot;lede r r3&quot;&gt;Producers publish records. The &lt;b&gt;partitioner&lt;/b&gt; routes each record: by &lt;b class=&quot;k-amber&quot;&gt;key hash&lt;/b&gt; when a key is set, or sticky batching when it isn't.&lt;/p&gt;
        &lt;ul class=&quot;feat&quot;&gt;
          &lt;li class=&quot;r r4&quot;&gt;&lt;b&gt;Same key → same partition&lt;/b&gt; → ordered per entity.&lt;/li&gt;
          &lt;li class=&quot;r r5&quot;&gt;&lt;b&gt;acks=all&lt;/b&gt; waits for in-sync replicas before confirming.&lt;/li&gt;
          &lt;li class=&quot;r r6&quot;&gt;&lt;b&gt;Batching &amp;amp; compression&lt;/b&gt; boost throughput.&lt;/li&gt;
        &lt;/ul&gt;
        &lt;div class=&quot;callout note r r6&quot; style=&quot;margin-top:20px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;◆&lt;/span&gt;&lt;div&gt;&lt;code&gt;send()&lt;/code&gt; is &lt;b&gt;asynchronous&lt;/b&gt;. It returns a &lt;code&gt;Future&lt;/code&gt; as soon as the record is in a local buffer — long before any broker has seen it. Ignoring that future is the most common way to lose data silently.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stage r r4&quot; id=&quot;stage-prod&quot;&gt;
        &lt;span class=&quot;stage-label&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;producer → partitioner → partitions&lt;/span&gt;
        &lt;svg viewBox=&quot;0 0 640 480&quot; id=&quot;prodsvg&quot;&gt;&lt;/svg&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 05b · INSIDE THE PRODUCER --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s5b&quot; data-ch=&quot;5&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Client Internals &lt;span class=&quot;num&quot;&gt;/ 05.2&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Inside the producer:&lt;br&gt;accumulator &amp;amp; sender.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;A producer is two threads and a buffer. Your thread only fills a batch; a background &lt;b&gt;sender thread&lt;/b&gt; does the network work. Almost every producer tuning question is really a question about this diagram.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-52&quot;&gt;
      &lt;div class=&quot;stage mid r r4&quot; id=&quot;stage-acc&quot;&gt;
        &lt;span class=&quot;stage-label&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;RecordAccumulator — batches per partition&lt;/span&gt;
        &lt;svg viewBox=&quot;0 0 660 400&quot; id=&quot;accsvg&quot;&gt;&lt;/svg&gt;
        &lt;button class=&quot;stage-btn&quot; id=&quot;accBtn&quot;&gt;Toggle linger.ms 0 ⇄ 20&lt;/button&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub&quot;&gt;The journey of one record&lt;/div&gt;
        &lt;div class=&quot;steps r r5&quot; style=&quot;flex-direction:column&quot;&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;1 · SERIALIZE&lt;/span&gt;Key and value serializers turn objects into bytes &lt;b&gt;on your thread&lt;/b&gt;. A slow serializer is your latency.&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;2 · PARTITION&lt;/span&gt;The partitioner picks a partition; the record is appended to that partition's open batch in the &lt;b&gt;RecordAccumulator&lt;/b&gt; (&lt;code&gt;buffer.memory&lt;/code&gt;, 32&amp;nbsp;MB default).&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;3 · WAIT&lt;/span&gt;The batch becomes sendable when it hits &lt;code&gt;batch.size&lt;/code&gt; (16&amp;nbsp;KB) &lt;b&gt;or&lt;/b&gt; &lt;code&gt;linger.ms&lt;/code&gt; elapses. &lt;code&gt;send()&lt;/code&gt; already returned.&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;4 · SEND&lt;/span&gt;The sender thread groups ready batches &lt;b&gt;per broker&lt;/b&gt; into one request — several partitions, one round trip. Up to &lt;code&gt;max.in.flight.requests.per.connection&lt;/code&gt; (5) are outstanding.&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;5 · COMPLETE&lt;/span&gt;The broker's response resolves the futures and fires your callbacks — &lt;b&gt;on the sender thread&lt;/b&gt;, so never block in a callback.&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;callout warn r r6&quot; style=&quot;margin-top:14px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✕&lt;/span&gt;&lt;div&gt;&lt;b&gt;Backpressure is real and it blocks you:&lt;/b&gt; when the buffer fills (consistently slow brokers), &lt;code&gt;send()&lt;/code&gt; blocks for up to &lt;code&gt;max.block.ms&lt;/code&gt; (60s) and then throws. A &quot;fully async&quot; producer &lt;em&gt;will&lt;/em&gt; stall your request threads under duress — measure &lt;code&gt;buffer-available-bytes&lt;/code&gt;.&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;callout good r r6&quot; style=&quot;margin-top:10px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✓&lt;/span&gt;&lt;div&gt;&lt;code&gt;linger.ms=0&lt;/code&gt; does &lt;b&gt;not&lt;/b&gt; mean &quot;no batching&quot; — it means &quot;don't wait deliberately&quot;. Under load, records still batch while a request is in flight. Setting &lt;code&gt;linger.ms=5–20&lt;/code&gt; trades a few ms for dramatically better batching, compression and CPU.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 05c · ACKS MATRIX --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s5c&quot; data-ch=&quot;5&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Durability &lt;span class=&quot;num&quot;&gt;/ 05.3&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;acks × min.insync.replicas.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;These two settings — one on the client, one on the topic — jointly define your data-loss window. They are frequently set independently by different teams, which produces the trap at the bottom of this slide.&lt;/p&gt;
    &lt;div class=&quot;body-wrap tbl-wrap r r4&quot;&gt;
      &lt;table class=&quot;tbl&quot;&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;acks&lt;/th&gt;&lt;th&gt;Leader waits for&lt;/th&gt;&lt;th&gt;Data loss window&lt;/th&gt;&lt;th&gt;Latency&lt;/th&gt;&lt;th&gt;Use when&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;&lt;b class=&quot;k-red&quot;&gt;0&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Nothing — fire and forget, no response at all&lt;/td&gt;&lt;td&gt;Any broker hiccup, any network drop. Silent&lt;/td&gt;&lt;td&gt;Lowest&lt;/td&gt;&lt;td&gt;Sampled metrics, clickstream where 0.1% loss is genuinely fine&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;b class=&quot;k-amber&quot;&gt;1&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Leader wrote to its own page cache&lt;/td&gt;&lt;td&gt;Leader dies before followers replicate → &lt;b&gt;acknowledged data is lost&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Low&lt;/td&gt;&lt;td&gt;Logs, telemetry; the old default and a common accidental setting&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;b class=&quot;k-cyan&quot;&gt;all / -1&lt;/b&gt;&lt;/td&gt;&lt;td&gt;All replicas &lt;b&gt;currently in the ISR&lt;/b&gt; have it&lt;/td&gt;&lt;td&gt;Only if all ISR members die together&lt;/td&gt;&lt;td&gt;+1 network round trip to the slowest ISR member&lt;/td&gt;&lt;td&gt;Anything you would be asked about in a post-mortem&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;div class=&quot;body-wrap grid-2&quot; style=&quot;margin-top:16px&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub rd&quot;&gt;The trap: acks=all is not enough&lt;/div&gt;
        &lt;pre class=&quot;code r r5&quot;&gt;&lt;span class=&quot;c&quot;&gt;# RF=3, ISR has shrunk to just the leader&lt;/span&gt;
&lt;span class=&quot;k&quot;&gt;acks&lt;/span&gt;=all
&lt;span class=&quot;k&quot;&gt;min.insync.replicas&lt;/span&gt;=&lt;span class=&quot;v&quot;&gt;1&lt;/span&gt;      &lt;span class=&quot;c&quot;&gt;← the default!&lt;/span&gt;

&lt;span class=&quot;c&quot;&gt;# &quot;all in-sync replicas&quot; = 1 = the leader alone.&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;# You get an ack. The leader dies. Data is gone.&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;# acks=all quietly degraded to acks=1.&lt;/span&gt;

&lt;span class=&quot;c&quot;&gt;# correct pairing for RF=3:&lt;/span&gt;
&lt;span class=&quot;k&quot;&gt;acks&lt;/span&gt;=all
&lt;span class=&quot;k&quot;&gt;min.insync.replicas&lt;/span&gt;=&lt;span class=&quot;v&quot;&gt;2&lt;/span&gt;      &lt;span class=&quot;c&quot;&gt;topic-level config&lt;/span&gt;

&lt;span class=&quot;c&quot;&gt;# now: 2 replicas must confirm; if only 1 is in&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;# sync the broker REJECTS the write with&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;# NotEnoughReplicasException — fail loud, not silent.&lt;/span&gt;&lt;/pre&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub&quot;&gt;Reasoning about RF and min.insync&lt;/div&gt;
        &lt;div class=&quot;tbl-wrap r r6&quot;&gt;
          &lt;table class=&quot;tbl compact&quot;&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;RF&lt;/th&gt;&lt;th&gt;min.insync&lt;/th&gt;&lt;th&gt;Tolerates&lt;/th&gt;&lt;th&gt;Verdict&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;1 broker down, stays writable; 2 down → reads only&lt;/td&gt;&lt;td class=&quot;k-cyan&quot;&gt;&lt;b&gt;The standard&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;2 down and still writable — but acks are near-meaningless&lt;/td&gt;&lt;td class=&quot;k-red&quot;&gt;Availability over correctness&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;Zero tolerance: any single broker restart blocks writes&lt;/td&gt;&lt;td class=&quot;k-amber&quot;&gt;Too strict in practice&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;No headroom; a rolling restart stops production&lt;/td&gt;&lt;td class=&quot;k-red&quot;&gt;Avoid&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;2 down, still writable&lt;/td&gt;&lt;td&gt;Cross-region / very high value&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;
        &lt;div class=&quot;callout good r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✓&lt;/span&gt;&lt;div&gt;&lt;b&gt;Availability is a choice you make explicitly.&lt;/b&gt; With &lt;code&gt;min.insync=2&lt;/code&gt;, Kafka would rather refuse your write than accept data it can't protect. If the alternative is unnoticed data loss, that rejection is the feature.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 05d · IDEMPOTENCE --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s5d&quot; data-ch=&quot;5&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;No Duplicates &lt;span class=&quot;num&quot;&gt;/ 05.4&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;The idempotent producer.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;Without it, a retry after a lost &lt;em&gt;acknowledgement&lt;/em&gt; (not a lost write) creates a duplicate — the write succeeded, the response didn't arrive. Idempotence lets the broker recognise the retry and discard it. It's &lt;b&gt;on by default&lt;/b&gt; in modern clients, and it's nearly free.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-52&quot;&gt;
      &lt;div class=&quot;stage mid r r4&quot; id=&quot;stage-idem&quot;&gt;
        &lt;span class=&quot;stage-label&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;PID + epoch + sequence — duplicate rejected&lt;/span&gt;
        &lt;svg viewBox=&quot;0 0 660 400&quot; id=&quot;idemsvg&quot;&gt;&lt;/svg&gt;
        &lt;button class=&quot;stage-btn rd&quot; id=&quot;idemBtn&quot;&gt;⚡ Drop the ack → retry&lt;/button&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub am&quot;&gt;The mechanism&lt;/div&gt;
        &lt;div class=&quot;card r r5&quot;&gt;&lt;ul&gt;
          &lt;li&gt;On init the producer gets a &lt;b&gt;producer id (PID)&lt;/b&gt; and an &lt;b&gt;epoch&lt;/b&gt; from the broker.&lt;/li&gt;
          &lt;li&gt;Every batch carries a &lt;b&gt;monotonic sequence number per partition&lt;/b&gt;.&lt;/li&gt;
          &lt;li&gt;Each leader remembers the last sequence it accepted per (PID, partition), for the last 5 batches.&lt;/li&gt;
          &lt;li&gt;Sequence = &lt;b&gt;expected&lt;/b&gt; → append. &lt;b&gt;Already seen&lt;/b&gt; → return success, write nothing. &lt;b&gt;Too far ahead&lt;/b&gt; → &lt;code&gt;OutOfOrderSequenceException&lt;/code&gt;, because a batch was permanently lost and silently accepting would break ordering.&lt;/li&gt;
        &lt;/ul&gt;&lt;/div&gt;
        &lt;pre class=&quot;code r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;k&quot;&gt;enable.idempotence&lt;/span&gt;=true      &lt;span class=&quot;c&quot;&gt;default since 3.0&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;# implies, and validates:&lt;/span&gt;
&lt;span class=&quot;k&quot;&gt;acks&lt;/span&gt;=all
&lt;span class=&quot;k&quot;&gt;retries&lt;/span&gt;&amp;gt;0                    &lt;span class=&quot;c&quot;&gt;effectively MAX_INT&lt;/span&gt;
&lt;span class=&quot;k&quot;&gt;max.in.flight.requests.per.connection&lt;/span&gt; &amp;lt;= &lt;span class=&quot;v&quot;&gt;5&lt;/span&gt;&lt;/pre&gt;
        &lt;div class=&quot;callout good r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✓&lt;/span&gt;&lt;div&gt;&lt;b&gt;The subtle win:&lt;/b&gt; before idempotence, retries with more than one in-flight request could &lt;b&gt;reorder&lt;/b&gt; records (batch 2 lands, batch 1 retries and lands after). With sequence numbers the broker enforces order, so you keep pipelining &lt;em&gt;and&lt;/em&gt; ordering — you no longer have to set &lt;code&gt;max.in.flight=1&lt;/code&gt; and destroy throughput.&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;callout amb r r6&quot; style=&quot;margin-top:10px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;▲&lt;/span&gt;&lt;div&gt;&lt;b&gt;Scope:&lt;/b&gt; this dedups the &lt;b&gt;producer's own retries&lt;/b&gt;, within a partition. It does not dedup your application calling &lt;code&gt;send()&lt;/code&gt; twice for the same business event — that's your idempotency key, not Kafka's.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 05e · TRANSACTIONS --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s5e&quot; data-ch=&quot;5&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Atomicity &lt;span class=&quot;num&quot;&gt;/ 05.5&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Transactions across&lt;br&gt;partitions and topics.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;Idempotence fixes duplicates within one partition. Transactions make a &lt;b&gt;set&lt;/b&gt; of writes — across partitions and topics, plus the consumer's own offset commit — atomically visible or not visible at all. This is the machinery behind &quot;exactly-once&quot; in stream processing.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-2&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub&quot;&gt;consume → transform → produce, atomically&lt;/div&gt;
        &lt;pre class=&quot;code r r4&quot;&gt;&lt;span class=&quot;k&quot;&gt;producer&lt;/span&gt;.initTransactions();   &lt;span class=&quot;c&quot;&gt;// fences old epochs&lt;/span&gt;

&lt;span class=&quot;k&quot;&gt;while&lt;/span&gt; (true) {
  records = consumer.poll(...);
  producer.&lt;b&gt;beginTransaction&lt;/b&gt;();
  &lt;span class=&quot;k&quot;&gt;try&lt;/span&gt; {
    &lt;span class=&quot;k&quot;&gt;for&lt;/span&gt; (r : records) {
      producer.send(&lt;span class=&quot;s&quot;&gt;&quot;enriched&quot;&lt;/span&gt;, transform(r));
      producer.send(&lt;span class=&quot;s&quot;&gt;&quot;audit&quot;&lt;/span&gt;,    audit(r));
    }
    &lt;span class=&quot;c&quot;&gt;// the offsets travel INSIDE the transaction&lt;/span&gt;
    producer.&lt;b&gt;sendOffsetsToTransaction&lt;/b&gt;(
        offsetsOf(records), consumer.groupMetadata());
    producer.&lt;b&gt;commitTransaction&lt;/b&gt;();
  } &lt;span class=&quot;k&quot;&gt;catch&lt;/span&gt; (Exception e) {
    producer.&lt;b&gt;abortTransaction&lt;/b&gt;();   &lt;span class=&quot;c&quot;&gt;// nothing visible&lt;/span&gt;
  }
}

&lt;span class=&quot;c&quot;&gt;# producer side&lt;/span&gt;
&lt;span class=&quot;k&quot;&gt;transactional.id&lt;/span&gt;=&lt;span class=&quot;v&quot;&gt;enricher-7&lt;/span&gt;   &lt;span class=&quot;c&quot;&gt;stable, per instance&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;# consumer side — mandatory, or you see aborted data&lt;/span&gt;
&lt;span class=&quot;k&quot;&gt;isolation.level&lt;/span&gt;=&lt;span class=&quot;v&quot;&gt;read_committed&lt;/span&gt;&lt;/pre&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub am&quot;&gt;What the cluster does&lt;/div&gt;
        &lt;div class=&quot;card r r5&quot;&gt;&lt;ul&gt;
          &lt;li&gt;A &lt;b&gt;transaction coordinator&lt;/b&gt; (a broker, chosen by hashing &lt;code&gt;transactional.id&lt;/code&gt;) owns the transaction and logs its state to &lt;code&gt;__transaction_state&lt;/code&gt;.&lt;/li&gt;
          &lt;li&gt;&lt;code&gt;transactional.id&lt;/code&gt; maps to a PID + &lt;b&gt;epoch&lt;/b&gt;. A new instance with the same id bumps the epoch and &lt;b&gt;fences&lt;/b&gt; the old one — that's how a zombie after a crash can't commit.&lt;/li&gt;
          &lt;li&gt;On commit, the coordinator writes &lt;b&gt;control records&lt;/b&gt; (COMMIT/ABORT markers) into every partition the transaction touched. They occupy offsets but are invisible to your application.&lt;/li&gt;
          &lt;li&gt;&lt;code&gt;read_committed&lt;/code&gt; consumers buffer records past the &lt;b&gt;LSO&lt;/b&gt; and filter aborted ones using those markers, so they only ever hand you committed data.&lt;/li&gt;
        &lt;/ul&gt;&lt;/div&gt;
        &lt;div class=&quot;grid-2 r r6&quot; style=&quot;margin-top:12px;gap:12px&quot;&gt;
          &lt;div class=&quot;callout warn&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✕&lt;/span&gt;&lt;div&gt;&lt;b&gt;Cost:&lt;/b&gt; extra round trips + markers per transaction. Very small transactions are expensive — batch a poll's worth of work, not one record. Expect a real throughput hit versus plain idempotent produce.&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;callout warn&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✕&lt;/span&gt;&lt;div&gt;&lt;b&gt;A hung transaction blocks readers.&lt;/b&gt; &lt;code&gt;read_committed&lt;/code&gt; can't advance past the LSO, so an instance that dies mid-transaction stalls consumers until &lt;code&gt;transaction.timeout.ms&lt;/code&gt; (60s default) aborts it.&lt;/div&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;callout note r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;◆&lt;/span&gt;&lt;div&gt;In &lt;b&gt;Kafka Streams&lt;/b&gt; this is one line: &lt;code&gt;processing.guarantee=exactly_once_v2&lt;/code&gt;. If you're doing Kafka-to-Kafka processing, use Streams (or Flink) rather than hand-rolling the loop on the left.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 05f · PRODUCER TUNING --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s5f&quot; data-ch=&quot;5&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Tuning &amp;amp; Failure &lt;span class=&quot;num&quot;&gt;/ 05.6&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Timeouts, retries,&lt;br&gt;compression.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;Producer timeouts are nested, and people usually tune the wrong one. Here's the hierarchy and the settings that actually move throughput.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-2&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub rd&quot;&gt;The timeout hierarchy&lt;/div&gt;
        &lt;div class=&quot;tbl-wrap r r4&quot;&gt;
          &lt;table class=&quot;tbl compact&quot;&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Setting&lt;/th&gt;&lt;th&gt;Default&lt;/th&gt;&lt;th&gt;Governs&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;max.block.ms&lt;/code&gt;&lt;/td&gt;&lt;td&gt;60 s&lt;/td&gt;&lt;td&gt;How long &lt;code&gt;send()&lt;/code&gt; may block on a &lt;b&gt;full buffer&lt;/b&gt; or missing metadata&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;delivery.timeout.ms&lt;/code&gt;&lt;/td&gt;&lt;td&gt;120 s&lt;/td&gt;&lt;td&gt;&lt;b&gt;The one that matters:&lt;/b&gt; total budget from &lt;code&gt;send()&lt;/code&gt; to success or failure, retries included&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;request.timeout.ms&lt;/code&gt;&lt;/td&gt;&lt;td&gt;30 s&lt;/td&gt;&lt;td&gt;Per single network attempt&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;retry.backoff.ms&lt;/code&gt;&lt;/td&gt;&lt;td&gt;100 ms&lt;/td&gt;&lt;td&gt;Pause between attempts (with jitter)&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;retries&lt;/code&gt;&lt;/td&gt;&lt;td&gt;MAX_INT&lt;/td&gt;&lt;td&gt;Rarely set now — &lt;code&gt;delivery.timeout.ms&lt;/code&gt; is the real bound&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;linger.ms&lt;/code&gt;&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;Deliberate wait to accumulate a batch&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;batch.size&lt;/code&gt;&lt;/td&gt;&lt;td&gt;16 KB&lt;/td&gt;&lt;td&gt;Per-partition batch cap in bytes&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;buffer.memory&lt;/code&gt;&lt;/td&gt;&lt;td&gt;32 MB&lt;/td&gt;&lt;td&gt;Total client-side buffer across all partitions&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;
        &lt;div class=&quot;callout good r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✓&lt;/span&gt;&lt;div&gt;&lt;code&gt;delivery.timeout.ms &amp;gt;= linger.ms + request.timeout.ms&lt;/code&gt; is validated at startup. Set &lt;b&gt;delivery.timeout.ms to your real business deadline&lt;/b&gt; and let the client manage retries inside it.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub&quot;&gt;Compression: pick deliberately&lt;/div&gt;
        &lt;div class=&quot;tbl-wrap r r5&quot;&gt;
          &lt;table class=&quot;tbl compact&quot;&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Codec&lt;/th&gt;&lt;th&gt;Ratio&lt;/th&gt;&lt;th&gt;CPU&lt;/th&gt;&lt;th&gt;Verdict&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;none&lt;/code&gt;&lt;/td&gt;&lt;td&gt;1×&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Only if payloads are already compressed (images, protobuf-ish binary)&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;lz4&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Good&lt;/td&gt;&lt;td&gt;Very low&lt;/td&gt;&lt;td class=&quot;k-cyan&quot;&gt;&lt;b&gt;Best default&lt;/b&gt; — fast enough to be nearly free&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;zstd&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Best&lt;/td&gt;&lt;td&gt;Low–med&lt;/td&gt;&lt;td&gt;Choose when network/storage cost dominates, e.g. cross-AZ&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;snappy&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Fair&lt;/td&gt;&lt;td&gt;Low&lt;/td&gt;&lt;td&gt;Fine, historically common; lz4 usually better&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;gzip&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Good&lt;/td&gt;&lt;td class=&quot;k-red&quot;&gt;High&lt;/td&gt;&lt;td&gt;Avoid — CPU cost is rarely worth it&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;
        &lt;div class=&quot;sub rd&quot; style=&quot;margin-top:16px&quot;&gt;Errors, and what they mean&lt;/div&gt;
        &lt;div class=&quot;card rd r r6&quot;&gt;&lt;ul&gt;
          &lt;li&gt;&lt;code&gt;TimeoutException&lt;/code&gt; — &lt;b&gt;ambiguous by nature.&lt;/b&gt; The write may or may not have landed. With idempotence on, just retry; without it, you're choosing between duplicate and loss.&lt;/li&gt;
          &lt;li&gt;&lt;code&gt;NotEnoughReplicasException&lt;/code&gt; — ISR below &lt;code&gt;min.insync&lt;/code&gt;. The cluster is protecting you; fix replication, don't lower the bar.&lt;/li&gt;
          &lt;li&gt;&lt;code&gt;RecordTooLargeException&lt;/code&gt; — exceeds &lt;code&gt;max.request.size&lt;/code&gt; (client) or &lt;code&gt;message.max.bytes&lt;/code&gt; (broker) or &lt;code&gt;max.message.bytes&lt;/code&gt; (topic). All three must agree.&lt;/li&gt;
          &lt;li&gt;&lt;code&gt;UnknownTopicOrPartitionException&lt;/code&gt; — often just stale metadata during a failover; also what you see when auto-create is off and the topic really doesn't exist.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Callback never fires&lt;/b&gt; — you're blocking inside another callback. The sender thread is single; blocking it stops the whole producer.&lt;/li&gt;
        &lt;/ul&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- ============ CHAPTER 06 ============ --&gt;
  &lt;section class=&quot;slide chapter&quot; id=&quot;ch6&quot; data-ch=&quot;6&quot;&gt;
    &lt;div class=&quot;ch-ghost&quot;&gt;06&lt;/div&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Chapter 06 &lt;span class=&quot;num&quot;&gt;/ ~20 min&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;ch-title r r2&quot;&gt;The read path:&lt;br&gt;&lt;span class=&quot;k-violet&quot;&gt;consumers&lt;/span&gt;.&lt;/h2&gt;
    &lt;p class=&quot;ch-q r r3&quot;&gt;The question this chapter answers: &lt;b&gt;how does a group of processes divide a topic between them without a central scheduler&lt;/b&gt; — and why is &quot;rebalancing&quot; the source of most Kafka production pain?&lt;/p&gt;
    &lt;div class=&quot;ch-list&quot;&gt;
      &lt;div class=&quot;ch-item r r4&quot;&gt;&lt;b&gt;1 · Groups&lt;/b&gt;One partition, one consumer — the assignment rule.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r4&quot;&gt;&lt;b&gt;2 · The poll loop&lt;/b&gt;Fetching, prefetch, and the two timeouts people confuse.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r5&quot;&gt;&lt;b&gt;3 · The protocol&lt;/b&gt;FindCoordinator, JoinGroup, SyncGroup, heartbeats.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r5&quot;&gt;&lt;b&gt;4 · Rebalancing&lt;/b&gt;Eager vs cooperative vs static, and KIP-848.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r6&quot;&gt;&lt;b&gt;5 · Assignors&lt;/b&gt;Range, round-robin, sticky — and why it matters for state.&lt;/div&gt;
      &lt;div class=&quot;ch-item r r6&quot;&gt;&lt;b&gt;6 · Offsets &amp;amp; lag&lt;/b&gt;Commit strategies, duplicates, and monitoring.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ch-budget r r6&quot;&gt;Time budget &lt;b&gt;≈20 min&lt;/b&gt; · 6 slides · demo: rebalance timeline&lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 06a · CONSUMERS &amp; GROUPS (original) --&gt;
  &lt;section class=&quot;slide&quot; id=&quot;s6a&quot; data-ch=&quot;6&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;The Read Path &lt;span class=&quot;num&quot;&gt;/ 06.1&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;split&quot;&gt;
      &lt;div&gt;
        &lt;h2 class=&quot;r r2&quot;&gt;Consumers &amp;amp;&lt;br&gt;consumer groups.&lt;/h2&gt;
        &lt;p class=&quot;lede r r3&quot;&gt;Consumers in the same &lt;b&gt;group&lt;/b&gt; share the work: each partition is assigned to exactly &lt;b&gt;one&lt;/b&gt; consumer in the group. Add consumers → Kafka &lt;b&gt;rebalances&lt;/b&gt;.&lt;/p&gt;
        &lt;ul class=&quot;feat&quot;&gt;
          &lt;li class=&quot;r r4&quot;&gt;Partitions ≥ consumers, or some sit &lt;b&gt;idle&lt;/b&gt;.&lt;/li&gt;
          &lt;li class=&quot;r r5&quot;&gt;Different groups read the &lt;b&gt;same data independently&lt;/b&gt;.&lt;/li&gt;
          &lt;li class=&quot;r r6&quot;&gt;Each group commits its &lt;b&gt;own offsets&lt;/b&gt;.&lt;/li&gt;
        &lt;/ul&gt;
        &lt;div class=&quot;callout amb r r6&quot; style=&quot;margin-top:20px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;▲&lt;/span&gt;&lt;div&gt;The scaling ceiling is the partition count, and it applies &lt;b&gt;per group&lt;/b&gt;. 12 partitions means at most 12 useful consumers in that group — the 13th pod is pure cost.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stage r r4&quot; id=&quot;stage-cons&quot;&gt;
        &lt;span class=&quot;stage-label&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;group: billing-svc (3 consumers)&lt;/span&gt;
        &lt;svg viewBox=&quot;0 0 640 480&quot; id=&quot;conssvg&quot;&gt;&lt;/svg&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 06b · THE POLL LOOP --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s6b&quot; data-ch=&quot;6&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Client Internals &lt;span class=&quot;num&quot;&gt;/ 06.2&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;The poll loop is&lt;br&gt;the whole API.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;&lt;code&gt;poll()&lt;/code&gt; does far more than return records: it joins the group, sends fetches, drives the assignment protocol, and — historically — kept your membership alive. Most consumer bugs are poll-loop bugs.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-2&quot;&gt;
      &lt;div&gt;
        &lt;pre class=&quot;code r r4&quot;&gt;consumer.subscribe(List.of(&lt;span class=&quot;s&quot;&gt;&quot;orders&quot;&lt;/span&gt;));

&lt;span class=&quot;k&quot;&gt;while&lt;/span&gt; (running) {
  &lt;span class=&quot;c&quot;&gt;// ONE call: joins group, heartbeats liveness,&lt;/span&gt;
  &lt;span class=&quot;c&quot;&gt;// fetches, and advances the position&lt;/span&gt;
  records = consumer.&lt;b&gt;poll&lt;/b&gt;(Duration.ofMillis(&lt;span class=&quot;v&quot;&gt;500&lt;/span&gt;));

  &lt;span class=&quot;k&quot;&gt;for&lt;/span&gt; (r : records) {
    process(r);            &lt;span class=&quot;c&quot;&gt;// ← your latency lives here&lt;/span&gt;
  }
  consumer.&lt;b&gt;commitSync&lt;/b&gt;();  &lt;span class=&quot;c&quot;&gt;// after processing = at-least-once&lt;/span&gt;
}
consumer.close();          &lt;span class=&quot;c&quot;&gt;// sends LeaveGroup →&lt;/span&gt;
                           &lt;span class=&quot;c&quot;&gt;// fast rebalance instead of a 45s timeout&lt;/span&gt;&lt;/pre&gt;
        &lt;div class=&quot;callout warn r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✕&lt;/span&gt;&lt;div&gt;&lt;b&gt;The classic outage:&lt;/b&gt; a batch takes longer than &lt;code&gt;max.poll.interval.ms&lt;/code&gt; (5 min). The coordinator assumes the consumer is dead, revokes its partitions, rebalances — then your commit fails with &lt;code&gt;CommitFailedException&lt;/code&gt;, the work is redone elsewhere, and if processing is always slow you get a permanent rebalance loop where nothing ever completes.&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;callout good r r6&quot; style=&quot;margin-top:10px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;✓&lt;/span&gt;&lt;div&gt;Fix by lowering &lt;code&gt;max.poll.records&lt;/code&gt; (bound the work per poll) rather than by raising the timeout — raising it also delays detection of genuinely dead consumers.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub am&quot;&gt;Two timeouts, two failure modes&lt;/div&gt;
        &lt;div class=&quot;tbl-wrap r r5&quot;&gt;
          &lt;table class=&quot;tbl compact&quot;&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Setting&lt;/th&gt;&lt;th&gt;Default&lt;/th&gt;&lt;th&gt;Detects&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;session.timeout.ms&lt;/code&gt;&lt;/td&gt;&lt;td&gt;45 s&lt;/td&gt;&lt;td&gt;&lt;b&gt;Process/host death.&lt;/b&gt; Missed heartbeats from the background thread&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;heartbeat.interval.ms&lt;/code&gt;&lt;/td&gt;&lt;td&gt;3 s&lt;/td&gt;&lt;td&gt;Keep at ~⅓ of session timeout&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;max.poll.interval.ms&lt;/code&gt;&lt;/td&gt;&lt;td&gt;5 min&lt;/td&gt;&lt;td&gt;&lt;b&gt;A livelock:&lt;/b&gt; process alive, but stuck and not calling &lt;code&gt;poll()&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;max.poll.records&lt;/code&gt;&lt;/td&gt;&lt;td&gt;500&lt;/td&gt;&lt;td&gt;Bounds how much work one poll hands you&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;fetch.min.bytes&lt;/code&gt;&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;Raise it to batch harder (broker waits in purgatory)&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;fetch.max.wait.ms&lt;/code&gt;&lt;/td&gt;&lt;td&gt;500&lt;/td&gt;&lt;td&gt;How long the broker holds a fetch waiting for min.bytes&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;max.partition.fetch.bytes&lt;/code&gt;&lt;/td&gt;&lt;td&gt;1 MB&lt;/td&gt;&lt;td&gt;Per-partition response cap — × partitions = memory&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;
        &lt;div class=&quot;callout note r r6&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;◆&lt;/span&gt;&lt;div&gt;Since 0.10.1 heartbeats live on a &lt;b&gt;background thread&lt;/b&gt;, which is exactly why the two failure modes split apart: heartbeats say &quot;the JVM is up&quot;, &lt;code&gt;max.poll.interval&lt;/code&gt; says &quot;the JVM is making progress&quot;.&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;callout amb r r6&quot; style=&quot;margin-top:10px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;▲&lt;/span&gt;&lt;div&gt;&lt;b&gt;Prefetch:&lt;/b&gt; the consumer pipelines fetches, so records for the next poll are usually already in memory. That's why &lt;code&gt;poll(0)&lt;/code&gt; can return instantly and why memory use scales with assigned partitions × &lt;code&gt;max.partition.fetch.bytes&lt;/code&gt;.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 06c · GROUP PROTOCOL --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s6c&quot; data-ch=&quot;6&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;Membership &lt;span class=&quot;num&quot;&gt;/ 06.3&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;How the group&lt;br&gt;agrees on who reads what.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;There is no scheduler assigning partitions. The group elects one member as leader, and &lt;b&gt;that client&lt;/b&gt; computes the assignment — the broker only relays it. Knowing this makes rebalance logs readable.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-52&quot;&gt;
      &lt;div class=&quot;stage mid r r4&quot; id=&quot;stage-group&quot;&gt;
        &lt;span class=&quot;stage-label&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;join → sync → steady state&lt;/span&gt;
        &lt;svg viewBox=&quot;0 0 660 400&quot; id=&quot;groupsvg&quot;&gt;&lt;/svg&gt;
        &lt;button class=&quot;stage-btn&quot; id=&quot;groupBtn&quot;&gt;Run the protocol ▸&lt;/button&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub&quot;&gt;The exchange&lt;/div&gt;
        &lt;div class=&quot;steps r r5&quot; style=&quot;flex-direction:column&quot;&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;1 · FIND COORDINATOR&lt;/span&gt;Client hashes the group id to a partition of &lt;code&gt;__consumer_offsets&lt;/code&gt;; that partition's leader is the &lt;b&gt;group coordinator&lt;/b&gt;.&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;2 · JOIN GROUP&lt;/span&gt;Every member sends its subscriptions and supported assignors. The coordinator holds them all until the group settles, then names the &lt;b&gt;first joiner as group leader&lt;/b&gt; and bumps the &lt;b&gt;generation id&lt;/b&gt;.&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;3 · SYNC GROUP&lt;/span&gt;The &lt;b&gt;leader (a client!)&lt;/b&gt; runs the assignor and sends the full assignment to the coordinator, which fans out each member's slice in its SyncGroup response.&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;n&quot;&gt;4 · STEADY STATE&lt;/span&gt;Members fetch from their partitions and heartbeat. Any membership or metadata change → new generation, repeat.&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;callout note r r6&quot; style=&quot;margin-top:14px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;◆&lt;/span&gt;&lt;div&gt;The &lt;b&gt;generation id&lt;/b&gt; fences stragglers: a commit stamped with an old generation is rejected. That's what &lt;code&gt;CommitFailedException&lt;/code&gt; after a rebalance is telling you — &quot;you no longer own this partition&quot;.&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;callout amb r r6&quot; style=&quot;margin-top:10px&quot;&gt;&lt;span class=&quot;ic&quot;&gt;▲&lt;/span&gt;&lt;div&gt;Rebalance triggers, in order of how often they surprise people: a member joins/leaves/crashes · &lt;code&gt;max.poll.interval&lt;/code&gt; exceeded · &lt;b&gt;partition count of a subscribed topic changes&lt;/b&gt; · a subscription regex starts matching a new topic.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 06d · REBALANCING --&gt;
  &lt;section class=&quot;slide dense&quot; id=&quot;s6d&quot; data-ch=&quot;6&quot;&gt;
    &lt;div class=&quot;eyebrow r r1&quot;&gt;The Painful Part &lt;span class=&quot;num&quot;&gt;/ 06.4&lt;/span&gt;&lt;/div&gt;
    &lt;h2 class=&quot;r r2&quot;&gt;Rebalancing: four&lt;br&gt;generations of fixes.&lt;/h2&gt;
    &lt;p class=&quot;lede r r3&quot;&gt;The original protocol stopped the world. Every improvement since has chipped away at that. Knowing which one you're running determines whether a deploy costs you 50&amp;nbsp;ms or 30 seconds of stalled consumption.&lt;/p&gt;
    &lt;div class=&quot;body-wrap grid-4&quot;&gt;
      &lt;div class=&quot;card rd r r4&quot;&gt;&lt;h4&gt;&lt;span class=&quot;n&quot;&gt;V1&lt;/span&gt;Eager&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Stop the world.&lt;/b&gt; Every member revokes &lt;b&gt;all&lt;/b&gt; partitions, then the group re-assigns from scratch. Nobody consumes during the rebalance.&lt;/p&gt;&lt;p class=&quot;k-red&quot; style=&quot;margin-top:8px&quot;&gt;One pod restart in a 50-pod group pauses &lt;b&gt;all 50&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card am r r4&quot;&gt;&lt;h4&gt;&lt;span class=&quot;n&quot;&gt;V2&lt;/span&gt;Cooperative&lt;br&gt;incremental&lt;/h4&gt;&lt;p&gt;KIP-429. Members keep partitions they'll retain; only &lt;b&gt;moved&lt;/b&gt; partitions are revoked, in a second short rebalance.&lt;/p&gt;&lt;p class=&quot;k-amber&quot; style=&quot;margin-top:8px&quot;&gt;&lt;code&gt;partition.assignment.strategy=&lt;br&gt;CooperativeStickyAssignor&lt;/code&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card cy r r5&quot;&gt;&lt;h4&gt;&lt;span class=&quot;n&quot;&gt;V3&lt;/span&gt;Static&lt;br&gt;membership&lt;/h4&gt;&lt;p&gt;KIP-345. Give each instance a stable &lt;code&gt;group.instance.id&lt;/code&gt;. A restart within &lt;code&gt;session.timeout.ms&lt;/code&gt; &lt;b&gt;reclaims the same partitions with no rebalance at all&lt;/b&gt;.&lt;/p&gt;&lt;p class=&quot;k-cyan&quot; style=&quot;margin-top:8px&quot;&gt;Ideal for StatefulSets and rolling deploys.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card vi r r5&quot;&gt;&lt;h4&gt;&lt;span class=&quot;n&quot;&gt;V4&lt;/span&gt;KIP-848&lt;/h4&gt;&lt;p&gt;The new consumer group protocol: assignment moves to the &lt;b&gt;broker&lt;/b&gt;, driven incrementally, and the stop-the-world barrier disappears entirely.&lt;/p&gt;&lt;p class=&quot;k-violet&quot; style=&quot;margin-top:8px&quot;&gt;&lt;code&gt;group.protocol=consumer&lt;/code&gt; — the default direction of travel in Kafka 4.x.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;body-wrap grid-2&quot; style=&quot;margin-top:16px&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub rd&quot;&gt;Why it hurts more than it looks&lt;/div&gt;
        &lt;div class=&quot;card r r6&quot;&gt;&lt;ul&gt;
          &lt;li&gt;&lt;b&gt;Stateful consumers pay twice.&lt;/b&gt; Losing a partition means discarding local state (a window, a cache, a Streams store) and rebuilding it after reassignment — seconds to minutes, not milliseconds.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Duplicates.&lt;/b&gt; Uncommitted records at revocation are re-delivered to the new owner. Rebalances are the biggest single source of duplicate processing.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Cascades.&lt;/b&gt; Post-rebalance load spikes trip &lt;code&gt;max.poll.interval&lt;/code&gt; on other members, which triggers the next rebalance. Loops are self-sustaining.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Deploys multiply it.&lt;/b&gt; A naive rolling restart of N pods triggers up to 2N rebalances.&lt;/li&gt;
        &lt;/ul&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub&quot;&gt;Practical mitigations, in order&lt;/div&gt;
        &lt;div class=&quot;card cy r r6&quot;&gt;&lt;ul&gt;
          &lt;li&gt;Use &lt;b&gt;cooperative sticky&lt;/b&gt; (or the new protocol) — one config line, immediate win.&lt;/li&gt;
          &lt;li&gt;Add &lt;b&gt;&lt;code&gt;group.instance.id&lt;/code&gt;&lt;/b&gt; for anything stateful or frequently redeployed.&lt;/li&gt;
          &lt;li&gt;Implement &lt;code&gt;ConsumerRebalanceListener&lt;/code&gt;: &lt;b&gt;commit in &lt;code&gt;onPartitionsRevoked&lt;/code&gt;&lt;/b&gt;, and warm/flush state in the callbacks.&lt;/li&gt;
